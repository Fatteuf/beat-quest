<title>Beat Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* Layout: one portrait phone column (max 430px). Screens stack absolutely inside #app; bottom tab bar; RPG "window" panels with notched pixel corners. Deliberately single dark theme: a night-time pixel world. */
:root{
  --void:#07050d;      /* outside the phone */
  --night:#0f0b1c;     /* app ground */
  --panel:#1a1430;     /* RPG window fill */
  --panel2:#241c40;    /* raised fill */
  --edge:#3d3166;      /* window border */
  --ink:#f1e7d0;       /* parchment text */
  --dim:#a092c2;       /* secondary text */
  --amber:#ffb547;     /* primary accent: warm lamp light */
  --magenta:#ff4f9a;   /* enemies, damage, snare */
  --neon:#3ef0c8;      /* success, hi-hat, crit */
  --violet:#a98bff;    /* bass, magic, understanding */
  --leaf:#6fd36a;      /* forest */
  --f-disp:'Silkscreen','Courier New',monospace;
  --f-body:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --f-num:'VT323','Courier New',monospace;
  --notch:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
.btn:focus-visible,.menubtn:focus-visible,.abbtn:focus-visible,.tool:focus-visible,.jam:focus-visible,.pad:focus-visible,.pip-cta:focus-visible,.trio button:focus-visible,.gcard:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--neon)}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
canvas.bg{object-fit:cover}
#app{position:relative;width:100%;max-width:430px;height:100%;background:var(--night);overflow:hidden;isolation:isolate}
@media (min-width:520px){#app{height:min(100%,920px);box-shadow:0 0 0 4px #1d1733,0 0 0 8px #0c0916,0 30px 80px rgba(0,0,0,.6)}}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 104px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.full{padding-bottom:24px}
.screen.enter{animation:enter .28s steps(5) both}
@keyframes enter{from{transform:translateY(8px)}to{transform:none}}

/* type */
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:20px;line-height:1.15}
h3{font-size:15px;line-height:1.2}
p{margin:0}
.eyebrow{font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{justify-content:space-between}

/* RPG windows & buttons */
.win{background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);padding:14px;position:relative}
.win.raised{background:var(--panel2)}
.btn{font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.06em;min-height:50px;padding:10px 16px;border:3px solid #2a1606;background:var(--amber);color:#2a1606;clip-path:var(--notch);box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.35);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-transform:uppercase;transition:transform .06s steps(2)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.2)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:var(--panel2);color:var(--ink);border-color:var(--edge);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.btn.neon{background:var(--neon);color:#062a22;border-color:#062a22}
.btn.pink{background:var(--magenta);color:#2b0515;border-color:#2b0515}
.btn.violet{background:var(--violet);color:#1a1040;border-color:#1a1040}
.btn.sm{min-height:44px;font-size:12px;padding:6px 12px}
.btn.big{min-height:62px;font-size:17px}
.chip{font-family:var(--f-disp);font-size:11px;letter-spacing:.08em;padding:4px 8px;background:var(--panel2);border:2px solid var(--edge);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.chip.neon{border-color:var(--neon);color:var(--neon)}
.chip.pink{border-color:var(--magenta);color:var(--magenta)}
.chip.violet{border-color:var(--violet);color:var(--violet)}
.bar{height:12px;background:#0a0714;border:2px solid var(--edge);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.28) 6px 8px),var(--c,var(--amber));transition:width .6s steps(12)}

/* top bar */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:14px 0 10px;background:linear-gradient(var(--night) 70%,transparent)}
.topbar .title{font-family:var(--f-disp);font-size:16px;font-weight:700;flex:1;min-width:0}
.iconbtn{min-width:44px;min-height:44px;background:var(--panel2);border:2px solid var(--edge);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-disp);font-size:13px;padding:0 10px}

/* bottom nav */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:#0b0816;border-top:3px solid var(--edge);padding:6px 4px 10px}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-height:54px;font-family:var(--f-disp);font-size:9.5px;letter-spacing:.06em;color:var(--dim);opacity:.8;position:relative}
#nav button.on{color:var(--amber);opacity:1}
#nav button.on canvas{filter:drop-shadow(0 0 6px rgba(255,181,71,.55))}
#nav .badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:18px;height:18px;padding:0 4px;background:var(--magenta);color:#2b0515;font-family:var(--f-num);font-size:16px;line-height:18px;text-align:center}

/* title */
#s-title{padding:0}
.title-scene{position:absolute;inset:0}
.title-scene canvas{width:100%;height:100%}
.title-ui{position:relative;z-index:2;min-height:100%;padding:13% 20px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.logo{font-family:var(--f-disp);font-weight:700;font-size:clamp(46px,15vw,64px);line-height:.9;color:var(--amber);text-shadow:0 4px 0 #b3561a,0 8px 0 #5a2410,0 12px 18px rgba(0,0,0,.7);letter-spacing:.02em}
.logo span{display:block;color:var(--ink);text-shadow:0 4px 0 #7b6aa8,0 8px 0 #2d2350,0 12px 18px rgba(0,0,0,.7)}
.tagline{font-size:17px;color:var(--ink);max-width:30ch;text-shadow:0 2px 0 #000}
.title-hero{margin-top:auto;display:flex;align-items:flex-end;gap:10px}
.vtag{font-family:var(--f-disp);font-size:11px;letter-spacing:.16em;color:#2a1606;background:var(--neon);padding:3px 8px}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

/* home */
.hero-card{padding:0;overflow:hidden}
.scene{position:relative;height:200px;background:#120e22}
.scene canvas.bg{width:100%;height:100%}
.sprite{position:absolute;bottom:22px}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.float{animation:float 2.4s steps(6) infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.plate{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.plate .lvl{font-family:var(--f-disp);font-size:18px;font-weight:700}
.rankline{font-size:15px;color:var(--dim)}
.rankline b{color:var(--ink);font-weight:600}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel);border:2px solid var(--edge);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.stat b{font-family:var(--f-num);font-size:30px;line-height:.9;font-weight:400}
.stat span{font-size:12px;color:var(--dim);line-height:1.1}
.menugrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menubtn{background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);min-height:66px;padding:12px;display:flex;align-items:center;gap:12px;font-family:var(--f-disp);font-size:12px;font-weight:700;text-align:left;letter-spacing:.04em}
.menubtn:active{background:var(--panel2)}
.menubtn canvas{flex:none}
.pip-cta{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#2a1d0c,var(--panel));border:3px solid #6a4718;clip-path:var(--notch);padding:12px 14px;text-align:left;width:100%}
.pip-cta b{font-family:var(--f-disp);font-size:13px;color:var(--amber)}
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg{background:var(--panel);border:2px solid var(--edge);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-disp);font-size:9.5px;letter-spacing:.06em;text-align:center;min-height:78px;justify-content:center}
.seg b{font-family:var(--f-num);font-size:18px;font-weight:400;color:var(--dim);letter-spacing:0}
.seg.done{border-color:var(--neon);color:var(--neon)}
.seg.next{border-color:var(--amber);color:var(--amber);background:#241a0a}
.seg.lock{opacity:.45}
.today{font-family:var(--f-num);font-size:22px;color:var(--neon)}

/* map */
.mapwrap{position:relative;margin-inline:-16px}
.mapwrap canvas{width:100%;height:auto}
.mnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.mnode .pin{width:44px;height:44px;display:grid;place-items:center;background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);font-family:var(--f-disp);font-size:18px;font-weight:700}
.mnode.open .pin{border-color:var(--amber);background:#2b1d0a;color:var(--amber);animation:pulse 1.2s steps(3) infinite}
.mnode.clear .pin{border-color:var(--neon);background:#0b2a24}
.mnode .lab{font-family:var(--f-disp);font-size:11px;font-weight:700;background:rgba(10,7,20,.86);padding:3px 6px;border:2px solid var(--edge);white-space:nowrap}
.mnode.locked .lab{color:var(--dim)}
.mnode .tag{font-family:var(--f-disp);font-size:8.5px;color:var(--amber);letter-spacing:.1em;background:rgba(10,7,20,.86);padding:1px 4px}
@keyframes pulse{50%{filter:brightness(1.7)}}
.maphero{position:absolute;margin:-42px 0 0 -16px;pointer-events:none}

/* region path */
.region-banner{padding:0;overflow:hidden}
.region-banner .scene{height:150px}
.region-banner .over{position:absolute;left:14px;bottom:12px;right:14px}
.path{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}
.path::before{content:"";position:absolute;left:12px;top:18px;bottom:18px;width:4px;background:repeating-linear-gradient(var(--edge) 0 6px,transparent 6px 12px)}
.stage{position:relative;width:100%;text-align:left;display:flex;gap:12px;align-items:center;background:var(--panel);border:3px solid var(--edge);padding:12px}
.stage::before{content:"";position:absolute;left:-32px;top:50%;width:18px;height:18px;margin-top:-9px;background:var(--edge)}
.stage.done{border-color:#1f5c50}
.stage.done::before{background:var(--neon)}
.stage.current{border-color:var(--amber);background:#221a0c}
.stage.current::before{background:var(--amber);animation:blink 1s steps(2) infinite}
.stage.locked{opacity:.55}
.stage .ic{width:44px;height:44px;display:grid;place-items:center;background:#0b0816;flex:none}
.stage .k{font-family:var(--f-disp);font-size:10px;letter-spacing:.12em;color:var(--dim)}
.stage.current .k{color:var(--amber)}
.stage .t{font-family:var(--f-disp);font-size:14px;font-weight:700}
.stage .s{font-size:14px;color:var(--dim)}
.stage .st{font-family:var(--f-disp);font-size:10px;text-align:right;flex:none;color:var(--dim)}

/* lesson */
.lhead{position:sticky;top:0;z-index:5;background:var(--night);padding:14px 0 10px;display:flex;flex-direction:column;gap:10px}
.stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.stepper span{font-family:var(--f-disp);font-size:7.5px;letter-spacing:.04em;text-align:center;padding:6px 0 5px;background:var(--panel);border-bottom:3px solid var(--edge);color:var(--dim);overflow:hidden}
.stepper span.on{color:var(--amber);border-color:var(--amber)}
.stepper span.ok{color:var(--neon);border-color:var(--neon)}
.lbody{display:flex;flex-direction:column;gap:14px;padding-bottom:12px}
.lbody.enter{animation:enter .28s steps(5) both}
.lfoot{position:sticky;bottom:0;padding:12px 0 18px;background:linear-gradient(transparent,var(--night) 30%)}
.pip-say{display:flex;gap:12px;align-items:flex-start}
.pip-say canvas{flex:none}
.bubble{background:var(--ink);color:#1a1226;padding:12px 14px;clip-path:var(--notch);font-size:16.5px;line-height:1.45;position:relative;flex:1;min-width:0}
.bubble b{color:#8a3d06}
.big-title{font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1.1;text-wrap:balance}
.lamp{width:72px;height:72px;margin:6px auto;background:var(--amber);border:6px solid #5a3a10;clip-path:var(--notch)}
.lamp.go{animation:lamp var(--dur,1s) steps(2) infinite}
@keyframes lamp{0%{filter:brightness(1.3);transform:scale(1.06)}50%{filter:brightness(.45);transform:scale(.94)}}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.abbtn{background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.abbtn .L{font-family:var(--f-disp);font-size:26px;font-weight:700;color:var(--amber);line-height:1}
.abbtn.playing{border-color:var(--amber);background:#241a0a}
.abbtn.heard .L::after{content:" ✓";color:var(--neon);font-size:16px}
.abbtn small{font-size:14px;color:var(--dim);line-height:1.25}
.scope{width:100%;height:64px;background:#08060f;border:2px solid var(--edge)}
.ruler{display:flex;flex-direction:column;gap:4px}
.ruler div{display:flex;justify-content:space-between;padding:6px 10px;background:var(--panel);border-left:4px solid var(--edge);font-size:15px}
.ruler div.on{border-color:var(--amber);background:#241a0a;color:var(--amber)}
.ruler div.seen:not(.on){border-color:#1f5c50}
.ruler .num{font-size:19px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:10px;background:#0a0714;border:2px solid var(--edge)}
input[type=range]::-moz-range-track{height:10px;background:#0a0714;border:2px solid var(--edge)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;margin-top:-10px;background:var(--amber);border:3px solid #2a1606;border-radius:0}
input[type=range]::-moz-range-thumb{width:18px;height:22px;background:var(--amber);border:3px solid #2a1606;border-radius:0}
.bpmread{font-family:var(--f-num);font-size:64px;line-height:.8;color:var(--amber);text-align:center}
.check{display:flex;flex-direction:column;gap:6px}
.check div{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.check div::before{content:"";flex:none;width:14px;height:14px;margin-top:3px;border:2px solid var(--dim)}
.check div.ok{color:var(--neon)}
.check div.ok::before{background:var(--neon);border-color:var(--neon)}
.check div.no{color:var(--magenta)}
.check div.no::before{background:var(--magenta);border-color:var(--magenta)}
.fb{font-size:15.5px;padding:10px 12px;border-left:4px solid var(--magenta);background:#2a0f1e}
.fb.good{border-color:var(--neon);background:#0b2620}
.trio{display:grid;gap:10px}
.trio button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);padding:12px}
.trio button canvas{flex:none}
.trio b{font-family:var(--f-disp);font-size:14px}
.trio p{font-size:15px;color:var(--dim)}
.zone{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.zone span{font-family:var(--f-disp);font-size:10px;text-align:center;padding:8px 2px;background:var(--panel);border-bottom:3px solid var(--edge);color:var(--dim)}
.zone span.on{color:var(--amber);border-color:var(--amber)}
.zone span.seen{color:var(--neon);border-color:var(--neon)}

/* hints */
.hintbar{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hintbar .btn{min-height:40px;font-size:11px}
.hinttxt{font-size:15px;color:var(--amber);border-left:3px solid var(--amber);padding-left:10px}
.hinttxt:empty{display:none}

/* sequencer */
.seq{display:flex;flex-direction:column;gap:8px}
.beatrow,.cells{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.beatrow span{font-family:var(--f-num);font-size:15px;text-align:center;color:#5c5184;line-height:1}
.beatrow span.b{color:var(--amber)}
.trk-h{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:11px;letter-spacing:.08em;margin-bottom:4px}
.trk-h .dot{width:10px;height:10px;flex:none}
.trk-h input{flex:1;min-width:0;height:22px}
.trk-h .vv{font-family:var(--f-num);font-size:16px;color:var(--dim);width:28px;text-align:right}
.cell{height:40px;min-width:0;background:#130f24;border:0;padding:0;box-shadow:inset 0 0 0 2px #2a2248;font-family:var(--f-disp);font-size:10px;font-weight:700;color:#130f24}
.cell.beat{background:#1d1736;box-shadow:inset 0 0 0 2px #3d3166}
.cell.on{background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35)}
.cell.on.off{box-shadow:inset 0 0 0 3px var(--magenta)}
.cell.ph{outline:2px solid var(--ink);outline-offset:-2px;filter:brightness(1.4)}
.cell.lockc{cursor:default}
.cell.demo{outline:3px dashed var(--neon);outline-offset:-3px}
.transport{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bpmbox{display:flex;align-items:center;gap:4px;background:#0a0714;border:2px solid var(--edge);padding:2px}
.bpmbox button{width:40px;height:40px;background:var(--panel2);border:0;font-family:var(--f-disp);font-size:16px}
.bpmbox .num{font-size:26px;min-width:52px;text-align:center;color:var(--amber)}
.barc{font-family:var(--f-num);font-size:22px;color:var(--dim);margin-left:auto}

/* tap widget */
.tapw{display:flex;flex-direction:column;align-items:center;gap:12px}
.tapdots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tapdots i{width:16px;height:16px;background:#130f24;border:2px solid var(--edge)}
.tapdots i.hit{background:var(--neon);border-color:var(--neon)}
.tapdots i.miss{background:var(--magenta);border-color:var(--magenta)}
.tapdots i.now{border-color:var(--amber)}
.pad{width:min(62vw,220px);aspect-ratio:1;max-width:100%;background:var(--panel2);border:4px solid var(--edge);clip-path:var(--notch);font-family:var(--f-disp);font-size:24px;font-weight:700;color:var(--dim);touch-action:none;user-select:none;-webkit-user-select:none}
.pad.flash{background:#3a2a10;border-color:var(--amber);color:var(--amber)}
.pad.pressed{transform:scale(.96);background:#0e3a30;color:var(--neon)}
.tapmsg{font-size:16px;text-align:center;min-height:2.8em}
.tapstat{font-family:var(--f-num);font-size:20px;color:var(--violet)}

/* quantize lane */
.lane{position:relative;height:64px;background:#08060f;border:2px solid var(--edge);overflow:hidden}
.lane .gl{position:absolute;top:0;bottom:0;width:1px;background:#2a2248}
.lane .gl.b{width:2px;background:#4d3f80}
.lane .gl.g{background:rgba(62,240,200,.6)}
.lane .nt{position:absolute;top:14px;width:10px;height:22px;margin-left:-5px;background:var(--neon);transition:left .5s steps(5)}
.lane .nt.k{top:42px;background:var(--amber);height:14px}
.qbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:12px}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qdots{display:flex;gap:5px;flex-wrap:wrap}
.qdots i{width:14px;height:14px;background:#130f24;border:2px solid var(--edge)}
.qdots i.ok{background:var(--neon);border-color:var(--neon)}
.qdots i.no{background:var(--magenta);border-color:var(--magenta)}
.qdots i.cur{border-color:var(--amber)}
.qprompt{font-size:18px;line-height:1.4}
.qplays{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.qplays .btn.heard{border-color:var(--neon)}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(92px,1fr));gap:8px}
.qopts.wide{grid-template-columns:1fr}
.qopts.wide .btn{justify-content:flex-start;text-align:left;text-transform:none;font-family:var(--f-body);font-size:16px;font-weight:600;letter-spacing:0}
.qopt.correct{background:var(--neon)!important;color:#062a22!important;border-color:#062a22!important;filter:none!important}
.qopt.wrong{background:var(--magenta)!important;color:#2b0515!important;border-color:#2b0515!important;filter:none!important}
.qopt.reveal{outline:3px dashed var(--neon);outline-offset:-7px}
.viz{width:100%;background:#08060f;border:2px solid var(--edge);display:block}
.vizhost:empty{display:none}
.vizhost{display:flex;flex-direction:column;gap:6px}
.vizcap{font-family:var(--f-disp);font-size:10px;letter-spacing:.1em;color:var(--dim)}

/* skirmish */
.skarena{position:relative;height:150px;margin-inline:-16px;overflow:hidden;background:#100c1e}
.skarena canvas.bg{width:100%;height:100%}
.skmon{position:absolute;right:14%;bottom:26px;transform-origin:50% 100%}
.skmon.slime canvas{animation:squish .9s steps(3) infinite;transform-origin:50% 100%}
.skhero{position:absolute;left:12%;bottom:14px}
.skhp{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.skhp i{width:22px;height:12px;background:var(--magenta);border:2px solid #2b0515}
.skhp i.gone{background:#2a2248;border-color:var(--edge)}

/* battle */
#s-battle{padding-top:12px}
.bt-top{display:flex;flex-direction:column;gap:6px}
.bt-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bt-name h2{font-size:17px;color:var(--magenta)}
.hpbar{--c:var(--magenta);height:16px}
.tests{font-size:14px;color:var(--violet)}
.arena{position:relative;height:230px;margin:10px -16px 0;overflow:hidden;background:#100c1e}
#s-battle.puzzle .arena{height:150px}
.arena canvas.bg{width:100%;height:100%}
.enemy{position:absolute;right:12%;top:26px;transform-origin:50% 100%}
.enemy.slime canvas{animation:squish .9s steps(3) infinite;transform-origin:50% 100%}
@keyframes squish{50%{transform:scale(1.08,.9)}}
.enemy.hurt,.skmon.hurt{animation:hurt .4s steps(4)}
@keyframes hurt{25%{transform:translateX(-10px);filter:brightness(3)}50%{transform:translateX(8px)}75%{transform:translateX(-4px);filter:brightness(2)}}
.enemy.dead,.skmon.dead{animation:die .9s steps(6) forwards}
@keyframes die{to{opacity:0;transform:scale(1.4,.1)}}
.bpmtag{position:absolute;right:10px;top:8px;font-family:var(--f-num);font-size:20px;color:var(--amber);background:rgba(10,7,20,.8);padding:0 6px}
.bhero{position:absolute;left:12%;bottom:16px}
.arena.shake,.skarena.shake{animation:shake .35s steps(4)}
@keyframes shake{25%{transform:translate(6px,-3px)}50%{transform:translate(-6px,3px)}75%{transform:translate(3px,2px)}}
.arena .flashred{position:absolute;inset:0;background:var(--magenta);opacity:0;pointer-events:none}
.arena .flashred.go{animation:fr .4s steps(3)}
@keyframes fr{30%{opacity:.35}}
.pop{position:absolute;left:68%;top:30px;font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.1;text-align:center;color:var(--ink);text-shadow:0 3px 0 #000;animation:pop 1.1s steps(8) forwards;pointer-events:none;white-space:nowrap;transform:translateX(-50%)}
.pop.crit{font-size:20px;color:var(--neon)}
.pop.miss{color:var(--dim)}
@keyframes pop{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-50px}}
.spark{position:absolute;left:75%;top:80px;width:6px;height:6px;pointer-events:none;animation:spark .7s steps(6) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.hearts{display:flex;gap:4px;align-items:center;margin:10px 0 8px}
.hearts .eyebrow{margin-right:6px}
.dialog{min-height:92px;cursor:pointer}
.dialog p{font-size:17px;line-height:1.45}
.dialog .who{font-family:var(--f-disp);font-size:11px;color:var(--amber);letter-spacing:.1em;margin-bottom:4px}
.bt-act{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actgrid .btn:first-child{grid-column:1/-1}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* modals */
.modal-back{position:absolute;inset:0;z-index:50;background:rgba(5,3,10,.78);display:flex;align-items:center;justify-content:center;padding:16px;animation:enter .2s steps(4)}
.modal{width:100%;max-height:92%;overflow-y:auto;overflow-x:hidden;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.modal.left{text-align:left;align-items:stretch}
.rw-t{font-size:26px;color:var(--amber);text-shadow:0 3px 0 #5a2410}
.rw-list{display:flex;flex-direction:column;gap:8px;width:100%}
.rw-i{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-disp);font-size:13px;padding:10px;background:var(--panel2);animation:enter .3s steps(4) both;flex-wrap:wrap}
.rw-i b{font-family:var(--f-num);font-size:28px;font-weight:400;color:var(--neon)}
.lvup{font-family:var(--f-disp);font-weight:700;font-size:18px;color:var(--neon);animation:blink .5s steps(2) 4}
.dramatic{background:radial-gradient(circle at 50% 42%,#3a2408,#05030a 70%)}
.dramatic.violetbg{background:radial-gradient(circle at 50% 42%,#2a1a55,#05030a 70%)}
.unlock{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:10px 6px;width:100%}
.rays{position:absolute;left:50%;top:120px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(255,181,71,.16) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;pointer-events:none;-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%)}
.violetbg .rays{background:repeating-conic-gradient(rgba(169,139,255,.18) 0 10deg,transparent 10deg 20deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.ul-icon{position:relative;animation:grow .8s steps(8) both}
@keyframes grow{from{transform:scale(0)}70%{transform:scale(1.2)}to{transform:scale(1)}}
.unlock h2{font-size:28px;color:var(--amber);text-shadow:0 4px 0 #5a2410;position:relative}
.violetbg .unlock h2{color:var(--violet);text-shadow:0 4px 0 #1a1040}
.unlock .weapon{font-family:var(--f-disp);font-size:12px;color:var(--neon);letter-spacing:.12em;position:relative}
.unlock p,.unlock .btn{position:relative}
.because{font-family:var(--f-disp);font-size:11px;letter-spacing:.1em;color:var(--ink);background:rgba(169,139,255,.2);padding:6px 10px;position:relative}

/* mastery */
.mbars{display:grid;grid-template-columns:auto 1fr 30px;gap:5px 8px;align-items:center;font-size:13px;width:100%;text-align:left}
.mbars .bar{height:9px}
.mbars .num{font-size:18px;text-align:right}
.memo{display:inline-flex;gap:3px;vertical-align:middle}
.memo i{width:9px;height:9px;border:2px solid var(--edge)}
.memo i.on{background:var(--neon);border-color:var(--neon)}
.skills{display:flex;flex-direction:column;gap:6px}
.skill{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 12px;background:var(--panel);border:2px solid var(--edge);text-align:left;width:100%}
.skill .n{font-family:var(--f-disp);font-size:12px;font-weight:700}
.skill .d{font-size:13px;color:var(--dim);grid-column:1/-1}
.skill.unk{opacity:.6}
.skill.unk .n{color:var(--dim)}
.skill .pct{font-family:var(--f-num);font-size:24px;color:var(--amber);line-height:1}
.skill .tri{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.skill .tri div{display:flex;flex-direction:column;gap:2px;font-size:11px;color:var(--dim)}
.skill .tri .bar{height:7px;border-width:1px}
.tierhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.subtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{flex:none;min-height:42px;padding:0 12px;background:var(--panel);border:0;border-bottom:3px solid var(--edge);font-family:var(--f-disp);font-size:11px;letter-spacing:.08em;color:var(--dim)}
.subtabs button.on{color:var(--amber);border-color:var(--amber)}
.ladder{display:flex;flex-direction:column;gap:5px}
.rung{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;padding:8px 10px;background:var(--panel);border-left:4px solid var(--edge);font-size:15px}
.rung .num{font-size:20px;color:var(--dim)}
.rung small{display:block;font-size:12px;color:var(--dim)}
.rung.done{border-color:var(--neon)}
.rung.done .num{color:var(--neon)}
.rung.cur{border-color:var(--amber);background:#241a0a}
.rung.cur .num{color:var(--amber)}
.rung.fut{opacity:.55}
.gcard{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);padding:12px;width:100%}
.gcard.lock{opacity:.7}
.gcard .t{font-family:var(--f-disp);font-size:13px;font-weight:700}
.gcard .s{font-size:14px;color:var(--dim)}
.stars{font-family:var(--f-num);font-size:20px;color:var(--amber);letter-spacing:2px}
.abil{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;background:var(--panel);border:2px solid var(--edge)}
.abil.have{border-color:var(--violet)}
.abil .t{font-family:var(--f-disp);font-size:13px;font-weight:700}
.abil.have .t{color:var(--violet)}
.abil p{font-size:14px;color:var(--dim)}
.beasts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.beast{background:var(--panel);border:2px solid var(--edge);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--f-disp);font-size:9px;text-align:center;min-height:112px;justify-content:flex-end;letter-spacing:.04em}
.beast.def{border-color:#1f5c50}
.beast.unk{color:#5c5184}

/* studio */
.room{padding:0;overflow:hidden}
.room .scene{height:190px}
.gear{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gear div{background:var(--panel);border:2px solid var(--edge);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-disp);font-size:8px;text-align:center;line-height:1.1;letter-spacing:.04em}
.gear div.have{border-color:var(--amber);color:var(--amber)}
.gear div:not(.have){color:#6a5f9a}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jam{min-height:90px;border:3px solid var(--edge);clip-path:var(--notch);background:var(--panel2);font-family:var(--f-disp);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none}
.jam.hit{background:var(--c);color:#130f24}
.spec{width:100%;height:48px;background:#08060f;border:2px solid var(--edge)}
.cbanner{border-color:var(--amber);background:#221a0c}
.scorebars{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.scorebars div{display:grid;grid-template-columns:1fr 2fr 40px;gap:8px;align-items:center;font-size:15px}
.scorebars .num{font-size:22px;text-align:right}
.tips{text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.tips p{font-size:15px;padding-left:14px;position:relative}
.tips p::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;background:var(--amber)}
.knobrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-family:var(--f-disp);font-size:11px;letter-spacing:.08em}
.knobrow .num{font-size:18px;color:var(--amber);min-width:44px;text-align:right}

/* compressor rig */
.rig{display:flex;flex-direction:column;gap:10px}
.knobs{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.knob{display:flex;flex-direction:column;gap:0}
.knob label{font-family:var(--f-disp);font-size:10px;letter-spacing:.1em;display:flex;justify-content:space-between;align-items:baseline}
.knob label span{font-family:var(--f-num);font-size:19px;color:var(--amber);letter-spacing:0}
.knob.off{opacity:.35;pointer-events:none}
.knob.hot label{color:var(--neon)}
.rigviz{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rigviz canvas{width:100%;height:auto;background:#08060f;border:2px solid var(--edge)}
.grm{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-family:var(--f-disp);font-size:10px;letter-spacing:.08em}
.grm .bar{height:14px}
.grm .num{font-size:19px;color:var(--magenta);min-width:54px;text-align:right}
.tip{font-size:14.5px;color:var(--neon);min-height:1.3em}
.disc div{font-size:15px}

/* trial */
.brief{border-color:var(--violet);background:#1a1438}
.brief .quote{font-size:17px;font-style:italic}

/* coach */
.sheet{position:absolute;inset:0;z-index:60;background:rgba(5,3,10,.7);display:flex;align-items:flex-end}
.sheet-in{width:100%;height:88%;background:var(--panel);border-top:3px solid var(--amber);display:flex;flex-direction:column;animation:up .25s steps(5)}
@keyframes up{from{transform:translateY(40%)}}
.sheet-h{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:2px solid var(--edge)}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;font-size:15.5px;line-height:1.45;white-space:pre-wrap;clip-path:var(--notch)}
.msg.me{align-self:flex-end;background:var(--amber);color:#2a1606}
.msg.pip{align-self:flex-start;background:var(--ink);color:#1a1226}
.msg.note{align-self:center;background:none;color:var(--dim);font-size:13px;text-align:center;clip-path:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;max-height:40%;overflow-y:auto;padding-bottom:16px}
.chips button{flex:none;background:var(--panel2);border:2px solid var(--edge);padding:8px 10px;font-size:14px;white-space:nowrap;min-height:40px}
.composer{display:flex;gap:8px;padding:10px 16px 16px;border-top:2px solid var(--edge)}
.composer input{flex:1;min-width:0;min-height:48px;background:#0a0714;border:2px solid var(--edge);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}

#wipe{position:absolute;inset:0;z-index:40;pointer-events:none;background:var(--night);opacity:0}
#wipe.go{animation:wipe .3s steps(4)}
@keyframes wipe{0%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:16px;right:16px;top:14px;z-index:70;background:var(--panel2);border:3px solid var(--neon);clip-path:var(--notch);padding:10px 14px;font-family:var(--f-disp);font-size:12px;letter-spacing:.06em;color:var(--neon);animation:toast 2.8s steps(6) forwards;pointer-events:none}
.toast.violet{border-color:var(--violet);color:var(--violet)}
@keyframes toast{0%{transform:translateY(-120%)}12%,85%{transform:none}100%{transform:translateY(-120%)}}
.victory-hero{display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:18px 0 6px}
.learned{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.learned span{background:var(--panel2);padding:8px 10px;font-size:14.5px;border-left:3px solid var(--neon)}
.then-now{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}
.then-now div{padding:10px;background:var(--panel2);font-size:15px}
.then-now div:last-child{border-left:3px solid var(--neon)}

/* ===== pro plugin kit (Serum / Ableton / FL inspired) ===== */
.plug{--pc:var(--amber);background:linear-gradient(180deg,#1f1939,#130f26 60%);border:2px solid #3d3166;box-shadow:0 0 0 1px #07050d,inset 0 1px 0 rgba(255,255,255,.07);display:flex;flex-direction:column;min-width:0}
.plug-h{display:flex;align-items:center;gap:7px;padding:6px 8px;background:linear-gradient(90deg,#0b0816,#1d1636);border-bottom:2px solid #2a2248;flex-wrap:wrap}
.plug-h b{font-family:var(--f-disp);font-size:12px;letter-spacing:.1em;color:var(--pc);text-shadow:0 0 10px color-mix(in srgb,var(--pc) 45%,transparent)}
.plug-type{font-family:var(--f-disp);font-size:8.5px;letter-spacing:.14em;color:var(--dim)}
.plug-led{width:8px;height:8px;flex:none;background:var(--pc);box-shadow:0 0 8px var(--pc)}
.plug.off .plug-led{background:#3d3166;box-shadow:none}
.plug.off .plug-b{filter:saturate(.3) brightness(.8)}
.plug-btn{min-height:32px;min-width:38px;padding:0 8px;background:#0b0816;border:2px solid #3d3166;font-family:var(--f-disp);font-size:10px;color:var(--pc)}
.plug-btn.on{background:var(--pc);color:#140d1f}
.plug-b{padding:8px;display:flex;flex-direction:column;gap:8px}
.sect{background:linear-gradient(#120e22,#0e0a1b);border:1px solid #2a2248;padding:7px;display:flex;flex-direction:column;gap:7px;min-width:0}
.sect-h{display:flex;align-items:center;gap:6px;font-family:var(--f-disp);font-size:9px;letter-spacing:.14em;color:var(--dim);min-height:22px}
.sect-h b{color:var(--pc);font-weight:700}
.disp{width:100%;display:block;background:#07050d;border:1px solid #2a2248;touch-action:none}
.dispcap{display:flex;justify-content:space-between;font-family:var(--f-disp);font-size:8px;letter-spacing:.1em;color:#6a5f9a;margin-top:-4px}
.krow{display:flex;justify-content:space-around;gap:2px;flex-wrap:wrap}
.knob2{display:flex;flex-direction:column;align-items:center;gap:0;min-width:50px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;padding:2px 0}
.knob2 svg{display:block;overflow:visible}
.knob2 .kb-lab{font-family:var(--f-disp);font-size:8px;letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.knob2 .kb-v{font-family:var(--f-num);font-size:16px;color:var(--ink);line-height:1;white-space:nowrap}
.knob2.off{opacity:.28;pointer-events:none}
.knob2.hot .kb-lab{color:var(--neon)}
.knob2:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.seg2{display:flex;gap:2px;background:#07050d;padding:2px;border:1px solid #2a2248;flex-wrap:wrap}
.seg2 button{flex:1;min-width:0;min-height:32px;padding:0 4px;background:#1a1430;border:0;font-family:var(--f-disp);font-size:9px;letter-spacing:.04em;color:var(--dim);white-space:nowrap}
.seg2 button.on{background:var(--pc);color:#140d1f}
.seg2 button:disabled{opacity:.3}
.kbd{position:relative;height:92px;display:flex;touch-action:none;user-select:none;-webkit-user-select:none;background:#07050d;padding-top:3px;border:1px solid #2a2248}
.kbd .wk{flex:1;min-width:0;background:linear-gradient(#f1e7d0,#d4c7aa);border:1px solid #140d1f;border-top:0;display:flex;align-items:flex-end;justify-content:center;padding:0 0 4px;font-family:var(--f-disp);font-size:7.5px;color:#5a4a7a}
.kbd .bk{position:absolute;top:3px;height:56%;background:linear-gradient(#3d3166,#0b0816);border:1px solid #07050d;z-index:2;padding:0}
.kbd .wk.on,.kbd .bk.on{background:var(--pc,#a98bff)!important;color:#140d1f}
.kbd .sel{box-shadow:inset 0 -10px 0 var(--neon)}
.kbd .hint{box-shadow:inset 0 -10px 0 var(--amber)}
.mixer{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.strip{flex:none;width:66px;background:linear-gradient(#1f1939,#120e22);border:1px solid #2a2248;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px}
.strip.master{width:78px;border-color:#6a4718}
.strip .nm{width:100%;text-align:center;font-family:var(--f-disp);font-size:8.5px;letter-spacing:.06em;padding:3px 0;color:#140d1f;background:var(--sc,#8a7fa8)}
.strip .knob2{min-width:0}
.fdrwrap{display:flex;gap:3px;align-items:stretch}

.fdr:focus-visible{outline:2px solid var(--neon)}
.mtr{width:8px;background:#07050d;border:1px solid #2a2248;position:relative;overflow:hidden}
.mtr i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,#3ef0c8 0 62%,#ffb547 62% 86%,#ff4f9a 86%)}

.ms{display:flex;gap:2px}

.ms button.on{background:var(--amber);color:#140d1f}
.clipled{width:24px;height:8px;background:#2a1020;border:1px solid #07050d}

.bigval{font-family:var(--f-num);font-size:44px;line-height:.9;color:var(--pc)}
.lufsbar{position:relative;height:14px;background:#07050d;border:1px solid #2a2248}
.lufsbar i{position:absolute;top:0;bottom:0;left:0;background:linear-gradient(90deg,#3ef0c8,#ffb547 70%,#ff4f9a)}
.lufsbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.twocol>*{min-width:0}

.arr{display:grid;grid-template-columns:64px repeat(4,1fr);gap:3px}
.arr .hd{font-family:var(--f-disp);font-size:8.5px;letter-spacing:.06em;color:var(--dim);text-align:center;padding:4px 0}

.roll button.on{background:#6cb8ff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}

.arr.a8{grid-template-columns:56px repeat(8,1fr)}

function migrate1(o){const n=Object.assign(DEF(),o,{v:2});const t=todayStr();n.skills={};n.abilities=[];
  const map={l1:['rhythm','bpm','beats','tempo'],l2:['bars','beats'],l3:['kick','snare','hihat','patterns'],metro:['quantize']};
  Object.keys(map).forEach(st=>{if((o.done||[]).includes(st))map[st].forEach(id=>{n.skills[id]={u:45,l:30,p:30,learned:t,box:1,due:addDays(t,1)}})});
  [['l1','pulse'],['l2','grid'],['l3','drumsense'],['boss','swing']].forEach(([st,ab])=>{if((o.done||[]).includes(st))n.abilities.push(ab)});
  n.seen=[...(o.defeated||[])];delete n.mastery;return n}
function load(){let raw=null;try{raw=JSON.parse(localStorage.getItem(SAVE_KEY))}catch(e){raw=null}adopt(raw)}
function adopt(raw){if(raw&&raw.v===1)raw=migrate1(raw);
  S=raw&&raw.v===2?Object.assign(DEF(),raw):DEF();
  const t=todayStr();if(!S.firstDay)S.firstDay=t;
  if(S.lastDay!==t){S.prevDay=S.lastDay;S.streak=S.lastDay===addDays(t,-1)?S.streak+1:(S.lastDay?1:S.streak);S.lastDay=t}
  if(S.quests.day!==t)S.quests={day:t,prog:{},claimed:[],moved:[]};
  if(S.daily.day!==t)S.daily={day:t,segs:{},snap:null,shown:false,active:null};
  if(!S.daily.snap)S.daily.snap={beg:tierMastery('beg'),sk:Object.fromEntries(Object.keys(S.skills).map(k=>[k,ovr(k)]))};
  saveLocal()}

const hasProgress=s=>!!(s&&(s.xp>0||(s.done&&s.done.length)||s.resetAt));
function saveLocal(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function save(){if(hasProgress(S))S.savedAt=Date.now();saveLocal();cloudQueue()}
const CLOUD={ref:null,on:false,timer:0,writing:false,again:false,dirty:false};
function cloudQueue(){if(!CLOUD.on)return;CLOUD.dirty=true;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(cloudPush,2500)}
async function cloudPush(){if(!CLOUD.on||!CLOUD.dirty)return;clearTimeout(CLOUD.timer);if(CLOUD.writing){CLOUD.again=true;return}CLOUD.writing=true;CLOUD.dirty=false;
  try{await CLOUD.ref.set({v:2,t:S.savedAt||0,state:JSON.stringify(S)})}
  catch(e){const c=e&&e.code;if(c==='unavailable'||c==='resource_exhausted')setTimeout(cloudQueue,5000);else CLOUD.on=false}
  CLOUD.writing=false;if(CLOUD.again){CLOUD.again=false;cloudQueue()}}
async function cloudInit(){try{if(!window.claude||!window.claude.use)return;const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(!db||!user)return;
  const id=await user.id();if(!id)return;const ref=db.doc('data/users/'+id+'/save');const snap=await ref.get();CLOUD.ref=ref;CLOUD.on=true;
  let remote=null;if(snap.exists){const d=snap.data();try{remote=d&&typeof d.state==='string'?JSON.parse(d.state):null}catch(e){remote=null}}
  if(hasProgress(remote)&&(!hasProgress(S)||(remote.savedAt||0)>(S.savedAt||0))){adopt(remote);const safe=['title','home','map','region','path','train','quests','studio'];go(safe.includes(cur)?cur:'home');setTimeout(()=>toast('PROGRESS RESTORED FROM YOUR ACCOUNT'),300)}
  else if(hasProgress(S)&&(!remote||(S.savedAt||0)>(remote.savedAt||0))){CLOUD.dirty=true;cloudPush()}}catch(e){}}
const needXp=n=>n<10?70+15*(n-1):205;
const cum=n=>{let s2=0;for(let k=1;k<n;k++)s2+=needXp(k);return s2};
function level(){let n=1;while(cum(n+1)<=S.xp)n++;return n}
function lvProg(){const n=level();return{n,cur:Math.round(S.xp-cum(n)),need:Math.round(cum(n+1)-cum(n))}}
const rankFor=lv=>{let r=RANKS[0];RANKS.forEach(x=>{if(lv>=x[0])r=x});return r};
const rankNext=lv=>RANKS.find(x=>x[0]>lv);
const has=t=>S.tools.includes(t);
function addMission(t){S.missions[t]=(S.missions[t]||0)+1}
const nextStage=()=>STAGES.find(x=>!S.done.includes(x.id));
function worldDone(w){return WSTAGES[w||'forest'].every(x=>S.done.includes(x.id))}
function worldOpen(w){const i=WORDER.indexOf(w);return i<=0||worldDone(WORDER[i-1])}
const curWorldId=()=>{const n=nextStage();return n?n.w:'sky'};
function stageState(id){if(S.done.includes(id))return'done';const st=stageById(id);if(!st||!worldOpen(st.w))return'locked';const n=WSTAGES[st.w].find(x=>!S.done.includes(x.id));return n&&n.id===id?'current':'locked'}

function sk(id){return S.skills[id]||(S.skills[id]={u:0,l:0,p:0,learned:null,box:0,due:null})}

  if(pq)return`I noticed ${PQ[pq.tag].why.toLowerCase()} So I built you a personal trial: ${PQ[pq.tag].title}.`;
  const gap=S.prevDay?dayDiff(S.prevDay,t):0;

  const prevErr={};S.log.filter(e=>e.k==='err'&&e.d===S.prevDay&&e.g&&TAGNAME[e.g]).forEach(e=>{prevErr[e.g]=(prevErr[e.g]||0)+1});

function axisRow(labels){const r=h('div','row sp vizcap');labels.forEach(l=>r.append(h('span',null,l)));return r}
const FRAC=f=>Math.log10(f/20)/Math.log10(1000);
function axisAt(list){const r=h('div','vizcap');r.style.cssText='position:relative;height:14px';list.forEach(([t,fr])=>{const s=h('span',null,t);s.style.cssText=`position:absolute;top:0;white-space:nowrap;left:${(fr*100).toFixed(1)}%;transform:translateX(${fr<.12?0:fr>.88?-100:-50}%)`;r.append(s)});return r}

  [[20,250,'#1d2a3a'],[250,4000,'#2a2248'],[4000,20000,'#1d3530']].forEach(([a,b,c])=>px(g,LOGX(a,W),0,LOGX(b,W)-LOGX(a,W),H,c));
  [100,1000,10000].forEach(v=>px(g,LOGX(v,W),0,1,H,'#3d3166'));
  if(f){const x=Math.floor(LOGX(f,W));px(g,x-1,2,3,H-4,'#ffb547');px(g,x,0,1,H,'#ffe27a')}
  host.append(cv,axisAt([['LOW',FRAC(70)],['MID',FRAC(1000)],['HIGH',FRAC(9000)]]))}

  [100,1000,10000].forEach(v=>px(g,LOGX(v,W),0,1,H,'#2a2248'));px(g,0,H/2,W,1,'#3d3166');
  let mags=null;if(prm&&A.ctx){const bq=A.ctx.createBiquadFilter();bq.type='peaking';bq.frequency.value=prm.f;bq.Q.value=prm.q;bq.gain.value=prm.g;const fr=new Float32Array(W),mg=new Float32Array(W),ph=new Float32Array(W);for(let x=0;x<W;x++)fr[x]=20*Math.pow(1000,x/W);bq.getFrequencyResponse(fr,mg,ph);mags=mg}
  for(let x=0;x<W;x++){const db=mags?20*Math.log10(mags[x]):0;const y=Math.round(H/2-db/15*(H/2-3));px(g,x,y,1,2,prm?'#3ef0c8':'#6a5f9a')}

function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function toast(msg,cls){const t=h('div','toast'+(cls?' '+cls:''));t.textContent=msg;app.append(t);setTimeout(()=>t.remove(),2900)}
function modal(inner,opt){opt=opt||{};const back=h('div','modal-back'+(opt.cls?' '+opt.cls:''));const m=h('div',(opt.cls||'').includes('dramatic')?'modal':'modal win'+(opt.left?' left':''));
  if(typeof inner==='string')m.innerHTML=inner;else m.append(inner);back.append(m);app.append(back);back.close=()=>back.remove();
  if(opt.dismiss)back.addEventListener('click',e=>{if(e.target===back)back.remove()});return back}
function coinRow(n){return`<span class="row" style="justify-content:center;gap:8px"><span data-ic="coin"></span><b>+${n}</b> COINS</span>`}

    const lat=(A.ctx.outputLatency||A.ctx.baseLatency||0);const tt=now()-lat;let best=-1,bd=9;beats.forEach((b,i)=>{const d=Math.abs(tt-b.t);if(!b.hit&&d<bd){bd=d;best=i}});

  startB.onclick=()=>{initAudio();if(!A.ctx)return;stopMusic();stopGroup();startB.disabled=true;dots.forEach(d=>d.className='');offs=[];const spb=60/o.bpm;const t0=now()+.35;beats=[];

      timers.push(setTimeout(()=>{if(!host.isConnected)return;pad.classList.add('flash');setTimeout(()=>pad.classList.remove('flash'),110);if(k<4){msg.textContent='Count-in… '+(k+1);if(k===3)setTimeout(()=>{active=true;msg.textContent='TAP!'},spb*500)}else{dots.forEach(d=>d.classList.remove('now'));if(!dots[k-4].className)dots[k-4].classList.add('now')}},(t-now())*1000))}

      msg.textContent=pass?`${n}/${taps} on the beat. Locked in!`:`${n}/${taps} on the beat. You need ${o.need}. Count “1, 2, 3, 4” out loud and tap on each number.`;onResult({pass,n})},(endT-now())*1000+250))};
  return{stop(){timers.forEach(clearTimeout);active=false}}}

/* ================= synthesis & music theory ================= */
const midiF=m=>440*Math.pow(2,(m-69)/12);
const NOTE_NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const noteName=m=>NOTE_NAMES[((m%12)+12)%12]+(Math.floor(m/12)-1);
const MAJOR=[0,2,4,5,7,9,11],MINOR=[0,2,3,5,7,8,10];
const WAVE_GAIN={sine:1,triangle:.9,square:.42,sawtooth:.5};
const WAVE_NAME={sine:'SINE',triangle:'TRIANGLE',square:'SQUARE',sawtooth:'SAW'};
/* ---- wavetable: sine → triangle → saw → square, morphed by harmonic series (real additive wavetable) ---- */
const HARM=64,WT_ORDER=['sine','triangle','sawtooth','square'];
const SHAPE_H={sine:n=>n===1?1:0,triangle:n=>n%2?8/(Math.PI*Math.PI)*(((n-1)/2)%2?-1:1)/(n*n):0,sawtooth:n=>2/Math.PI*(n%2?1:-1)/n,square:n=>n%2?4/Math.PI/n:0};
function wtCoefs(pos){pos=clamp(pos,0,1)*3;const i=Math.min(2,Math.floor(pos)),f=pos-i;const a=SHAPE_H[WT_ORDER[i]],b=SHAPE_H[WT_ORDER[i+1]];const im=new Float32Array(HARM+1);for(let n=1;n<=HARM;n++)im[n]=a(n)*(1-f)+b(n)*f;return im}
function wtSample(pos,ph){const im=wtCoefs(pos);let v=0;for(let n=1;n<=24;n++)if(im[n])v+=im[n]*Math.sin(n*ph);return v}
const PWCACHE=new Map();
function periodicWave(c,pos){const key=Math.round(clamp(pos,0,1)*60);const ck=c===A.ctx?key:null;if(ck!==null&&PWCACHE.has(ck))return PWCACHE.get(ck);const pw=c.createPeriodicWave(new Float32Array(HARM+1),wtCoefs(key/60));if(ck!==null)PWCACHE.set(ck,pw);return pw}
const wtName=pos=>WT_ORDER[Math.round(clamp(pos,0,1)*3)];

const PATCH0=PRESETS.INIT,PLUCK=mkPatch({wt:.36,cut:4200,res:1,a:4,d:260,s:.15,r:220}),PADP=mkPatch({wt:.66,uni:3,det:.35,cut:1400,a:600,d:800,s:.8,r:1400}),BASSP=mkPatch({wt:.66,cut:650,res:3,fenv:.3,fd:150,a:3,d:200,s:.45,r:120});
/* a playable voice: unison wavetable oscillators + sub → filter (12/24 dB) with its own envelope → amp envelope, LFO to cutoff, pitch or volume */
function voiceOn(P,f,t,v,dest){const c=AC();dest=dest||OUT();const out=c.createGain();

  const f1=mkF(),f2=P.slope===24&&P.flt!=='bp'?mkF():null;if(f2){f1.connect(f2);f2.connect(out)}else f1.connect(out);
  let end=out;if(P.lfoDepth>0&&P.lfoDest==='vol'){const tr=c.createGain();tr.gain.value=1-P.lfoDepth/2;out.connect(tr);end=tr}end.connect(dest);
  const fr=f*Math.pow(2,P.oct||0),uni=Math.max(1,Math.round(P.uni||1)),pw=periodicWave(c,P.wt),oscs=[];
  for(let k=0;k<uni;k++){const o=c.createOscillator();o.setPeriodicWave(pw);o.frequency.value=fr;const sp=uni>1?(k/(uni-1)-.5)*2:0;o.detune.value=(P.fine||0)+sp*(P.det||0)*40;const g=c.createGain();g.gain.value=1/Math.sqrt(uni);o.connect(g);g.connect(f1);oscs.push(o)}
  if(P.sub>0){const o=c.createOscillator();o.type='sine';o.frequency.value=fr/2;const g=c.createGain();g.gain.value=P.sub;o.connect(g);g.connect(f1);oscs.push(o)}

  if(P.fenv){const top=clamp(P.cut*Math.pow(2,P.fenv*5),30,18000),sl=clamp(P.cut*Math.pow(2,P.fenv*5*P.fs),30,18000),fa=Math.max(.002,P.fa/1000);fl.forEach(x=>{x.frequency.setValueAtTime(P.cut,t);x.frequency.linearRampToValueAtTime(top,t+fa);x.frequency.setTargetAtTime(sl,t+fa,Math.max(.01,P.fd/1000)/3)})}
  let lfo=null;if(P.lfoDepth>0){lfo=c.createOscillator();lfo.type=P.lfoShape||'sine';lfo.frequency.value=P.lfoRate;const lg=c.createGain();lfo.connect(lg);
    if(P.lfoDest==='pitch'){lg.gain.value=P.lfoDepth*300;oscs.forEach(o=>lg.connect(o.detune))}else if(P.lfoDest==='vol'){lg.gain.value=P.lfoDepth/2;lg.connect(end.gain)}else{lg.gain.value=P.cut*P.lfoDepth*.9;fl.forEach(x=>lg.connect(x.frequency))}lfo.start(t)}

  return{off(t2){t2=Math.max(t2,t+.005);out.gain.cancelScheduledValues(t2);out.gain.setValueAtTime(envAt(t2),t2);out.gain.setTargetAtTime(.0001,t2,r/3);const stop=t2+r*1.6+.1;oscs.forEach(o=>o.stop(stop));if(lfo)lfo.stop(stop);
    if(P.fenv){const rel=Math.max(.01,P.fr/1000);fl.forEach(x=>{x.frequency.cancelScheduledValues(t2);x.frequency.setTargetAtTime(P.cut,t2,rel/3)})}}}}
/* legacy one-shot entry point used across the game */
function SV(t,f,dur,P,v){if(!A.ctx)return;P=P||PATCH0;
  if(P.wave){const c=AC();const o=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();o.type=P.wave;o.frequency.value=f;lp.type='lowpass';lp.frequency.value=P.cut||4000;lp.Q.value=P.q||1;const a=Math.max(.002,(P.a||5)/1000),d=Math.max(.01,(P.d||200)/1000),r=Math.max(.01,(P.r||200)/1000),pk=Math.max((v||.3)*(WAVE_GAIN[P.wave]||.5),.0002),off=t+Math.max(dur,a+.01);

function kCoef(fs){let f0=1681.974450955533,G=3.999843853973347,Q=.7071752369554196;let K=Math.tan(Math.PI*f0/fs);const Vh=Math.pow(10,G/20),Vb=Math.pow(Vh,.4996667741545416);let a0=1+K/Q+K*K;
  const shelf={b:[(Vh+Vb*K/Q+K*K)/a0,2*(K*K-Vh)/a0,(Vh-Vb*K/Q+K*K)/a0],a:[2*(K*K-1)/a0,(1-K/Q+K*K)/a0]};
  f0=38.13547087602444;Q=.5003270373238773;K=Math.tan(Math.PI*f0/fs);a0=1+K/Q+K*K;return[shelf,{b:[1,-2,1],a:[2*(K*K-1)/a0,(1-K/Q+K*K)/a0]}]}
function biquadRun(x,c){const y=new Float32Array(x.length);let x1=0,x2=0,y1=0,y2=0;const b0=c.b[0],b1=c.b[1],b2=c.b[2],a1=c.a[0],a2=c.a[1];for(let i=0;i<x.length;i++){const v=b0*x[i]+b1*x1+b2*x2-a1*y1-a2*y2;x2=x1;x1=x[i];y2=y1;y1=v;y[i]=v}return y}

function lufsOf(buf){const fs=buf.sampleRate,kc=kCoef(fs);const ch=[];for(let c=0;c<Math.min(2,buf.numberOfChannels);c++)ch.push(biquadRun(biquadRun(buf.getChannelData(c),kc[0]),kc[1]));
  const blk=Math.round(.4*fs),hop=Math.round(.1*fs);const pw=[];for(let st=0;st+blk<=buf.length;st+=hop){let sum=0;for(const x of ch){let e=0;for(let i=st;i<st+blk;i++)e+=x[i]*x[i];sum+=e/blk}pw.push(sum)}
  const L=p=>-.691+10*Math.log10(p||1e-12);const g1=pw.filter(p=>L(p)>-70);if(!g1.length)return-70;const rel=L(g1.reduce((a,b)=>a+b,0)/g1.length)-10;const g2=g1.filter(p=>L(p)>rel);return L(g2.reduce((a,b)=>a+b,0)/Math.max(1,g2.length))}

  const d=[];for(let c=0;c<ch;c++)d.push(buf.getChannelData(c));let o=44;for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const v=Math.max(-1,Math.min(1,d[c][i]));dv.setInt16(o,v<0?v*32768:v*32767,true);o+=2}return new Uint8Array(ab)}

function zipStore(name,data){const nm=new TextEncoder().encode(name),crc=crc32(data),sz=data.length;const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nm.length,true);
  const cd=new DataView(new ArrayBuffer(46));cd.setUint32(0,0x02014b50,true);cd.setUint16(4,20,true);cd.setUint16(6,20,true);cd.setUint32(16,crc,true);cd.setUint32(20,sz,true);cd.setUint32(24,sz,true);cd.setUint16(28,nm.length,true);
  const off=30+nm.length+sz,cdLen=46+nm.length;const end=new DataView(new ArrayBuffer(22));end.setUint32(0,0x06054b50,true);end.setUint16(8,1,true);end.setUint16(10,1,true);end.setUint32(12,cdLen,true);end.setUint32(16,off,true);

/* ================= quiz runner ================= */
function quiz(host,o){const res={ok:0,n:0,combo:0,maxCombo:0,list:[],hints:0};let hl=0,cur=null,alive=true;
  const top=h('div','qtop');const dots=h('div','qdots');const comboEl=h('span','chip amber');top.append(dots,comboEl);const body=h('div','quiz');host.append(top,body);
  const total=o.count||0;const mult=()=>1+Math.min(2,Math.floor(res.combo/3));
  function drawDots(){dots.innerHTML='';const n=total||Math.max(o.need||3,res.n+1);for(let i=0;i<n;i++)dots.append(h('i',res.list[i]===true?'ok':res.list[i]===false?'no':i===res.n?'cur':''));comboEl.hidden=o.mode!=='gym'||res.combo<3;comboEl.textContent='COMBO ×'+mult()}
  const finished=()=>(total&&res.n>=total)||(o.need&&res.ok>=o.need)||(o.maxQ&&res.n>=o.maxQ);
  async function next(){if(!alive||!host.isConnected)return;if(finished()){finish();return}
    hl=0;cur=o.gen(res.n);drawDots();body.innerHTML='<p class="muted">Preparing sounds…</p>';
    if(cur.prepare){initAudio();try{await withTimeout(cur.prepare(),5000)}catch(e){cur=cur.fallback?cur.fallback():conceptQ([].concat(cur.skill)[0])}}
    if(!alive||!host.isConnected)return;render(cur)}
  function render(q){body.innerHTML='';const pr=h('p','qprompt');pr.textContent=q.prompt;body.append(pr);
    if(q.type==='task'){const th=h('div','stack');body.append(th);const ctl={};let fired=false;q.render(th,(ok,msg)=>{if(fired)return;fired=true;answered(q,ok,null,msg)},ctl);
      hintBar(body,{hints:q.hints,demo:ctl.demo?()=>ctl.demo():null,demoText:q.demoText,reveal:ctl.reveal?()=>ctl.reveal():null,onLevel:l=>{hl=l;res.hints++}});return}
    if(q.plays){const pl=h('div','qplays');q.plays.forEach(p=>{const b=h('button','btn ghost',p.label);b.onclick=()=>{playQ(p.fn);b.classList.add('heard')};pl.append(b)});body.append(pl);
      if(hasAb('ears')){const sp=lowres(96,16,'viz spec');addLive(sp,specDraw);body.append(sp)}}
    const vz=h('div','vizhost');body.append(vz);if(q.viz)q.viz(vz,false);q._viz=vz;
    const op=h('div','qopts'+(q.wide?' wide':''));q.options.forEach(opt=>{const b=h('button','btn qopt',opt.label);b.dataset.v=opt.v;b.onclick=()=>answered(q,opt.v===q.answer,opt.v);op.append(b)});body.append(op);q._opts=op;
    hintBar(body,{hints:q.hints,demo:q.demo||null,demoText:q.demoText,reveal:()=>{const b=[...op.children].find(x=>x.dataset.v===q.answer);if(b)b.classList.add('reveal')},onLevel:l=>{hl=l;res.hints++}});
    if(q.plays&&o.autoplay!==false)setTimeout(()=>{if(alive&&body.isConnected&&cur===q)playQ(q.plays[0].fn)},250)}
  function answered(q,ok,v,msg){stopGroup();seq.stop();if(q._opts)[...q._opts.children].forEach(b=>{b.disabled=true;if(b.dataset.v===q.answer)b.classList.add('correct');else if(b.dataset.v===v)b.classList.add('wrong')});
    const credit=ok&&hl<4;res.n++;res.list.push(credit);if(credit){res.ok++;res.combo++;res.maxCombo=Math.max(res.maxCombo,res.combo)}else res.combo=0;
    record(q.skill,q.dim,ok,hl,q.tag);if(o.onAnswer)o.onAnswer(credit,q,res);if(credit)sfx.ok();else if(!ok)sfx.bad();haptic(credit?15:[20,40,20]);
    const fb=h('p','fb'+(ok?' good':''));fb.textContent=(credit?'✓ ':ok?'◆ Revealed answer. ':'✗ ')+(msg||(credit?'Correct. ':'')+(q.explain?q.explain(v):''));body.append(fb);
    if(q.viz&&q._viz){q._viz.innerHTML='';q.viz(q._viz,true)}
    drawDots();const nx=h('button','btn block',finished()?'FINISH ▶':'NEXT ▶');nx.onclick=()=>{sfx.tap();next()};body.append(nx);setTimeout(()=>nx.scrollIntoView({block:'nearest',behavior:'smooth'}),50)}
  function finish(){alive=false;stopGroup();seq.stop();o.onDone&&o.onDone(res)}
  next();return{stop(){alive=false;stopGroup();seq.stop()}}}

function skirmish(host,o){const M=MONS[o.mon];seenMon(o.mon);const hp=o.hp||3;let left=hp;
  const top=h('div','row sp');top.innerHTML=`<span class="eyebrow" style="color:var(--magenta)">${o.title||M.name.toUpperCase()}</span><span class="skhp"></span>`;

 {k:'DISCOVER',render(b,done){b.innerHTML=`<div class="big-title">Sound is air that vibrates</div>`;b.append(pipSay(`Every sound you hear is air wiggling back and forth. How fast it wiggles is its <b>frequency</b>, measured in <b>Hertz (Hz)</b>: wiggles per second.<br><br>Slow wiggles sound <b>low</b>. Fast wiggles sound <b>high</b>. Your ears catch roughly 20 Hz to 20,000 Hz.`));b.append(waveCanvas(),h('p','muted','Top: a slow, low wave. Bottom: a fast, high one.'));done()}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Slow wiggles, fast wiggles</div><p>Play both and watch the wave. The low note draws wide waves. The high note packs them tight.</p><div class="abhost"></div>`;
   abWidget($('.abhost',b),[{label:'110 Hz',note:'A low bass note. 110 wiggles per second.',bpm:120,play:(s,t)=>{if(s%8===0)V.sine(t,110,.6,.32)}},{label:'1,760 Hz',note:'A high whistle. 1,760 wiggles per second.',bpm:120,play:(s,t)=>{if(s%8===0)V.sine(t,1760,.6,.2)}}],done)}},
 {k:'EXPERIMENT',render(b,done,ctx){b.innerHTML=`<div class="big-title">Slide through the spectrum</div><p>Turn the tone on and drag the slider from low to high. Visit all three zones. Low notes need headphones on a phone.</p><div class="bpmread num">440</div><p class="eyebrow" style="text-align:center">HZ</p><button class="btn ghost block" data-a="tone">▶ TURN THE TONE ON</button><input type="range" id="lesson-hz" min="0" max="1000" value="522" aria-label="Frequency"><div class="zone"><span>LOW<br>20–250</span><span>MID<br>250–4k</span><span>HIGH<br>4k–20k</span></div>`;
   const sc=lowres(96,24,'scope');addLive(sc,scopeDraw);b.append(sc);let osc=null,f=440;const seen=new Set();const sl=$('#lesson-hz',b),tb=$('[data-a=tone]',b),zs=$$('.zone span',b);
   const upd=()=>{f=Math.round(40*Math.pow(200,sl.value/1000));$('.bpmread',b).textContent=f;const z=f<250?0:f<4000?1:2;zs.forEach((s,i)=>{s.classList.toggle('on',i===z)});if(osc){osc.frequency.setTargetAtTime(f,now(),.02);seen.add(z);zs[z].classList.add('seen')}if(seen.size===3)done()};

 {k:'CHALLENGE',render(b,done){const run=()=>{b.innerHTML=`<div class="big-title">Train your ears</div><p>Four quick tests. Which note is higher? Get <b>3 of 4</b>.</p>`;

function peakGroove(s,t){const i=s%16;if(i===0||i===8)V.kick(t,.22);if(i%2===0)V.hat(t,.14);if(i===6||i===14)V.snare(t,.16);if(i===4||i===12){V.snare(t,1);V.kick(t,.9);noiseHit(t,.09,.9,'bandpass',1200,1.2)}}

async function calibratePeak(){const spb=60/100/4;const buf=await renderOffline(16*spb+.5,null,t0=>{for(let s=0;s<16;s++)peakGroove(s,t0+s*spb)});const d=buf.getChannelData(0),sr=buf.sampleRate,t0=.05;
  const win=(a,b)=>{let m=0;for(let i=Math.floor(a*sr);i<Math.min(d.length,Math.floor(b*sr));i++)m=Math.max(m,Math.abs(d[i]));return m};
  const sp=Math.max(win(t0+4*spb,t0+5*spb),win(t0+12*spb,t0+13*spb));let bd=0;[0,2,6,8,10,14].forEach(i=>{bd=Math.max(bd,win(t0+i*spb,t0+(i+1)*spb))});
  return{spike:20*Math.log10(sp||1e-4),body:20*Math.log10(bd||1e-4)}}

function scoreBeat(p,v){const n=k=>p[k].filter(Boolean).length;const used=['kick','snare','hat','bass'].filter(k=>n(k)>0);const tips=[];
  let rhythm=40;if(p.kick[0])rhythm+=20;else tips.push('Try a kick on step 1. It tells the listener where the bar starts.');if(p.snare[4]||p.snare[12])rhythm+=20;else tips.push('A snare on beat 2 or 4 (step 5 or 13) gives people something to nod to.');if(n('hat')>=4)rhythm+=20;else tips.push('A few more hi-hats would keep time between the big hits.');
  let structure=0;if(used.some(k=>p[k][0]))structure+=34;const halves=['kick','bass'].some(k=>p[k].slice(0,8).some(Boolean)&&p[k].slice(8).some(Boolean));if(halves)structure+=33;else tips.push('Spread the low end across both halves of the bar so it doesn’t feel lopsided.');const tot=used.reduce((a,k)=>a+n(k),0);if(tot>=10&&tot<=40)structure+=33;else tips.push(tot<10?'The groove is very sparse. That can work, but try a few more hits.':'Lots of hits. Leaving some gaps lets the groove breathe.');
  let balance=100;if(v.hat>v.kick){balance-=25;tips.push('Your hi-hats are louder than your kick. Hats usually sit quieter.')}if(used.some(k=>v[k]<.15)){balance-=20;tips.push('One track is almost silent. Bring it up or remove it.')}if(used.length&&used.every(k=>v[k]>=.95)){balance-=20;tips.push('Every fader is maxed out. Pulling some down makes room for the rest.')}balance=Math.max(40,balance);
  let creativity=40;const notes=new Set(p.bass.filter(Boolean));if(notes.size>=2)creativity+=20;else tips.push('Tap a bass cell again to change its note. Two or three different notes make a bassline.');if(used.some(k=>p[k].some((x,i)=>x&&i%2===1)))creativity+=20;else tips.push('Hits on the in-between steps (2, 4, 6…) add syncopation, that bouncy feeling.');const bb=pat({kick:[0,8],snare:[4,12],hat:EIGHTHS});if(['kick','snare','hat'].some(k=>p[k].some((x,i)=>!!x!==!!bb[k][i])))creativity+=20;
  const completion=used.length*25;const overall=Math.round((rhythm+structure+balance+creativity+completion)/5);return{rhythm,structure,balance,creativity,completion,overall,tips:tips.slice(0,3),used}}

      const lines=due.map(id=>{const good=per[id].every(Boolean);recallResult(id,good);if(good)gain(id,'u',4);const s=S.skills[id];return`${SK[id].n.toUpperCase()} ${memoHtml(s.box)} ${good?'NEXT IN '+BOX_DAYS[s.box-1]+' DAYS':'AGAIN TOMORROW'}`});

const CANNED={
'Why does my bass sound muddy?':'Muddy bass usually means too many sounds are fighting in the low frequencies. Often it is the kick and the bass hitting at the same moment with the same weight.\n\nQuick fixes: let the kick and bass take turns (put bass notes between kicks), or turn one of them down a little.\n\nTry it: in your studio, move a bass note off step 1 so it lands just after the kick. In the EQ Desert you will learn to carve the lows with an EQ.',
'How do I make my kick punchier?':'Punch is mostly about contrast. A kick feels punchy when it has room around it.\n\nGive it space: keep other drums off the exact same step, and turn the hats and bass down a touch so the kick stands out.\n\nTry it: in your studio set the kick fader around 90 and the hats around 45. A compressor with a slower attack adds even more snap.',
'What does attack mean on a compressor?':'A compressor turns loud moments down. Attack is how fast it reacts.\n\nFast attack grabs the very start of a sound and flattens it. Slow attack lets the first hit through before clamping down, which makes drums sound punchier.\n\nTry “Taming Peaks” in Compression Volcano: you can hear this happen live.',
'Why does my mix sound quiet?':'Usually one of two things: everything is turned down, or one sound is so loud it forces everything else down with it.\n\nBalance first. Find your loudest element (often the kick) and make everything else sit around it. Loudness comes at the very end, with a Limiter in the Mastering Sky.\n\nTry it: bring every studio fader to about 70, then nudge each one until nothing hides.',
'How do I make a synth sound darker?':'Dark means less high frequency. The main tool is a low-pass filter: it lets the lows through and cuts the highs.\n\nTurn the filter cutoff down and the synth gets warmer and darker. A softer waveform (sine or triangle instead of saw) helps too.\n\nYou will learn this hands-on in the Synth Caves.',
'What is BPM?':'BPM means beats per minute: how many beats happen in one minute. It sets the speed of a song.\n\n60 BPM is one beat per second, 120 BPM is two. Lo-fi hip-hop often sits around 70 to 90, house around 120 to 128, drum & bass around 170.\n\nTry it: in your studio, press play and tap + or − on the tempo. Same pattern, different mood.',
'What does quantize do?':'Quantize snaps notes onto a grid so they land exactly in time.\n\nWhen you play notes by hand, some are a little early or late. Quantize moves each one to the nearest grid line. Pick the grid that matches your rhythm: 1/8 for eighth notes, 1/16 for faster sixteenths.\n\nIn a real DAW, select the notes and use the Quantize command.',
'Why are there 16 steps?':'One bar of 4/4 has 4 beats. A step sequencer splits each beat into 4 smaller steps, so 4 × 4 = 16 steps.\n\nSteps 1, 5, 9 and 13 are the beats. The steps in between are where hi-hats, extra kicks and syncopation live.\n\nTry it: put a hi-hat on every odd step, then add one on step 16 and hear the little push into the next bar.',
'How do I make my beat groove more?':'Groove comes from contrast and small surprises.\n\n- Add a hit on an in-between step (like step 11 or 16) for syncopation.\n- Keep the hi-hats quieter than the kick and snare.\n- Leave some gaps. Silence makes the hits feel bigger.\n\nTry it: in your studio, move one kick from step 9 to step 11 and listen to the bounce.',
'What is the difference between kick and snare?':'The kick is the low thump you feel in your chest. It usually lands on beats 1 and 3 and anchors the groove.\n\nThe snare is the bright crack. On beats 2 and 4 it becomes the backbeat, the part people clap to.\n\nTry it: put the kick on steps 1 and 9 and the snare on steps 5 and 13. That is the backbeat.'};

{s:'chords',q:'A basic triad has…',o:['3 notes: root, third, fifth','2 notes','7 notes'],a:0,e:'Root + third + fifth. The third decides major or minor.'},

{s:'adsr',q:'A pad usually has…',o:['A slow attack and long release','Zero attack and no sustain','No envelope at all'],a:0,e:'Pads fade in slowly and linger: slow attack, high sustain, long release.'},
{s:'filters',q:'A low-pass filter removes…',o:['The highs above the cutoff','The lows below the cutoff','Everything'],a:0,e:'It lets the lows pass and cuts the highs. Lower cutoff = darker.'},
{s:'filters',q:'Resonance boosts…',o:['Frequencies right around the cutoff','The whole bass range','The volume'],a:0,e:'High resonance makes a peak at the cutoff: the squelchy, whistly sound.'},
{s:'lfo',q:'LFO stands for…',o:['Low Frequency Oscillator','Loud Filter Output','Long Fade Out'],a:0,e:'A slow oscillator you do not hear directly: it moves other controls.'},
{s:'modulation',q:'An LFO on the filter cutoff creates…',o:['A wobble or wah effect','Silence','A different tempo'],a:0,e:'The cutoff moves up and down, so the tone wobbles: dubstep basses live on this.'},
{s:'synthesis',q:'Subtractive synthesis starts with a bright wave and…',o:['Filters frequencies away','Adds reverb','Speeds it up'],a:0,e:'Rich oscillator in, filter removes what you do not want, envelopes shape it over time.'},
{s:'gain',q:'Gain staging means…',o:['Keeping healthy levels at every step','Making everything as loud as possible','Muting tracks'],a:0,e:'Not too quiet (noise) and not too hot (clipping) at every stage of the chain.'},
{s:'volume',q:'A good first step in any mix is…',o:['Balancing the faders','Adding reverb to everything','Mastering'],a:0,e:'Balance first. Most of a great mix is simply good levels.'},
{s:'eq',q:'Mud usually lives around…',o:['200–500 Hz','5–10 kHz','20–40 Hz'],a:0,e:'Low-mids around 200–500 Hz build up and make mixes cloudy.'},
{s:'eq',q:'A high-pass filter on a vocal removes…',o:['Low rumble below the cutoff','The highs','The reverb'],a:0,e:'It lets highs pass and cuts the lows: great for rumble and mud.'},
{s:'eq',q:'Harshness usually lives around…',o:['2–5 kHz','50–100 Hz','15–20 kHz'],a:0,e:'The ear is most sensitive around 2–5 kHz. Too much there hurts.'},
{s:'masking',q:'Kick and bass masking is often fixed by…',o:['Cutting the bass where the kick thumps','Boosting both','Panning the kick hard left'],a:0,e:'Give each its own frequency spot, or let them take turns in time.'},
{s:'reverb',q:'More reverb (wetter) makes a sound seem…',o:['Further away','Closer','Louder'],a:0,e:'Distant sounds reach us mostly as reflections.'},
{s:'reverb',q:'Pre-delay helps a vocal…',o:['Stay clear and upfront','Sound further away','Get louder'],a:0,e:'A short gap before the reverb keeps the dry sound distinct.'},
{s:'delay',q:'At 120 BPM, a 1/4-note delay is…',o:['500 ms','250 ms','1000 ms'],a:0,e:'60,000 ÷ 120 = 500 ms per beat.'},
{s:'delay',q:'Feedback on a delay controls…',o:['How many repeats','The delay time','The dry volume'],a:0,e:'More feedback feeds echoes back in for more repeats.'},
{s:'panning',q:'What usually stays in the center?',o:['Kick, bass and lead vocal','Every hi-hat','Only the reverb'],a:0,e:'The anchors sit in the middle; supporting parts spread out.'},
{s:'stereo',q:'A wide stereo image comes from…',o:['Different content left and right','Turning everything up','Mono sounds'],a:0,e:'Width is the difference between the two channels.'},
{s:'automation',q:'Automation lets you…',o:['Move any control over time','Only change tempo','Record audio'],a:0,e:'Draw how a knob moves across the song: filters, volumes, sends.'},
{s:'loudness',q:'Two tracks with the same peak can have…',o:['Very different loudness','Always the same loudness','No loudness'],a:0,e:'Peak is the highest point. Loudness is the average energy over time.'},
{s:'lufs',q:'Spotify and YouTube normalize music to about…',o:['-14 LUFS','0 LUFS','-30 LUFS'],a:0,e:'Around -14 LUFS. Louder masters just get turned down.'},
{s:'lufs',q:'LUFS measures…',o:['Perceived loudness over time','Peak level only','Tempo'],a:0,e:'Loudness Units relative to Full Scale, weighted like our ears.'},
{s:'limiting',q:'A limiter is like a compressor with…',o:['A very high ratio and fast attack','No threshold','Reverb built in'],a:0,e:'Nothing gets past the ceiling: ratio near infinity, attack near instant.'},
{s:'limiting',q:'Pushing a limiter too hard makes a master…',o:['Flat and crushed','More dynamic','Quieter'],a:0,e:'The punch disappears when every peak is shaved.'},
{s:'clipping',q:'Digital clipping happens when audio goes past…',o:['0 dBFS','-14 LUFS','20 kHz'],a:0,e:'0 dBFS is the digital ceiling. Beyond it, peaks are chopped flat.'},

/* EXPERIMENT steps: a checklist of discoveries */
function discover(b,items,need,done){const box=h('div','check disc');box.innerHTML=items.map((t,i)=>`<div data-d="${i}">${t}</div>`).join('');b.append(box);const found=new Set();
  return i=>{if(found.has(i)||!box.isConnected)return;found.add(i);const d=$(`[data-d="${i}"]`,box);if(d)d.classList.add('ok');sfx.ok();if(found.size>=need)done()}}
/* CHALLENGE steps: a short quiz with retry */
function quizStep(b,done,o){const n=o.count||4,need=o.need||3;const run=()=>{b.innerHTML=`<div class="big-title">${o.title}</div><p>${o.text}</p>`;
  quiz(b,{mode:'lesson',count:n,gen:o.gen,onDone:r=>{const ok=r.ok>=need;b.append(h('p','fb'+(ok?' good':''),ok?`${r.ok}/${n}. ${o.win}`:`${r.ok}/${n}. ${o.lose||'Close! Play each sound twice before you answer.'}`));if(ok)done();else{const again=h('button','btn block','TRY AGAIN');again.onclick=run;b.append(again)}}})};run()}
/* LISTEN steps: offline renders matched in loudness, with a live fallback */
function abRender(b,done,o){b.insertAdjacentHTML('beforeend','<p class="muted wait">Rendering…</p>');initAudio();if(!A.ctx)return;
  withTimeout(Promise.all(o.items.map(it=>it.render())),6000).then(bufs=>{if(!b.isConnected)return;const m=o.match===false?bufs:matchLoudness(bufs[0],bufs[1]);$('.wait',b).remove();abBuffers(b,o.items.map((it,i)=>({label:it.label,note:it.note,buf:m[i]})),done)})
   .catch(()=>{if(!b.isConnected)return;$('.wait',b).textContent='Live version: loudness is not matched on this device, so judge the character, not the volume.';const hh=h('div');b.append(hh);abWidget(hh,o.items.map(it=>({label:it.label,note:it.note,bpm:100,play:it.live})),done)})}

function qRound(o){const R={label:o.label,skill:o.skill,dim:o.dim||'l',tag:o.tag,hints:o.hints||[]};
  R.run=function(area,api){let q=o.gen();area._q=q;const sync=()=>{R.skill=q.skill||o.skill;R.dim=q.dim||o.dim||'l';R.tag=q.tag||o.tag;R.hints=q.hints||o.hints||[];R.demo=q.demo?()=>q.demo():null;R.demoText=q.demoText;R.revealFn=null};sync();
    const body=h('div','stack');area.append(body);if(o.say)body.before(h('p','muted',o.say));
    const render=()=>{body.innerHTML='';body.append(h('p','qprompt',q.prompt));
      if(q.type==='task'){const th=h('div','stack');body.append(th);const ctl={};let fired=false;q.render(th,(ok,msg)=>{if(fired)return;fired=true;if(ok)api.hit(o.dmg||40,!!o.crit,(o.win?o.win+' ':'Right! ')+(msg||''));else api.miss(msg||'Not quite.')},ctl);R.demo=ctl.demo?()=>ctl.demo():R.demo;R.revealFn=ctl.reveal||null;return}
      if(q.plays){const pl=h('div','qplays');q.plays.forEach(p=>{const b=h('button','btn ghost',p.label);b.onclick=()=>{playQ(p.fn);b.classList.add('heard')};pl.append(b)});body.append(pl)}
      const vz=h('div','vizhost');body.append(vz);if(q.viz)q.viz(vz,false);
      const op=h('div','qopts'+(q.wide?' wide':''));q.options.forEach(opt=>{const b=h('button','btn qopt',opt.label);b.dataset.v=opt.v;b.onclick=()=>{stopGroup();[...op.children].forEach(x=>x.disabled=true);const ok=opt.v===q.answer;const ex=q.explain?q.explain(opt.v):'';if(ok)api.hit(o.dmg||40,!!o.crit,(o.win?o.win+' ':'Right! ')+ex);else api.miss(ex)};op.append(b)});body.append(op);area._op=op;
      if(q.plays)setTimeout(()=>{if(body.isConnected)playQ(q.plays[0].fn)},250)};
    if(q.prepare){body.innerHTML='<p class="muted">The monster is rendering its attack…</p>';initAudio();withTimeout(q.prepare(),5000).then(()=>{if(body.isConnected)render()}).catch(()=>{if(!body.isConnected)return;const f=q.fallback?q.fallback():conceptQ([].concat(q.skill)[0]);q=Object.assign({},f);area._q=q;sync();render()})}else render()};
  R.reveal=a=>{if(R.revealFn){R.revealFn();return}const op=a._op,q=a._q;if(!op||!q)return;const b=[...op.children].find(x=>x.dataset.v===q.answer);if(b)b.classList.add('qopt','reveal')};
  return R}
/* practical rounds: fix the problem with a real plugin, then STRIKE */
function rigRound(o){const R={label:o.label,skill:o.skill,dim:'p',tag:o.tag,hints:o.hints||[],demoText:o.demoText};
  R.run=function(area,api){area.append(h('p','muted',o.say));const host=h('div','stack');area.append(host);const k=o.build(host);area._k=k;const st=h('button','btn pink block big',`${SWORD} STRIKE`);area.append(st);hydrateIcons(area);
    st.onclick=async()=>{if(k.rig&&k.rig.ready&&!k.rig.ready()){toast('ONE MOMENT · THE PLUGIN IS STILL MEASURING');return}st.disabled=true;const r=await o.check(k);if(k.rig&&k.rig.stop)k.rig.stop();if(r.ok)api.hit(o.dmg||50,true,r.win||o.win);else api.miss(r.why)}};
  if(o.reveal)R.reveal=a=>{if(a._k)o.reveal(a._k)};if(o.demo)R.demo=a=>{if(a._k)o.demo(a._k)};return R}
