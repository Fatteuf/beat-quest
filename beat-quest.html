 battle:{mon:'noisebat',hp:3,gen:i=>i%2?echoTask(3):contourQ()},
 steps:[
 {k:'DISCOVER',render(b,done){lessonHead(b,'Notes are named pitches',`Music uses <b>12 notes</b> that repeat: C, C#, D, D#, E, F, F#, G, G#, A, A#, B. Then the pattern starts again one <b>octave</b> higher, where every frequency doubles.<br><br><b>MIDI</b> records no sound at all. It records instructions: <b>which note</b>, <b>when</b>, <b>how long</b> and <b>how hard</b> (velocity). A synth turns those instructions into sound.`);eyebrowW(b,'caves');
   const info=h('div','sect');info.innerHTML='<div class="sect-h"><b>MIDI MONITOR</b></div><p class="num mon" style="font-size:21px;color:var(--neon)">Press a key…</p>';b.append(info);const kh=h('div');b.append(kh);const seen=new Set();
   keyboard(kh,{lo:60,hi:76,labels:true,onNote:m=>{$('.mon',info).textContent=`NOTE ON · ${noteName(m)} · MIDI #${m} · ${midiF(m).toFixed(1)} Hz`;seen.add(m);if(seen.size>=5)done()}});b.append(h('p','muted','Play 5 different keys. Watch the note name, the MIDI number and the frequency.'))}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Same melody, one octave up</div><p>Both play the same notes. B is one octave higher: every frequency doubles, the note names stay the same.</p><div class="abhost"></div>`;
   const mel=[60,62,64,67,64,62,60,0];const mk=o=>(s,t)=>{if(s%2===0){const m=mel[(s/2)%8];if(m)SV(t,midiF(m+o),.25,PLUCK,.3)}};
   abWidget($('.abhost',b),[{label:'Octave 4',note:'C4 up to G4, the middle of the piano.',bpm:100,play:mk(0)},{label:'Octave 5',note:'C5 up to G5: same notes, double the frequency.',bpm:100,play:mk(12)}],done)}},
 {k:'EXPERIMENT',render(b,done){b.innerHTML=`<div class="big-title">Explore the keyboard</div><p>Play anything. Discover at least 3 of these:</p>`;
   const mark=discover(b,['Play any C (the labelled white keys)','Play a black key (a sharp)','Play two notes exactly one octave apart, one after the other','Play 8 notes in a row, each higher than the last'],3,done);
   const kh=h('div');b.append(kh);const mon=h('p','num','—');mon.style.cssText='font-size:20px;color:var(--neon)';b.append(mon);let last=null,run=0;
   keyboard(kh,{lo:48,hi:72,labels:true,onNote:m=>{mon.textContent=`${noteName(m)} · MIDI #${m} · ${midiF(m).toFixed(1)} Hz`;if(m%12===0)mark(0);if([1,3,6,8,10].includes(m%12))mark(1);if(last!=null&&Math.abs(m-last)===12)mark(2);run=last!=null&&m>last?run+1:1;if(run>=8)mark(3);last=m}})}},
 {k:'CHALLENGE',render(b,done){quizStep(b,done,{title:'Follow the melody',text:'Which way does the melody move, and can you play it back? Get <b>3 of 4</b>.',gen:i=>[()=>contourQ(),()=>echoTask(3),()=>contourQ(),()=>conceptQ(pick(['midi','notes']))][i](),win:'You can follow a melody by ear.'})}}]},
k2:{title:'Scales & Chords',teaches:['scales','chords'],skills:['scales','chords'],xp:450,coins:20,game:'chord',mission:'midi',
 battle:{mon:'spider',hp:3,gen:i=>i%2?scaleQ():chordMoodQ(1)},
 steps:[
 {k:'DISCOVER',render(b,done){lessonHead(b,'Families of notes',`A <b>scale</b> is a family of 7 notes that sound good together. <b>C major</b> is every white key from C: bright and happy. <b>A minor</b> uses the same keys starting from A: darker.<br><br>A <b>chord</b> is 3 or more notes at once. The basic <b>triad</b> stacks every other note of the scale: <b>root, third, fifth</b>. The third decides the mood.`);eyebrowW(b,'caves');
   const kh=h('div');b.append(kh);const kb=keyboard(kh,{lo:57,hi:72,labels:true});const row=h('div','row wrap');row.style.gap='6px';b.append(row);const heard=new Set();const AM=[57,59,60,62,64,65,67,69];
   [['▶ C MAJOR SCALE',()=>{kb.unmark();kb.mark(SCALE_C);playQ(d=>playNotes(d,SCALE_C,{step:.28}))}],['▶ A MINOR SCALE',()=>{kb.unmark();kb.mark(AM);playQ(d=>playNotes(d,AM,{step:.28}))}],
    ['▶ C MAJOR CHORD',()=>{kb.unmark();kb.mark([60,64,67]);playQ(d=>playNotes(d,[[60,64,67]],{chord:true,dur:1.4,patch:PADP,v:.22}))}],['▶ A MINOR CHORD',()=>{kb.unmark();kb.mark([57,60,64]);playQ(d=>playNotes(d,[[57,60,64]],{chord:true,dur:1.4,patch:PADP,v:.22}))}]]
    .forEach(([l,f],i)=>{const x=h('button','btn ghost sm',l);x.onclick=()=>{f();heard.add(i);if(heard.size>=4)done()};row.append(x)});b.append(h('p','muted','Play all four and watch the keys.'))}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Bright versus dark</div><p>Same rhythm, two chord progressions. A is in C major, B in A minor. Feel the mood change.</p><div class="abhost"></div>`;
   const prog=ch=>(s,t)=>{if(s%16===0)ch[(s/16)%ch.length].forEach(m=>SV(t,midiF(m),2.2,PADP,.13));if(s%4===0)V.kick(t,.5);if(s%8===4)V.snare(t,.35)};
   abWidget($('.abhost',b),[{label:'C major',note:'C then F. Bright and resolved.',bpm:100,play:prog([[60,64,67],[53,57,60]])},{label:'A minor',note:'Am then Dm. Darker and emotional.',bpm:100,play:prog([[57,60,64],[50,53,57]])}],done)}},
 {k:'EXPERIMENT',render(b,done){b.innerHTML=`<div class="big-title">Build chords</div><p>Tap keys to select them, tap again to remove. The chord detector names what you build. Discover at least 2:</p>`;
   const mark=discover(b,['Build any major triad','Build any minor triad','Build a triad that uses a black key'],2,done);
   const kh=h('div');b.append(kh);const out=h('p','num','—');out.style.cssText='font-size:24px;color:var(--amber)';b.append(out);let kb=null;
   const name=()=>{const sel=[...kb.sel].sort((a,c)=>a-c);const pcs=[...new Set(sel.map(m=>m%12))];let found=null;if(pcs.length===3)pcs.forEach(r=>{const iv=pcs.map(p=>(p-r+12)%12).sort((a,c)=>a-c).join(',');if(iv==='0,4,7')found=[r,'major'];if(iv==='0,3,7')found=[r,'minor'];if(iv==='0,3,6')found=[r,'diminished']});
     out.textContent=found?`${NOTE_NAMES[found[0]]} ${found[1]}`:sel.length?sel.map(noteName).join(' + '):'—';if(found){if(found[1]==='major')mark(0);if(found[1]==='minor')mark(1);if(sel.some(m=>[1,3,6,8,10].includes(m%12)))mark(2)}};
   kb=keyboard(kh,{lo:55,hi:74,select:true,labels:true,onNote:()=>name()});const r=h('div','row');r.style.gap='6px';const pl=h('button','btn ghost sm','▶ PLAY MY CHORD'),cl=h('button','btn ghost sm','CLEAR');r.append(pl,cl);b.append(r);
   pl.onclick=()=>{const n=[...kb.sel];if(n.length)playQ(d=>playNotes(d,[n],{chord:true,dur:1.3,patch:PADP,v:.22}))};cl.onclick=()=>{kb.clearSel();name()}}},
 {k:'CHALLENGE',render(b,done){quizStep(b,done,{title:'Chord school',text:'Name moods, build chords, spot the scale. Get <b>3 of 4</b>.',gen:i=>[()=>chordMoodQ(1),()=>chordTask('C major'),()=>scaleQ(),()=>chordTask('A minor')][i](),win:'Major, minor, triads: the harmony toolkit is yours.'})}}]},
k3:{title:'Waves & Oscillators',teaches:['oscillators','waveforms'],skills:['oscillators','waveforms'],xp:450,coins:20,tool:'synth',game:'wave',mission:'synth',
 battle:{mon:'wisp',hp:3,gen:()=>waveQ(2)},
 steps:[
 {k:'DISCOVER',render(b,done){lessonHead(b,'Every synth starts with a wave',`An <b>oscillator</b> makes a tone by repeating a shape hundreds of times per second. That shape is the <b>waveform</b>, and it sets the character:<br><br><b>Sine</b>: pure, no harmonics. <b>Triangle</b>: soft. <b>Saw</b>: every harmonic, bright and buzzy. <b>Square</b>: odd harmonics only, hollow.`);eyebrowW(b,'caves');
   const heard=new Set();const g=h('div','twocol');b.append(g);['sine','triangle','sawtooth','square'].forEach(w=>{const c=h('div','stack');c.style.gap='4px';g.append(c);waveDraw(c,w);const x=h('button','btn ghost sm','▶ '+WAVE_NAME[w]);x.onclick=()=>{playQ(d=>withRoute(d,()=>SV(now()+.05,midiF(57),1,{wave:w,a:10,d:300,s:.9,r:200,cut:14000},.35)));heard.add(w);if(heard.size>=4)done()};c.append(x)});b.append(h('p','muted','Hear all four.'))}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Pure versus buzzy</div><p>The same bass riff. A is a sine wave, B a saw. Hear the saw fill the room with harmonics.</p><div class="abhost"></div>`;const riff=[45,0,57,0,52,0,57,55];const mk=w=>(s,t)=>{if(s%2===0){const m=riff[(s/2)%8];if(m)SV(t,midiF(m),.2,{wave:w,a:4,d:200,s:.6,r:120,cut:12000},.36)}};
   abWidget($('.abhost',b),[{label:'Sine',note:'One frequency. Round and soft: sub-bass territory.',bpm:110,play:mk('sine')},{label:'Saw',note:'All harmonics. The classic bass and lead sound.',bpm:110,play:mk('sawtooth')}],done)}},
 {k:'EXPERIMENT',render(b,done,ctx){b.innerHTML=`<div class="big-title">Meet Pixel Wave</div><p>A real wavetable synth, built like Serum or Vital. Drag the wavetable left and right, turn the knobs, play the keys. Discover at least 3:</p>`;
   const mark=discover(b,['Morph the wavetable all the way to SINE','Morph it to SAW','Stack 3 or more unison voices','Add the SUB oscillator (over 30%)'],3,done);
   const rig=synthRig(b,{show:['osc'],presets:false,patch:mkPatch({wt:.36}),onChange:P=>{const n=wtName(P.wt);if(n==='sine')mark(0);if(n==='sawtooth')mark(1);if(P.uni>=3)mark(2);if(P.sub>.3)mark(3)}});ctx.onLeave(()=>rig.stop())}},
 {k:'CHALLENGE',render(b,done){quizStep(b,done,{title:'Name that wave',text:'Four oscillators. Name each waveform by ear. Get <b>3 of 4</b>.',gen:i=>waveQ(i<2?1:2),win:'You can hear the shape of a sound.'})}}]},
k4:{title:'Shape the Sound',teaches:['adsr','filters','lfo','modulation','synthesis'],skills:['adsr','filters','lfo','modulation','synthesis'],xp:450,coins:20,mission:'synth',
 battle:{mon:'larva',hp:3,gen:i=>[()=>envQ(),()=>filterQ(),()=>lfoQ()][i%3]()},
 steps:[
 {k:'DISCOVER',render(b,done){lessonHead(b,'Filter, envelope, LFO',`After the oscillator, three tools shape the sound:<br><br><b>Filter</b>: a low-pass removes the highs above its <b>cutoff</b>. Low cutoff = dark.<br><b>Envelope (ADSR)</b>: <b>A</b>ttack, <b>D</b>ecay, <b>S</b>ustain, <b>R</b>elease. How each note starts, holds and fades.<br><b>LFO</b>: a slow wave that moves another knob by itself. That is <b>modulation</b>.<br><br>Bright oscillator, then filter, then envelope: that recipe is <b>subtractive synthesis</b>.`);eyebrowW(b,'caves');
   const heard=new Set();const row=h('div','row wrap');row.style.gap='6px';b.append(row);
   [['▶ OPEN FILTER',mkPatch({wt:.66,cut:9000,a:5,s:.9})],['▶ CLOSED FILTER',mkPatch({wt:.66,cut:350,a:5,s:.9})],['▶ SLOW ATTACK',mkPatch({wt:.66,cut:2500,a:900,s:.9,r:900})],['▶ LFO WOBBLE',mkPatch({wt:.9,cut:700,res:6,s:1,lfoDest:'cut',lfoDepth:.8,lfoRate:3})]]
    .forEach(([l,P],i)=>{const x=h('button','btn ghost sm',l);x.onclick=()=>{playQ(d=>playNotes(d,[[45,57]],{chord:true,dur:1.6,patch:P,v:.3}));heard.add(i);if(heard.size>=4)done()};row.append(x)});b.append(h('p','muted','Hear all four.'))}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Pluck versus pad</div><p>Same chords, same oscillator. Only the envelope changes.</p><div class="abhost"></div>`;const mk=P=>(s,t)=>{if(s%8===0)[[57,60,64],[53,57,60]][(s/16|0)%2].forEach(m=>SV(t,midiF(m),P.a>100?1.2:.25,P,.2))};
   abWidget($('.abhost',b),[{label:'Pluck',note:'Attack 3 ms, no sustain. Pops, then fades fast.',bpm:100,play:mk(mkPatch({wt:.66,a:3,d:220,s:.05,r:200,cut:3200}))},{label:'Pad',note:'Attack 900 ms, long release. Fades in and hangs in the air.',bpm:100,play:mk(mkPatch({wt:.66,uni:3,det:.4,a:900,d:900,s:.85,r:1500,cut:1800}))}],done)}},
 {k:'EXPERIMENT',render(b,done,ctx){b.innerHTML=`<div class="big-title">The full synth</div><p>Every section is live: drag the filter dot, the envelope handles and the LFO. The presets (◀ ▶) show what the pros start from. Discover at least 3:</p>`;
   const mark=discover(b,['Close the filter below 600 Hz','Give the amp a slow attack (over 300 ms)','Turn the resonance above 6','Send the LFO to the cutoff with more than 30% depth'],3,done);
   const rig=synthRig(b,{onChange:P=>{if(P.cut<600)mark(0);if(P.a>300)mark(1);if(P.res>6)mark(2);if(P.lfoDest==='cut'&&P.lfoDepth>.3)mark(3)}});ctx.onLeave(()=>rig.stop())}},
 {k:'CHALLENGE',render(b,done,ctx){b.innerHTML=`<div class="big-title">Design a pluck</div><p>Press <b>▶ TARGET SOUND</b> to hear a pluck. Shape the amp envelope until yours behaves the same: instant attack, short decay, no sustain. Then CHECK.</p>`;
   const T=mkPatch({wt:.66,a:3,d:250,s:0,r:250,cut:3000});const rig=synthRig(b,{show:['osc','filter','env'],presets:false,target:T,patch:mkPatch({wt:.66,a:600,d:900,s:.9,r:1400,cut:3000})});ctx.onLeave(()=>rig.stop());
   const fb=h('div');const ck=h('button','btn neon block','CHECK');b.append(fb,ck);ck.onclick=()=>{const P=rig.P;const a=P.a<=30,s2=P.s<=.2,d=P.d>=60&&P.d<=800,r=P.r<=900;const ok=a&&s2&&d&&r;ctx.attempt('env',ok);
     fb.innerHTML=ok?'<p class="fb good">A pluck! Fast attack, short decay, zero sustain: the envelope behind every pluck, stab and key sound.</p>':`<p class="fb">${a?'':'The attack is too slow: the note fades in instead of popping. '}${s2?'':'The sustain is too high: the note keeps ringing while the key is held. '}${d?'':'Set the decay between 60 and 800 ms. '}${r?'':'The release is so long the notes smear together.'}</p>`;if(ok){sfx.ok();done()}else sfx.bad()};
   ctx.hint(b,{hints:['A pluck starts instantly. Look at the first handle of the amp envelope.','Attack under 30 ms, sustain at 0%, decay around 250 ms.'],demo:()=>rig.playRiff(T),demoText:'That is the target. Now match its shape.',reveal:()=>rig.set({a:3,d:250,s:0,r:250})})}}]}});

Object.assign(BATTLES,{
ghost:{name:'OSCILLATOR GHOST',lv:12,hp:160,bpm:110,weak:'Waveforms',tests:['Waveforms','Filters','Chord mood','Sound design'],xp:700,coins:60,mission:'synth',
 intro:'A wailing tone drifts out of the crystal walls. The OSCILLATOR GHOST keeps changing its shape!',attack:'The ghost wails straight through you. Your ears ring!',hint:'Its shape decides its sound: pure, soft, hollow or buzzy?',
 listen:()=>playQ(d=>playNotes(d,[57,64,69,64],{step:.35,patch:mkPatch({wt:1,cut:2400,a:40,s:.8,r:300}),dur:.4})),
 rounds:[qRound({label:'READ ITS SHAPE',gen:()=>waveQ(2),dmg:35}),qRound({label:'HEAR THE FILTER',gen:()=>filterQ(),dmg:35}),qRound({label:'FEEL ITS MOOD',gen:()=>chordMoodQ(2),dmg:35}),
  rigRound({label:'COPY ITS VOICE',skill:['waveforms','oscillators'],tag:'wave',dmg:55,say:'Final blow! Press ▶ TARGET SOUND to hear the ghost’s voice. Morph your wavetable to the same shape, then STRIKE.',hints:['Is its voice pure, soft, hollow or buzzy?','Hollow and woody means square: the far right end of the wavetable.'],demoText:'That is its voice. Match the shape.',

   check:k=>wtName(k.rig.P.wt)==='square'?{ok:true,win:'CRITICAL HIT! A square wave: odd harmonics only, hollow like a clarinet. You matched its voice and the ghost fades away.'}:{ok:false,why:`That is a ${WAVE_NAME[wtName(k.rig.P.wt)].toLowerCase()} wave. The ghost sounds hollow and woody: square.`},demo:k=>k.rig.playRiff(k.T),reveal:k=>k.rig.set({wt:1})})]},
dragon:{name:'THE SYNTH DRAGON',lv:15,hp:260,bpm:100,weak:'Harmony and sound design',tests:['Chord mood','Envelopes','LFO','Melody','Pad design'],xp:900,coins:100,ability:'wave',cosmetics:['hoodie-dragon'],mission:'synth',lines:['DRAGON SCALE HOODIE UNLOCKED'],
 intro:'The cave shakes. THE SYNTH DRAGON uncoils, roaring chords and bending its own voice. Only real sound design can calm it!',attack:'The dragon roars a wall of detuned saws. Your ears burn!',hint:'The dragon is made of harmony and shape: chords, envelopes and movement.',
 listen:()=>playQ(d=>playNotes(d,[[45,57,60,64]],{chord:true,dur:2,patch:PRESETS.WOBBLE,v:.3})),
 rounds:[qRound({label:'HEAR ITS HEART',gen:()=>chordMoodQ(3),dmg:40}),qRound({label:'READ ITS BREATH',gen:()=>envQ(),dmg:40}),qRound({label:'SPOT THE WOBBLE',gen:()=>lfoQ(),dmg:40}),qRound({label:'ECHO ITS SONG',gen:()=>echoTask(4),dmg:50}),
  rigRound({label:'CALM IT WITH A PAD',skill:['adsr','synthesis'],tag:'env',dmg:70,say:'Final blow! Calm the dragon with a soft pad: attack 300 ms or more, release 800 ms or more, cutoff under 2.5 kHz. Then STRIKE.',hints:['A pad fades in and lingers. Look at the attack and release.','Attack 300 ms or more, release 800 ms or more, cutoff under 2.5 kHz. Unison makes it wider.'],
   build:host=>({rig:synthRig(host,{show:['osc','filter','env'],presets:false,patch:mkPatch({wt:.66,a:2,d:200,s:.2,r:100,cut:9000})})}),
   check:k=>{const P=k.rig.P;const a=P.a>=300,r=P.r>=800,c=P.cut<=2500;return a&&r&&c?{ok:true,win:'CRITICAL HIT! A warm, slow pad washes over the cave. The dragon closes its eyes… and hums along.'}:{ok:false,why:`${a?'':'The attack is too fast: pads fade in. '}${r?'':'The release is too short: pads linger. '}${c?'':'The filter is too open: pull the cutoff under 2.5 kHz.'}`}},reveal:k=>k.rig.set({a:700,r:1500,s:.8,cut:1500,uni:3,det:.4})})]}});

TRIALS.ktrial=scr=>trialShell(scr,{id:'ktrial',world:'caves',eyebrow:'SOUND DESIGN',cert:'SOUND DESIGNER',skills:['oscillators','waveforms','adsr','filters','lfo','synthesis'],cosmetics:['phones-wave'],mission:'synth',
 brief:'I need three sounds for my track: a deep BASS, a glassy PLUCK and a slowly wobbling PAD. Here are my references. Can you rebuild them on your synth?',
 problems:['BASS: saw wave, one octave down, a dark filter, a fast attack.','PLUCK: triangle wave, instant attack, short decay, zero sustain.','PAD: slow attack, long release, and an LFO moving the filter.'],
 hints:['Work on one sound at a time. Play the TARGET, then yours, again and again.','Waveform and octave first, then the envelope, then the filter and the LFO.'],
 build:host=>{const T=[{n:'BASS',t:mkPatch({wt:.66,oct:-1,cut:500,res:3,a:3,d:250,s:.6,r:120,sub:.3}),p:mkPatch({wt:0,oct:0,cut:6000,a:300,d:600,s:.6,r:600}),keys:['wt','oct','cut','a'],riff:[[45,0,.5],[45,.75,.25],[48,1,.5],[43,1.5,.5]]},
   {n:'PLUCK',t:mkPatch({wt:.36,a:2,d:220,s:0,r:250,cut:4000}),p:mkPatch({wt:.66,a:300,d:600,s:.8,r:300,cut:4000}),keys:['wt','a','s','d']},
   {n:'PAD',t:mkPatch({wt:.66,uni:3,det:.4,a:700,d:900,s:.8,r:1400,cut:1400,lfoDest:'cut',lfoDepth:.5,lfoRate:2}),p:mkPatch({wt:.66,a:5,d:300,s:.6,r:200,cut:1400}),keys:['a','r','lfoDepth'],riff:[[57,0,2],[60,0,2],[64,0,2]]}];
   const seg=h('div','seg2');seg.style.setProperty('--pc','#a98bff');seg.innerHTML=T.map((x,i)=>`<button data-i="${i}">${i+1} · ${x.n}</button>`).join('');host.append(seg);const rh=h('div');host.append(rh);let rig=null,cur=0;
   const open=i=>{if(rig)rig.stop();cur=i;rh.innerHTML='';$$('button',seg).forEach(x=>x.classList.toggle('on',+x.dataset.i===i));rig=synthRig(rh,{patch:T[i].p,target:T[i].t,presets:false,riff:T[i].riff})};
   $$('button',seg).forEach(x=>x.onclick=()=>open(+x.dataset.i));open(0);return{T,stop:()=>rig&&rig.stop(),rig:()=>rig,cur:()=>cur}},
 demo:k=>k.rig().playRiff(k.T[k.cur()].t),demoText:'That is the reference for the sound you have open.',
 criteria:k=>{const NM={wt:'waveform',oct:'octave',cut:'filter cutoff',a:'attack',s:'sustain',d:'decay',r:'release',lfoDepth:'LFO depth'};return k.T.map(x=>{const r=patchCheck(x.p,x.t,x.keys);const bad=x.keys.filter(q=>!r[q]);return crit(x.n,!bad.length,'matches the reference.',`check the ${bad.map(q=>NM[q]).join(', ')}.`,x.n==='PAD'?'lfo':x.n==='PLUCK'?'env':'wave')})}});

WVICT.caves={big:['CAVES','CONQUERED'],then:'“A synth is a keyboard with presets.”',now:'“I can design sounds.”',
 learned:['Read notes and MIDI','Follow a melody by ear','Major versus minor','Build triads','Name waveforms','Shape with ADSR','Filter and resonance','Modulate with an LFO'],
 daw:'Open Serum, Vital or Ableton’s Wavetable: oscillators, filter, envelopes and LFOs sit where they sit on Pixel Wave. You already know the map.',next:'The EQ Desert awaits',nextTxt:'Every instrument lives in its own frequency range. Learn to see them, cut the mud, and beat the Spectrum King.'};

const peakNode=(f,g,q,type,mk)=>liveNode(c=>{const x=c.createBiquadFilter();x.type=type||'peaking';x.frequency.value=f;x.Q.value=q||1;x.gain.value=g||0;if(mk){const o=c.createGain();o.gain.value=mk;x.connect(o);x._out=o}else x._out=x;return x});
Object.assign(LESSONS,{
d1:{title:'The Frequency Map',teaches:['frequency','eq'],skills:['frequency','eq'],xp:150,coins:15,mission:'eq',
 battle:{mon:'worm',hp:3,gen:i=>freqBandQ(i<1?1:2)},
 steps:[
 {k:'DISCOVER',render(b,done){lessonHead(b,'Every sound has an address',`Frequencies run from <b>20 Hz</b> (deep rumble) to <b>20,000 Hz</b> (air). Producers split them into zones:<br><br><b>Sub</b> 20–60 · <b>Bass</b> 60–250 · <b>Low-mids</b> 250–500, where mud lives · <b>Mids</b> 500–2k · <b>Upper-mids</b> 2–5k, presence and harshness · <b>Highs</b> 5–20k, sparkle and air.`);eyebrowW(b,'desert');
   const Z=[[20,60,'SUB','#6c5cff'],[60,250,'BASS','#a98bff'],[250,500,'LOW-MID','#ff7a3a'],[500,2000,'MID','#ffb547'],[2000,5000,'UPPER','#ff4f9a'],[5000,20000,'HIGH','#3ef0c8']];const I=[['KICK',55,.18],['BASS',100,.38],['SNARE',220,.58],['LEAD',1500,.3],['VOCAL',3000,.5],['HATS',9000,.7]];
   display(b,150,(g,W,H)=>{gridLines(g,W,H,{freq:true});Z.forEach(([a,c,n,col])=>{const x0=LOG20(a)*W,x1=LOG20(c)*W;g.fillStyle=col+'22';g.fillRect(x0,0,x1-x0,H);g.fillStyle=col;g.font='10px VT323, monospace';g.fillText(n,x0+3,12)});
     I.forEach(([n,f,y])=>{const x=LOG20(f)*W,yy=H*y+20;g.fillStyle='#f1e7d0';g.fillRect(x-2,yy-2,5,5);g.font='11px VT323, monospace';g.fillText(n,Math.min(W-34,x+5),yy+4)})});
   const hb=h('button','btn ghost block','▶ HEAR THE SONG');hb.onclick=listenSong();b.append(hb);done()}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Only lows, only highs</div><p>A plays the song through a low-pass filter (just the bottom). B through a high-pass (just the top).</p><div class="abhost"></div>`;
   const lp=peakNode(250,0,.7,'lowpass'),hp=peakNode(4000,0,.7,'highpass',1.6);
   abWidget($('.abhost',b),[{label:'Below 250 Hz',note:'Kick and bass: weight and punch.',bpm:100,play:(s,t)=>withRoute(lp(),()=>songStep(s,t,null,{bpm:100}))},{label:'Above 4 kHz',note:'Hats and snare sizzle: air and detail.',bpm:100,play:(s,t)=>withRoute(hp(),()=>songStep(s,t,null,{bpm:100}))}],done)}},
 {k:'EXPERIMENT',render(b,done,ctx){b.innerHTML=`<div class="big-title">Hunt the instruments</div><p>This narrow band-pass lets only one slice of the spectrum through. Sweep the FREQ knob and listen. Discover at least 3:</p>`;
   const mark=discover(b,['Find the kick thump (below 100 Hz)','Find the bass notes (100–250 Hz)','Find the lead melody (1–3 kHz)','Find the hi-hat sizzle (above 7 kHz)'],3,done);
   initAudio();if(!A.ctx)return;const out=rigOut(),bp=A.ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=2.2;bp.frequency.value=600;const mk=A.ctx.createGain();mk.gain.value=2.5;bp.connect(mk);mk.connect(out.g);
   const pg=plug(b,{name:'BAND HUNTER',type:'BAND-PASS SOLO',col:'#3ef0c8',bypass:false});const d=display(pg.body,120,(g,W,H)=>{gridLines(g,W,H,{freq:true});drawSpectrum(g,W,H,out.an,'rgba(62,240,200,.18)',null,-110);const x=LOG20(bp.frequency.value)*W;g.fillStyle='#f1e7d0';g.fillRect(x-1,0,2,H);g.font='11px VT323, monospace';g.fillText(fmtHz(bp.frequency.value)+' Hz',Math.min(W-50,x+4),12)});addLive(d.cv,()=>d.redraw());
   const kr=h('div','krow');pg.body.append(kr);let tm=0;knob(kr,{label:'FREQ',min:40,max:12000,log:true,value:600,fmt:fmtHz,col:'#3ef0c8',size:58,onInput:v=>{bp.frequency.value=v;clearTimeout(tm);tm=setTimeout(()=>{if(v<100)mark(0);else if(v<=250)mark(1);else if(v>=1000&&v<=3000)mark(2);else if(v>7000)mark(3)},700)}});
   seq.start({bpm:100,route:bp,play:(s,t)=>songStep(s,t,null,{bpm:100})});ctx.onLeave(()=>{seq.stop();out.kill()})}},
 {k:'CHALLENGE',render(b,done){quizStep(b,done,{title:'Frequency hunter',text:'One zone of the song is boosted in each test. Which one? Get <b>3 of 4</b>.',gen:i=>i===3?conceptQ('eq'):freqBandQ(i<2?1:2),win:'You can hear where sounds live.'})}}]},
d2:{title:'Cut & Boost',teaches:['eq'],skills:['eq'],xp:150,coins:15,tool:'eq',mission:'eq',
 battle:{mon:'harsh',hp:3,gen:i=>i%2?mudQ():freqBandQ(2)},
 steps:[
 {k:'DISCOVER',render(b,done){lessonHead(b,'Meet the EQ',`An <b>EQ</b> turns frequency zones up (<b>boost</b>) or down (<b>cut</b>). Each band has a shape:<br><br><b>Bell</b>: a hill or a dip around one frequency. <b>Q</b> sets its width: high Q is narrow and surgical.<br><b>Shelf</b>: lifts or lowers everything above or below a point.<br><b>Low cut</b> (high-pass): removes everything below it. Perfect for rumble.<br><br>Golden rule: <b>cut before you boost</b>.`);eyebrowW(b,'desert');
   display(b,110,(g,W,H)=>{gridLines(g,W,H,{freq:true,db:18});initAudio();if(!A.ctx)return;[['peaking',400,-9,2,'#3ef0c8','BELL CUT'],['highshelf',6000,6,.7,'#a98bff','HIGH SHELF'],['highpass',80,0,.7,'#ff4f9a','LOW CUT']].forEach(([t,f,gg,q,col,n])=>{const x=A.ctx.createBiquadFilter();x.type=t;x.frequency.value=f;x.gain.value=gg;x.Q.value=q;const N=Math.floor(W/2),fr=new Float32Array(N),mg=new Float32Array(N),ph=new Float32Array(N);for(let i=0;i<N;i++)fr[i]=FROMLOG20(i/N);x.getFrequencyResponse(fr,mg,ph);
     g.beginPath();for(let i=0;i<N;i++){const y=clamp(H/2-gToDb(mg[i])/18*(H/2-10),-2,H+2);if(i===0)g.moveTo(i*2,y);else g.lineTo(i*2,y)}g.strokeStyle=col;g.lineWidth=2;g.stroke();g.fillStyle=col;g.font='10px VT323, monospace';g.fillText(n,clamp(LOG20(f)*W-20,2,W-60),t==='highshelf'?H*.22:H*.85)})});done()}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Hear the mud</div><p>B has a +10 dB bell at 300 Hz: that is mud, boxy and cloudy. A is clean.</p><div class="abhost"></div>`;const pk=peakNode(300,10,1,'peaking',.55);
   abWidget($('.abhost',b),[{label:'Clean',note:'Every zone in balance.',bpm:100,play:(s,t)=>songStep(s,t,null,{bpm:100})},{label:'+10 dB at 300 Hz',note:'Muddy, like a blanket over the speakers.',bpm:100,play:(s,t)=>withRoute(pk(),()=>songStep(s,t,null,{bpm:100}))}],done)}},
 {k:'EXPERIMENT',render(b,done,ctx){b.innerHTML=`<div class="big-title">Frequency Blade</div><p>A real 6-band EQ with a live analyser, like Pro-Q or EQ Eight. Drag the numbered dots, or pick a band and turn its knobs. Discover at least 3:</p>`;
   const mark=discover(b,['Boost a bell by 6 dB or more','Cut a bell by 6 dB or more','Turn on the LOW CUT (band 1) above 100 Hz','Make a bell surgical: Q of 4 or more'],3,done);
   const rig=eqRig(b,{onChange:bands=>bands.forEach(x=>{if(x.type==='peaking'&&x.on){if(x.g>=6)mark(0);if(x.g<=-6)mark(1);if(x.q>=4)mark(3)}if(x.id===1&&x.on&&x.f>100)mark(2)})});ctx.onLeave(()=>rig.stop())}},
 {k:'CHALLENGE',render(b,done,ctx){b.innerHTML=`<div class="big-title">Cut the harshness</div><p>Something in this mix screams in the upper mids and hurts at high volume. Find it and cut it without dulling the rest. Then CHECK.</p>`;
   const rig=eqRig(b,{problems:[{type:'peaking',f:3200,g:9,q:2}]});ctx.onLeave(()=>rig.stop());const fb=h('div');const ck=h('button','btn neon block','CHECK');b.append(fb,ck);
   ck.onclick=()=>{const at=rig.net(3200),lo=rig.net(400),hi=rig.net(10000);const ok=at<=3&&lo>=-4&&hi>=-6;ctx.attempt('eqfix',ok);fb.innerHTML=ok?`<p class="fb good">Fixed: the harsh zone at 3.2 kHz now sits at ${at>0?'+':''}${at.toFixed(1)} dB and the rest of the mix is untouched.</p>`:`<p class="fb">${at>3?`The harshness still pokes out: +${at.toFixed(1)} dB around 3 kHz. `:''}${lo<-4?'You cut the low-mids and the body too. ':''}${hi<-6?'You dulled the top end. Cut narrower.':''}</p>`;if(ok){sfx.ok();done()}else sfx.bad()};
   ctx.hint(b,{hints:['Harshness lives in the upper mids, between 2 and 5 kHz.','Select band 4, put it near 3 kHz, cut about 8 dB with a Q around 2.'],demo:()=>rig.showProblems(),demoText:'The dashed pink curve is the problem. Cut exactly there.',reveal:()=>rig.setBand(4,{f:3200,g:-9,q:2,on:true})})}}]},
d3:{title:'Masking',teaches:['masking'],skills:['masking','eq'],xp:150,coins:15,mission:'eq',
 battle:{mon:'blob',hp:3,gen:()=>maskQ()},
 steps:[
 {k:'DISCOVER',render(b,done){lessonHead(b,'When sounds fight',`When two sounds share the same frequencies, the louder one hides the quieter one. That is <b>masking</b>. The classic fight is <b>kick versus bass</b>, both below 100 Hz.<br><br>The fix: give each its own lane. Cut the bass a little where the kick thumps (around 50–80 Hz), and let the bass own the zone just above.`);eyebrowW(b,'desert');
   display(b,100,(g,W,H)=>{gridLines(g,W,H,{freq:true});const hill=(f,w,a,col)=>{g.beginPath();for(let x=0;x<=W;x+=2){const d=(x/W-LOG20(f))/w;const y=H-8-a*Math.exp(-d*d)*(H-22);if(x===0)g.moveTo(x,y);else g.lineTo(x,y)}g.lineTo(W,H);g.lineTo(0,H);g.closePath();g.fillStyle=col;g.fill()};
     hill(60,.06,.9,'rgba(255,181,71,.55)');hill(85,.08,.8,'rgba(169,139,255,.5)');g.font='10px VT323, monospace';g.fillStyle='#ffb547';g.fillText('KICK',LOG20(28)*W,14);g.fillStyle='#a98bff';g.fillText('BASS',LOG20(140)*W,26);g.fillStyle='#ff4f9a';g.fillText('OVERLAP = MASKING',LOG20(250)*W,44)});done()}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Masked versus carved</div><p>Headphones help. In A, the bass is boosted right where the kick lives. In B, the bass is cut there. Listen for the kick.</p><div class="abhost"></div>`;
   const m1=peakNode(90,8,1.2,'lowshelf'),m2=peakNode(65,-9,1.2,'peaking');
   abWidget($('.abhost',b),[{label:'Masked',note:'Kick and bass pile up. The kick disappears.',bpm:100,play:(s,t)=>kickBassStep(s,t,{bass:m1()})},{label:'Carved',note:'The bass steps aside. The kick punches through.',bpm:100,play:(s,t)=>kickBassStep(s,t,{bass:m2()})}],done)}},
 {k:'EXPERIMENT',render(b,done,ctx){b.innerHTML=`<div class="big-title">Carve the bass</div><p>The EQ now sits on the <b>bass only</b>. The kick plays untouched. Discover at least 2:</p>`;
   const mark=discover(b,['Cut 4 dB or more somewhere between 50 and 90 Hz','Turn on the LOW CUT (band 1) between 30 and 60 Hz','Boost the bass by 2 dB or more around 150–300 Hz so it stays full'],2,done);
   const rig=eqRig(b,{src:'kickbass',select:2,onChange:bands=>bands.forEach(x=>{if(x.on&&!x.type.includes('pass')&&x.g<=-4&&x.f>=50&&x.f<=90)mark(0);if(x.id===1&&x.on&&x.f>=30&&x.f<=60)mark(1);if(x.on&&x.type==='peaking'&&x.g>=2&&x.f>=150&&x.f<=300)mark(2)})});ctx.onLeave(()=>rig.stop())}},
 {k:'CHALLENGE',render(b,done,ctx){b.innerHTML=`<div class="big-title">Unmask the kick</div><p>This bass smothers the kick. Carve a lane for the kick in the bass, but keep the bass body around 160 Hz. Then CHECK.</p>`;
   const rig=eqRig(b,{src:'kickbass',problems:[{type:'lowshelf',f:90,g:6}]});ctx.onLeave(()=>rig.stop());const fb=h('div');const ck=h('button','btn neon block','CHECK');b.append(fb,ck);
   ck.onclick=()=>{const k=rig.net(60),body=rig.net(160);const ok=k<=-3&&body>=-6;ctx.attempt('mask',ok);fb.innerHTML=ok?`<p class="fb good">Carved: the bass sits at ${k.toFixed(1)} dB around 60 Hz, so the kick owns that lane, and the bass body is intact.</p>`:`<p class="fb">${k>-3?`The bass is still ${k>0?'+':''}${k.toFixed(1)} dB at 60 Hz, right on top of the kick. Bring it to -3 dB or lower. `:''}${body<-6?'You cut the bass body too. Keep 160 Hz alive.':''}</p>`;if(ok){sfx.ok();done()}else sfx.bad()};
   ctx.hint(b,{hints:['The kick thumps around 50–80 Hz, and the bass is boosted there.','Pull band 2 (LOW SHELF) down about 10 dB, or cut a bell near 60 Hz.'],demo:()=>rig.showProblems(),demoText:'The dashed curve shows the bass boost. Cut against it.',reveal:()=>rig.setBand(2,{f:90,g:-10,on:true})})}}]}});

 {k:'DISCOVER',render(b,done){lessonHead(b,'When compression goes too far',`A compressor is great until it squeezes the life out of a sound. Watch the <b>gain reduction</b> (GR) meter:<br><br><b>2–6 dB</b>: gentle control, still punchy.<br><b>10 dB or more</b>: squashed. Every hit sounds the same.<br><br>A <b>release</b> that is too long makes the groove <b>pump</b>: everything ducks after each hit. An <b>attack</b> that is too fast kills the snap. Trust your ears first, then check the meter.`);eyebrowW(b,'volcano');
   const hb=h('button','btn ghost block','▶ HEAR THE RAW GROOVE');hb.onclick=listenPeak;b.append(hb);done()}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Gentle versus crushed</div><p>Matched in loudness. A has about 4 dB of gain reduction. B has about 15 dB with an instant attack and a long release.</p>`;
   const sched=t0=>{for(let s=0;s<32;s++)peakGroove(s,t0+s*SPB)};const comp=(thr,ratio,att,rel)=>(oc,inp)=>{const k=oc.createDynamicsCompressor();k.threshold.value=thr;k.ratio.value=ratio;k.knee.value=2;k.attack.value=att;k.release.value=rel;inp.connect(k);return k};const crushed=compNode(-40,20,.001,.6,2.2);

 {k:'EXPERIMENT',render(b,done,ctx){b.innerHTML=`<div class="big-title">Find the limits</div><p>All five controls are live, including MAKEUP gain. Discover at least 3:</p>`;

const verbNode=(decay,dry,wet,damp,lp)=>liveNode(c=>{const inp=c.createGain(),cv=c.createConvolver(),w=c.createGain(),d=c.createGain(),o=c.createGain();cv.buffer=makeIR(c,decay,damp||7000,.9);w.gain.value=wet;d.gain.value=dry;let src=inp;if(lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=lp;inp.connect(f);src=f}src.connect(d);d.connect(o);src.connect(cv);cv.connect(w);w.connect(o);inp._out=o;return inp});
const delayNode=(dt,fb,mix)=>liveNode(c=>{const inp=c.createGain(),dl=c.createDelay(2),g=c.createGain(),m=c.createGain(),o=c.createGain(),lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5000;dl.delayTime.value=dt;g.gain.value=fb;m.gain.value=mix;inp.connect(o);inp.connect(dl);dl.connect(lp);lp.connect(g);g.connect(dl);lp.connect(m);m.connect(o);inp._out=o;return inp});
Object.assign(LESSONS,{
s1:{title:'Rooms & Halls',teaches:['reverb'],skills:['reverb'],xp:150,coins:15,tool:'reverb',game:'reverb',mission:'reverb',
 battle:{mon:'echo',hp:3,gen:i=>reverbQ(i<2?1:2)},
 steps:[
 {k:'DISCOVER',render(b,done){lessonHead(b,'Every space has a sound',`Clap in a bathroom, then in a cathedral. The difference is <b>reverb</b>: thousands of reflections bouncing off the walls.<br><br><b>Decay</b> is how long the tail lasts: small rooms under 1 second, halls 2 seconds and more.<br><b>Damping</b> cuts the highs of the tail, like soft walls.<br><b>Dry/wet</b> balances the original against the reverb.`);eyebrowW(b,'swamp');
   const heard=new Set();const row=h('div','row wrap');row.style.gap='6px';b.append(row);
   [['▶ DRY',0],['▶ SMALL ROOM',.5],['▶ HALL',2.6],['▶ CATHEDRAL',6]].forEach(([l,dec],i)=>{const x=h('button','btn ghost sm',l);x.onclick=()=>{playQ(d=>{const c=A.ctx;let inp=d;if(dec){const cv=c.createConvolver();cv.buffer=makeIR(c,dec,8000,.9);const w=c.createGain();w.gain.value=.9;cv.connect(w);w.connect(d);const s=c.createGain();s.connect(d);s.connect(cv);inp=s}withRoute(inp,()=>{V.snare(now()+.05,.8);V.kick(now()+.05,.5)})});heard.add(i);if(heard.size>=4)done()};row.append(x)});b.append(h('p','muted','Hear all four spaces.'))}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Dry versus hall</div><p>The same lead. A has no reverb. B sits in a 2.6-second hall.</p><div class="abhost"></div>`;const hall=verbNode(2.6,1,.7);
   abWidget($('.abhost',b),[{label:'Dry',note:'Close, direct, in your face.',bpm:100,play:(s,t)=>srcStep('lead',s,t)},{label:'Hall',note:'Wide and far, surrounded by space.',bpm:100,play:(s,t)=>withRoute(hall(),()=>srcStep('lead',s,t))}],done)}},
 {k:'EXPERIMENT',render(b,done,ctx){b.innerHTML=`<div class="big-title">Space Crystal</div><p>A real algorithmic reverb with its tail drawn live, like Valhalla or Ableton’s Reverb. Discover at least 3:</p>`;
   const mark=discover(b,['Build a cathedral: decay over 3 s','Shrink it to a small room: decay under 0.6 s','Darken the tail: damping under 3 kHz','Push it far away: dry/wet over 60%'],3,done);
   const rig=spaceRig(b,{show:['rev'],src:'snare',onChange:st=>{if(st.decay>3)mark(0);if(st.decay<.6)mark(1);if(st.damp<3000)mark(2);if(st.wet>.6)mark(3)}});ctx.onLeave(()=>rig.stop())}},
 {k:'CHALLENGE',render(b,done){quizStep(b,done,{title:'Name the space',text:'Dry, room or hall? And which sound is further away? Get <b>3 of 4</b>.',gen:i=>[()=>reverbQ(1),()=>reverbQ(1),()=>wetQ(),()=>conceptQ('reverb')][i](),win:'You can hear the size of a room.'})}}]},
s2:{title:'Depth & Pre-delay',teaches:['reverb'],skills:['reverb'],xp:150,coins:15,mission:'reverb',
 battle:{mon:'swisp',hp:3,gen:i=>i%2?reverbQ(2):wetQ()},
 steps:[
 {k:'DISCOVER',render(b,done){lessonHead(b,'Near and far',`A mix has <b>depth</b>: some sounds up front, others far back. Three things push a sound back: <b>more reverb</b>, <b>less volume</b> and <b>fewer highs</b>.<br><br>Most mixes share one reverb. Each track <b>sends</b> part of itself into it: more send, further back.<br><br><b>Pre-delay</b> is a short gap before the reverb starts. 20–60 ms keeps a lead clear and upfront, even in a big space.`);eyebrowW(b,'swamp');
   display(b,90,(g,W,H)=>{g.fillStyle='#07050d';g.fillRect(0,0,W,H);for(let i=0;i<5;i++){g.strokeStyle='#171230';g.strokeRect(W*.5-(i+1)*W*.09,H*.5-(i+1)*H*.09,(i+1)*W*.18,(i+1)*H*.18)}[['LEAD',.5,.5,'#6cb8ff',1],['SNARE',.3,.35,'#ff4f9a',.7],['PAD',.8,.22,'#8fbf3a',.45]].forEach(([n,x,y,c,a])=>{g.globalAlpha=a;g.fillStyle=c;g.fillRect(W*x-6*a,H*y-6*a,12*a,12*a);g.font='11px VT323, monospace';g.fillText(n,W*x+10*a,H*y+4);g.globalAlpha=1})});
   b.append(h('p','muted','Front (big, bright) to back (small, faded): lead, snare, pad.'));done()}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Close versus far</div><p>The same lead. B has more reverb, less dry signal and fewer highs. Your brain reads that as distance.</p><div class="abhost"></div>`;const near=verbNode(2,1,.12),far=verbNode(2,.35,1.2,5000,3000);
   abWidget($('.abhost',b),[{label:'Close',note:'Mostly dry, bright and direct.',bpm:100,play:(s,t)=>withRoute(near(),()=>srcStep('lead',s,t))},{label:'Far',note:'Mostly reverb, darker, quieter.',bpm:100,play:(s,t)=>withRoute(far(),()=>srcStep('lead',s,t))}],done)}},
 {k:'EXPERIMENT',render(b,done,ctx){b.innerHTML=`<div class="big-title">One reverb, three sends</div><p>Lead, pad and snare share this reverb. Each SEND knob sets how far back that sound sits. Discover at least 3:</p>`;
   const mark=discover(b,['Send the pad deep: send over 60%','Keep the lead close: send under 15%','Add 30 ms or more of pre-delay','Make a medium hall: decay between 1.5 and 3 s'],3,done);
   const rig=spaceRig(b,{show:['rev'],sends:true,init:{sends:{lead:.3,pad:.2,snare:.2},decay:1,pre:0},onChange:st=>{if(st.sends.pad>.6)mark(0);if(st.sends.lead<.15)mark(1);if(st.pre>=30)mark(2);if(st.decay>=1.5&&st.decay<=3)mark(3)}});ctx.onLeave(()=>rig.stop())}},
 {k:'CHALLENGE',render(b,done,ctx){b.innerHTML=`<div class="big-title">Stage the band</div><p>Put the <b>lead up front</b>, the <b>snare in the middle</b> and the <b>pad far back</b>. Add pre-delay so the lead stays clear. Then CHECK.</p>`;
   const rig=spaceRig(b,{show:['rev'],sends:true,init:{sends:{lead:.4,pad:.4,snare:.4},decay:2,pre:0}});ctx.onLeave(()=>rig.stop());const fb=h('div');const ck=h('button','btn neon block','CHECK');b.append(fb,ck);
   ck.onclick=()=>{const s2=rig.st.sends,st=rig.st;const L=s2.lead<=.2,P=s2.pad>=.5,Sn=s2.snare>=.15&&s2.snare<=.45,Pr=st.pre>=20&&st.pre<=80;const ok=L&&P&&Sn&&Pr;ctx.attempt('space',ok);
     fb.innerHTML=ok?'<p class="fb good">Three layers of depth: lead up front, snare in the room, pad in the distance. That is a 3D mix.</p>':`<p class="fb">${L?'':'The lead is too far back: send 20% or less. '}${P?'':'Push the pad further back: send 50% or more. '}${Sn?'':'The snare should sit in between: 15–45%. '}${Pr?'':'Add 20–80 ms of pre-delay.'}</p>`;if(ok){sfx.ok();done()}else sfx.bad()};
   ctx.hint(b,{hints:['More send = further back. Front: lead. Middle: snare. Back: pad.','Lead about 10%, snare about 30%, pad about 70%, pre-delay about 40 ms.'],reveal:()=>rig.set({sends:{lead:.1,snare:.3,pad:.7},pre:40})})}}]},
s3:{title:'Echoes in Time',teaches:['delay'],skills:['delay'],xp:150,coins:15,tool:'delay',game:'echo',mission:'delay',
 battle:{mon:'toad',hp:3,gen:i=>delayQ(i<2?1:2)},
 steps:[
 {k:'DISCOVER',render(b,done){lessonHead(b,'Echoes in time',`A <b>delay</b> repeats a sound after a set time. Producers sync it to the tempo so the echoes land in the groove:<br><br>one beat = <b>60,000 ÷ BPM</b> milliseconds. At 100 BPM a quarter note (1/4) is 600 ms, an 8th (1/8) is 300 ms, a dotted 8th (1/8D) is 450 ms.<br><br><b>Feedback</b> sends the echo back in for more repeats. <b>Ping-pong</b> bounces them left and right.`);eyebrowW(b,'swamp');
   const pg=plug(b,{name:'TEMPO CALCULATOR',type:'DELAY TIMES',col:'#3ef0c8',bypass:false});const out=h('div','stack');out.style.gap='2px';let bpm=100;
   const draw=()=>{out.innerHTML=Object.keys(NOTE_VALS).map(k=>`<div class="row sp"><span class="kb-lab" style="font-size:10px">${k==='1/8D'?'DOTTED 1/8':k==='1/4D'?'DOTTED 1/4':k}</span><span class="num" style="font-size:19px;color:var(--neon)">${Math.round(NOTE_VALS[k]*60000/bpm)} ms</span></div>`).join('')};
   const kr=h('div','krow');pg.body.append(kr,out);knob(kr,{label:'BPM',min:60,max:180,step:1,value:100,fmt:v=>Math.round(v)+'',col:'#3ef0c8',size:52,onInput:v=>{bpm=Math.round(v);draw()}});draw();done()}},
 {k:'LISTEN',render(b,done){b.innerHTML=`<div class="big-title">Dry versus dotted 8th</div><p>A is the dry lead. B adds a dotted-8th delay (450 ms at 100 BPM): the echoes fill the gaps and make the line bounce.</p><div class="abhost"></div>`;const dl=delayNode(.45,.38,.5);
   abWidget($('.abhost',b),[{label:'Dry',note:'Just the notes.',bpm:100,play:(s,t)=>srcStep('lead',s,t)},{label:'Dotted 1/8 delay',note:'Echoes land between the notes. The U2 and trance trick.',bpm:100,play:(s,t)=>withRoute(dl(),()=>srcStep('lead',s,t))}],done)}},
 {k:'EXPERIMENT',render(b,done,ctx){b.innerHTML=`<div class="big-title">Time Spell</div><p>A tempo-synced stereo delay, like Echo or ValhallaDelay. The graph shows each echo over two bars. Discover at least 3:</p>`;
   const mark=discover(b,['Sync it to a dotted 1/8 (1/8D)','Push the feedback over 60%','Turn on PING-PONG','Switch to FREE time'],3,done);
   const rig=spaceRig(b,{show:['dly'],src:'lead',init:{dmix:.4,sync:'1/4'},onChange:st=>{if(st.sync==='1/8D')mark(0);if(st.fb>.6)mark(1);if(st.pp)mark(2);if(st.sync==='FREE')mark(3)}});ctx.onLeave(()=>rig.stop())}},
 {k:'CHALLENGE',render(b,done,ctx){b.innerHTML=`<div class="big-title">Sync the echo</div><p>This delay is free-running and runs away. Lock it to a <b>dotted 8th</b>, with feedback between 25% and 55% and a mix between 20% and 60%. Then CHECK.</p>`;
   const rig=spaceRig(b,{show:['dly'],src:'lead',init:{sync:'FREE',free:333,fb:.85,dmix:.75}});ctx.onLeave(()=>rig.stop());const fb=h('div');const ck=h('button','btn neon block','CHECK');b.append(fb,ck);
   ck.onclick=()=>{const st=rig.st;const sy=st.sync==='1/8D',f=st.fb>=.25&&st.fb<=.55,m=st.dmix>=.2&&st.dmix<=.6;const ok=sy&&f&&m;ctx.attempt('delay',ok);
     fb.innerHTML=ok?'<p class="fb good">Locked in: 450 ms at 100 BPM, a few repeats, sitting behind the lead.</p>':`<p class="fb">${sy?'':'Pick 1/8D in the sync row. '}${f?'':'Feedback between 25% and 55%. '}${m?'':'Mix between 20% and 60%.'}</p>`;if(ok){sfx.ok();done()}else sfx.bad()};
   ctx.hint(b,{hints:['Choose a note value instead of FREE.','1/8D, feedback about 40%, mix about 35%.'],reveal:()=>rig.set({sync:'1/8D',fb:.4,dmix:.35})})}}]}});

   display(b,90,(g,W,H)=>{gridLines(g,W,H,{cols:8});const c=H/2,top=H*.18;g.fillStyle='#ff4f9a';g.fillRect(0,top-1,W,2);g.fillRect(0,H-top-1,W,2);g.font='10px VT323, monospace';g.fillText('0 dBFS',4,top-3);
     g.beginPath();for(let x=0;x<=W;x+=2){const v=Math.sin(x/W*Math.PI*6)*1.5;const y=c-clamp(v,-1,1)*(c-top);if(x===0)g.moveTo(x,y);else g.lineTo(x,y)}g.strokeStyle='#f1e7d0';g.lineWidth=2;g.stroke();g.fillStyle='#ff4f9a';g.fillText('CLIPPED: FLAT TOPS',W*.55,H-4)});done()}},

const GENRES=[{id:'hiphop',n:'HIP-HOP',lo:80,hi:100},{id:'pop',n:'POP',lo:95,hi:125},{id:'house',n:'HOUSE',lo:118,hi:130},{id:'trap',n:'TRAP',lo:130,hi:150},{id:'dnb',n:'DRUM & BASS',lo:165,hi:178}];
const FKEYS=[['A MINOR',0],['B MINOR',2],['C MINOR',3],['D MINOR',5],['E MINOR',-5],['F MINOR',-4],['G MINOR',-2]];
const PROGS=[{n:'i – VI – III – VII',mood:'Epic and emotional',ch:[[57,60,64],[53,57,60],[48,52,55],[55,59,62]],bass:[45,41,36,43]},
 {n:'i – iv – v – i',mood:'Dark, classic minor',ch:[[57,60,64],[50,53,57],[52,55,59],[57,60,64]],bass:[45,38,40,45]},
 {n:'i – VII – VI – VII',mood:'Driving and anthemic',ch:[[57,60,64],[55,59,62],[53,57,60],[55,59,62]],bass:[45,43,41,43]},
 {n:'i – III – VII – iv',mood:'Hopeful and cinematic',ch:[[57,60,64],[48,52,55],[55,59,62],[50,53,57]],bass:[45,36,43,38]}];
const SECS=['INTRO','VERSE','BUILD','DROP','BREAK','OUTRO'];
const FT=[{id:'kick',n:'KICK',col:'#ffb547',pk:-3,bus:1},{id:'snare',n:'SNARE',col:'#ff4f9a',pk:-6,bus:1},{id:'hat',n:'HATS',col:'#3ef0c8',pk:-13,bus:1},{id:'bass',n:'BASS',col:'#a98bff',pk:-7},{id:'chords',n:'CHORDS',col:'#8fbf3a',pk:-12,hp:1},{id:'lead',n:'LEAD',col:'#6cb8ff',pk:-9,hp:1}];
const PADS={PAD:PRESETS.PAD,KEYS:mkPatch({wt:.36,a:4,d:700,s:.35,r:500,cut:3000}),PLUCK:PRESETS.PLUCK,SAW:mkPatch({wt:.66,uni:5,det:.5,a:30,d:600,s:.7,r:600,cut:5000})};

const newProject=()=>({bpm:110,genre:null,key:0,prog:null,pad:'PAD',rhythm:'SUSTAIN',pat:{kick:new Array(16).fill(0),snare:new Array(16).fill(0),hat:new Array(16).fill(0)},bass:new Array(16).fill(0),lead:new Array(16).fill(0),
  leadP:mkPatch(PRESETS.LEAD),leadTouched:false,names:['INTRO','VERSE','BUILD','DROP','BREAK','BUILD','DROP','OUTRO'],arr:[0,1,2,3,4,5,6,7].map(()=>[0,0,0,0]),auto:new Array(8).fill(0),
  mix:Object.fromEntries(FT.map(t=>[t.id,{lvl:0,pan:0,send:0,hp:30}])),comp:{thr:0,ratio:1,att:10},rev:{decay:2},master:{gain:0,ceil:0,rel:80}});
const trOf=F=>FKEYS[F.key][1];
const chordQual=ch=>ch[1]-ch[0]===3?'m':'';
const chordName=(ch,tr)=>NOTE_NAMES[((ch[0]+tr)%12+12)%12]+chordQual(ch);

/* ---- audio graph, shared by live playback and the offline render ---- */
function buildFinal(c,F){const G={c,T:{}};const sum=c.createGain(),bus=c.createDynamicsCompressor(),rev=c.createConvolver(),revG=c.createGain(),auto=c.createBiquadFilter();auto.type='lowpass';auto.Q.value=.9;auto.frequency.value=20000;
  bus.knee.value=4;bus.release.value=.12;bus.connect(sum);rev.buffer=makeIR(c,F.rev.decay,7000,.9);revG.gain.value=1;rev.connect(revG);revG.connect(sum);sum.connect(auto);
  FT.forEach(t=>{const inp=c.createGain(),hp=c.createBiquadFilter(),g=c.createGain(),pn=c.createStereoPanner?c.createStereoPanner():c.createGain(),sg=c.createGain(),an=c.createAnalyser();hp.type='highpass';hp.Q.value=.7;an.fftSize=512;
    inp.connect(hp);hp.connect(g);g.connect(pn);pn.connect(an);an.connect(t.bus?bus:sum);g.connect(sg);sg.connect(rev);G.T[t.id]={inp,hp,g,pn,sg,an}});
  const out=c.createGain(),oAn=c.createAnalyser();oAn.fftSize=2048;out.connect(oAn);Object.assign(G,{sum,bus,rev,auto,out,oAn,decay:F.rev.decay});G.chain=buildMasterChain(c,auto,F.master,'limit');G.chain.clip.connect(out);G.ceil=F.master.ceil;applyFinal(G,F);return G}
function applyFinal(G,F){const c=G.c;FT.forEach(t=>{const m=F.mix[t.id],n=G.T[t.id];n.g.gain.value=m.lvl<=-59.5?0:dbToG(m.lvl);if(n.pn.pan)n.pn.pan.value=m.pan;n.sg.gain.value=m.send;n.hp.frequency.value=t.hp?m.hp:20});
  G.bus.threshold.value=F.comp.thr;G.bus.ratio.value=F.comp.ratio;G.bus.attack.value=F.comp.att/1000;
  if(Math.abs(G.decay-F.rev.decay)>.05){G.decay=F.rev.decay;G.rev.buffer=makeIR(c,F.rev.decay,7000,.9)}
  if(G.ceil!==F.master.ceil){try{G.auto.disconnect()}catch(e){}try{G.chain.clip.disconnect()}catch(e){}G.chain=buildMasterChain(c,G.auto,F.master,'limit');G.chain.clip.connect(G.out);G.ceil=F.master.ceil}
  G.chain.drive.gain.value=dbToG(F.master.gain);if(G.chain.lim)G.chain.lim.release.value=F.master.rel/1000}
function finalStep(F,s,t,G){const spb=60/F.bpm/4,sec=Math.floor(s/32)%8,i=s%16,bar=Math.floor(s/16)%4,on=F.arr[sec],tr=trOf(F),T=G.T;
  if(s%32===0){const f=G.auto.frequency;f.cancelScheduledValues(t);if(F.auto[sec]){f.setValueAtTime(220,t);f.exponentialRampToValueAtTime(19000,t+32*spb)}else f.setValueAtTime(20000,t)}
  if(on[0]){withRoute(T.kick.inp,()=>{if(F.pat.kick[i])V.kick(t,.9)});withRoute(T.snare.inp,()=>{if(F.pat.snare[i])V.snare(t,.75)});withRoute(T.hat.inp,()=>{if(F.pat.hat[i])V.hat(t,.5)})}

     knob(kr,{label:'RELEASE',min:10,max:500,log:true,value:F.master.rel,fmt:fmtMs,col:'#f1e7d0',onTouch:()=>{tip.textContent='Limiter release: too fast distorts, too slow pumps.'},onInput:v2=>{F.master.rel=v2;ch()}});
     const d=display(B,90,(g,W,H)=>{gridLines(g,W,H,{freq:true});if(FG)drawSpectrum(g,W,H,FG.oAn,'rgba(241,231,208,.14)',null,-110)});addLive(d.cv,()=>d.redraw());
     const box=h('div','sect');box.innerHTML=`<div class="sect-h"><b>LOUDNESS · FULL SONG</b></div><div class="bigval lu" style="--pc:#f1e7d0">— —</div><span class="kb-lab">LUFS INTEGRATED</span><div class="lufsbar"><i style="width:0%"></i><b style="left:55.6%"></b></div><span class="num pk" style="font-size:18px;color:var(--dim)">PEAK — dBFS</span><div class="wv"></div>`;B.append(box);
     const showM=()=>{if(!meas)return;$('.lu',box).textContent=meas.lufs.toFixed(1);$('.lufsbar i',box).style.width=clamp((meas.lufs+24)/18,0,1)*100+'%';$('.pk',box).textContent=`PEAK ${meas.peak.toFixed(1)} dBFS${meas.est?' (estimated)':''}`};showM();
     const row=h('div','row wrap');row.style.gap='6px';B.append(row);const rb=h('button','btn neon','RENDER & MEASURE');const pb=h('button','btn ghost sm','▶ PLAY RENDER');const xb=h('button','btn ghost sm','EXPORT WAV');pb.disabled=xb.disabled=!lastBuf;row.append(rb,pb,xb);
     rb.onclick=async()=>{seq.stop();rb.disabled=true;rb.textContent='RENDERING 16 BARS…';try{lastBuf=await withTimeout(renderFinal(F),25000);meas={lufs:lufsOf(lastBuf),peak:peakDb(lastBuf)};$('.wv',box).innerHTML='';waveViz($('.wv',box),[[lastBuf,'YOUR MASTER']])}catch(e){meas=estMaster(F)}F.meas=meas;save();rb.disabled=false;rb.textContent='RENDER AGAIN';pb.disabled=xb.disabled=!lastBuf;showM();paintTabs();sfx.tap()};
     pb.onclick=()=>{if(lastBuf)playQ(dd=>playBuf(lastBuf,dd))};xb.onclick=()=>{if(lastBuf)exportWav(lastBuf,'beat-quest-final-track')};
     const sb=h('button','btn violet big block','SUBMIT FOR CERTIFICATION');v.append(sb);sb.onclick=()=>{seq.stop();submitFinal(F,meas,lastBuf)}}};
  show('arrange')};
function submitFinal(F,meas,buf){const C=evalFinal(F,meas);const n=C.filter(c=>c.ok).length;const need=['Master','Arrangement'];const pass=n>=10&&need.every(k=>C.find(c=>c.k===k).ok);const score=Math.round(n/12*100);
  C.forEach(c=>tagResult({Tempo:'tempo',Groove:'pattern',Bassline:'chord',Harmony:'chord','Melody & sound':'melody',Arrangement:'auto',Automation:'auto',Balance:'mix',EQ:'eqfix',Dynamics:'comp','Space & width':'space',Master:'loud'}[c.k],c.ok));save();
  const m=modal(`<p class="eyebrow" style="color:var(--violet)">THE FINAL TRACK · REVIEW</p><h2 class="rw-t" style="color:${pass?'var(--neon)':'var(--amber)'}">${pass?'CERTIFIED':'NOT YET'} · ${n}/12</h2><div class="critl">${C.map(c=>`<div class="${c.ok?'ok':'no'}"><b>${c.ok?'✓':'✗'}</b><span>${c.k}<small>${c.ok?c.good:c.bad}</small></span></div>`).join('')}</div>${pass?'':'<p class="muted">You need 10 of 12, including Arrangement and Master. Fix the red items and submit again.</p>'}<button class="btn block tr-ok">${pass?'RECEIVE YOUR CERTIFICATE':'BACK TO THE TRACK'}</button>`,{left:true});
  $('.tr-ok',m).onclick=async()=>{m.close();if(!pass)return;const first=!S.cert;S.cert={score,date:todayStr(),n};if(!S.done.includes('final'))S.done.push('final');gain(['patterns','chords','synthesis','eq','compression','reverb','volume','automation','limiting','export'],'p',15);learn(['export']);save();
    if(first){const need70=Math.max(0,cum(70)-S.xp);await reward({eyebrow:'THE FINAL TRACK',title:'PRODUCER CERTIFIED',xp:Math.max(500,need70),coins:300,cosmetics:['hoodie-cert'],lines:[`SCORE ${score}% · ${n} OF 12 CRITERIA`,'PRODUCER GOLD HOODIE UNLOCKED']})}
    go('cert',{score,n,C,buf})}}
RENDER.cert=(scr,arg)=>{arg=arg||{};const c=S.cert||{score:arg.score||0,date:todayStr()};const C=arg.C||[];
  scr.innerHTML=`<div class="stack" style="padding-top:20px"><div class="cert"><p class="eyebrow" style="color:var(--amber)">BEAT QUEST · CERTIFICATE</p><h1 class="logo" style="font-size:34px">PRODUCER<span>CERTIFIED</span></h1><div class="victory-hero"></div>
   <p style="font-size:17px">This certifies that you produced a complete track: tempo, drums, bass, harmony, melody, sound design, arrangement, EQ, compression, space, automation and mastering.</p>
   <div class="statgrid" style="width:100%"><div class="stat"><b>${c.score}%</b><span>final track score</span></div><div class="stat"><b>LV ${level()}</b><span>producer level</span></div><div class="stat"><b>${learnedSkills().length}/43</b><span>skills learned</span></div><div class="stat"><b>${S.defeated.length}</b><span>monsters</span></div></div>
   <div class="row wrap" style="justify-content:center;gap:6px">${WORLDS.slice().reverse().map(W=>`<span class="chip ${worldDone(W.id)?'neon':''}">${W.name.toUpperCase()}</span>`).join('')}</div>
   <p class="muted">Issued ${c.date} · “${RANKS[RANKS.length-1][1]}”</p></div>
   ${C.length?`<div class="win stack" style="text-align:left"><p class="eyebrow">YOUR TRACK</p><div class="critl">${C.map(x=>`<div class="${x.ok?'ok':'no'}"><b>${x.ok?'✓':'✗'}</b><span>${x.k}<small>${x.ok?x.good:x.bad}</small></span></div>`).join('')}</div></div>`:''}
   <div class="win raised stack" style="text-align:left"><p class="eyebrow" style="color:var(--magenta)">WHAT NEXT</p><p style="font-size:15px">Open Ableton Live, FL Studio or Logic and rebuild this track there: a drum rack, a bass, a pad, a lead on a wavetable synth, sends to a reverb, a filter automation into the drop, and a limiter on the master. You already know every step.</p></div>
   ${arg.buf?'<button class="btn big block" data-a="ex">EXPORT MY TRACK (WAV)</button>':''}<button class="btn block" data-a="daw">BACK TO THE DAW</button><button class="btn ghost block" data-a="home">HOME</button></div>`;
  const v=$('.victory-hero',scr);v.append(heroEl(6,'bob'),pipEl(4,'float'));const cp=companionEl(4);if(cp)v.append(cp);sfx.victory();
  const ex=$('[data-a=ex]',scr);if(ex)ex.onclick=()=>exportWav(arg.buf,'beat-quest-final-track');$('[data-a=daw]',scr).onclick=()=>go('final');$('[data-a=home]',scr).onclick=()=>go('home')};
