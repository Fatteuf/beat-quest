<title>Beat Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap">
<style>
/* Layout: one portrait phone column (max 430px). Screens stack absolutely inside #app; bottom tab bar; RPG "window" panels with notched pixel corners. Deliberately single dark theme: a night-time pixel world. */
:root{
  --void:#07050d;      /* outside the phone */
  --night:#0f0b1c;     /* app ground */
  --panel:#1a1430;     /* RPG window fill */
  --panel2:#241c40;    /* raised fill */
  --edge:#3d3166;      /* window border */
  --ink:#f1e7d0;       /* parchment text */
  --dim:#a092c2;       /* secondary text */
  --amber:#ffb547;     /* primary accent: warm lamp light */
  --magenta:#ff4f9a;   /* enemies, damage, snare */
  --neon:#3ef0c8;      /* success, hi-hat, crit */
  --violet:#a98bff;    /* bass, magic */
  --leaf:#6fd36a;      /* forest */
  --f-disp:'Silkscreen','Courier New',monospace;
  --f-body:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --f-num:'VT323','Courier New',monospace;
  --notch:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;margin:0;background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;display:flex;justify-content:center;align-items:center;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--neon);outline-offset:2px}
.btn:focus-visible,.menubtn:focus-visible,.abbtn:focus-visible,.tool:focus-visible,.jam:focus-visible,.pad:focus-visible,.pip-cta:focus-visible,.trio button:focus-visible{outline:none;box-shadow:inset 0 0 0 3px var(--neon)}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
canvas.bg{object-fit:cover}
#app{position:relative;width:100%;max-width:430px;height:100%;background:var(--night);overflow:hidden;isolation:isolate}
@media (min-width:520px){#app{height:min(100%,920px);box-shadow:0 0 0 4px #1d1733,0 0 0 8px #0c0916,0 30px 80px rgba(0,0,0,.6)}}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 104px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.full{padding-bottom:24px}
.screen.enter{animation:enter .28s steps(5) both}
@keyframes enter{from{transform:translateY(8px)}to{transform:none}}

/* type */
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.02em}
h2{font-size:20px;line-height:1.15}
h3{font-size:15px;line-height:1.2}
p{margin:0}
.eyebrow{font-family:var(--f-disp);font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--dim)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* RPG windows & buttons */
.win{background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);padding:14px;position:relative}
.win.raised{background:var(--panel2)}
.btn{font-family:var(--f-disp);font-weight:700;font-size:14px;letter-spacing:.06em;min-height:50px;padding:10px 16px;border:3px solid #2a1606;background:var(--amber);color:#2a1606;clip-path:var(--notch);box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.35);display:inline-flex;align-items:center;justify-content:center;gap:10px;text-transform:uppercase;transition:transform .06s steps(2)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.22),inset 0 3px 0 rgba(255,255,255,.2)}
.btn:disabled{filter:grayscale(1) brightness(.6);cursor:not-allowed}
.btn.block{width:100%}
.btn.ghost{background:var(--panel2);color:var(--ink);border-color:var(--edge);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.btn.neon{background:var(--neon);color:#062a22;border-color:#062a22}
.btn.pink{background:var(--magenta);color:#2b0515;border-color:#2b0515}
.btn.sm{min-height:44px;font-size:12px;padding:6px 12px}
.btn.big{min-height:62px;font-size:17px}
.chip{font-family:var(--f-disp);font-size:11px;letter-spacing:.08em;padding:4px 8px;background:var(--panel2);border:2px solid var(--edge);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.amber{border-color:var(--amber);color:var(--amber)}
.chip.neon{border-color:var(--neon);color:var(--neon)}
.chip.pink{border-color:var(--magenta);color:var(--magenta)}
.bar{height:12px;background:#0a0714;border:2px solid var(--edge);position:relative;overflow:hidden}
.bar>i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(0,0,0,.28) 6px 8px),var(--c,var(--amber));transition:width .6s steps(12)}

/* top bar */
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:14px 0 10px;background:linear-gradient(var(--night) 70%,transparent)}
.topbar .title{font-family:var(--f-disp);font-size:16px;font-weight:700;flex:1;min-width:0}
.iconbtn{min-width:44px;min-height:44px;background:var(--panel2);border:2px solid var(--edge);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-disp);font-size:13px;padding:0 10px}

/* bottom nav */
#nav{position:absolute;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(5,1fr);background:#0b0816;border-top:3px solid var(--edge);padding:6px 4px 10px}
#nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;min-height:54px;font-family:var(--f-disp);font-size:9.5px;letter-spacing:.06em;color:var(--dim);opacity:.8}
#nav button.on{color:var(--amber);opacity:1}
#nav button.on canvas{filter:drop-shadow(0 0 6px rgba(255,181,71,.55))}

/* title */
#s-title{padding:0}
.title-scene{position:absolute;inset:0}
.title-scene canvas{width:100%;height:100%}
.title-ui{position:relative;z-index:2;min-height:100%;padding:13% 20px 40px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.logo{font-family:var(--f-disp);font-weight:700;font-size:clamp(46px,15vw,64px);line-height:.9;color:var(--amber);text-shadow:0 4px 0 #b3561a,0 8px 0 #5a2410,0 12px 18px rgba(0,0,0,.7);letter-spacing:.02em}
.logo span{display:block;color:var(--ink);text-shadow:0 4px 0 #7b6aa8,0 8px 0 #2d2350,0 12px 18px rgba(0,0,0,.7)}
.tagline{font-size:17px;color:var(--ink);max-width:30ch;text-shadow:0 2px 0 #000}
.title-hero{margin-top:auto;display:flex;align-items:flex-end;gap:10px}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}

/* home hero */
.hero-card{padding:0;overflow:hidden}
.scene{position:relative;height:210px;background:#120e22}
.scene canvas.bg{width:100%;height:100%}
.sprite{position:absolute;bottom:22px}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.float{animation:float 2.4s steps(6) infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.plate{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.plate .lvl{font-family:var(--f-disp);font-size:18px;font-weight:700}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel);border:2px solid var(--edge);padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.stat b{font-family:var(--f-num);font-size:30px;line-height:.9;font-weight:400}
.stat span{font-size:12px;color:var(--dim);line-height:1.1}
.menugrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menubtn{background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);min-height:74px;padding:12px;display:flex;align-items:center;gap:12px;font-family:var(--f-disp);font-size:13px;font-weight:700;text-align:left;letter-spacing:.04em}
.menubtn:active{background:var(--panel2)}
.menubtn canvas{flex:none}
.pip-cta{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,#2a1d0c,var(--panel));border:3px solid #6a4718;clip-path:var(--notch);padding:12px 14px;text-align:left;width:100%}
.pip-cta b{font-family:var(--f-disp);font-size:13px;color:var(--amber)}

/* map */
.mapwrap{position:relative;margin-inline:-16px}
.mapwrap canvas{width:100%;height:auto}
.mnode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:0}
.mnode .pin{width:44px;height:44px;display:grid;place-items:center;background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);font-family:var(--f-disp);font-size:18px;font-weight:700}
.mnode.open .pin{border-color:var(--amber);background:#2b1d0a;color:var(--amber);animation:pulse 1.2s steps(3) infinite}
.mnode.clear .pin{border-color:var(--neon);background:#0b2a24}
.mnode .lab{font-family:var(--f-disp);font-size:11px;font-weight:700;background:rgba(10,7,20,.86);padding:3px 6px;border:2px solid var(--edge);white-space:nowrap}
.mnode.locked .lab{color:var(--dim)}
.mnode .tag{font-family:var(--f-disp);font-size:8.5px;color:var(--amber);letter-spacing:.1em;background:rgba(10,7,20,.86);padding:1px 4px}
@keyframes pulse{50%{filter:brightness(1.7)}}
.maphero{position:absolute;margin:-42px 0 0 -16px;pointer-events:none}

/* region path */
.region-banner{padding:0;overflow:hidden}
.region-banner .scene{height:150px}
.region-banner .over{position:absolute;left:14px;bottom:12px;right:14px}
.path{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:34px}
.path::before{content:"";position:absolute;left:12px;top:18px;bottom:18px;width:4px;background:repeating-linear-gradient(var(--edge) 0 6px,transparent 6px 12px)}
.stage{position:relative;width:100%;text-align:left;display:flex;gap:12px;align-items:center;background:var(--panel);border:3px solid var(--edge);padding:12px}
.stage::before{content:"";position:absolute;left:-32px;top:50%;width:18px;height:18px;margin-top:-9px;background:var(--edge)}
.stage.done{border-color:#1f5c50}
.stage.done::before{background:var(--neon)}
.stage.current{border-color:var(--amber);background:#221a0c}
.stage.current::before{background:var(--amber);animation:blink 1s steps(2) infinite}
.stage.locked{opacity:.55}
.stage .ic{width:44px;height:44px;display:grid;place-items:center;background:#0b0816;flex:none}
.stage .k{font-family:var(--f-disp);font-size:10px;letter-spacing:.12em;color:var(--dim)}
.stage.current .k{color:var(--amber)}
.stage .t{font-family:var(--f-disp);font-size:14px;font-weight:700}
.stage .s{font-size:14px;color:var(--dim)}
.stage .st{font-family:var(--f-disp);font-size:10px;text-align:right;flex:none;color:var(--dim)}

/* lesson */
.lhead{position:sticky;top:0;z-index:5;background:var(--night);padding:14px 0 10px;display:flex;flex-direction:column;gap:10px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stepper span{font-family:var(--f-disp);font-size:9px;letter-spacing:.08em;text-align:center;padding:6px 0 5px;background:var(--panel);border-bottom:3px solid var(--edge);color:var(--dim)}
.stepper span.on{color:var(--amber);border-color:var(--amber)}
.stepper span.ok{color:var(--neon);border-color:var(--neon)}
.lbody{display:flex;flex-direction:column;gap:14px;padding-bottom:12px}
.lbody.enter{animation:enter .28s steps(5) both}
.lfoot{position:sticky;bottom:0;padding:12px 0 18px;background:linear-gradient(transparent,var(--night) 30%)}
.pip-say{display:flex;gap:12px;align-items:flex-start}
.pip-say canvas{flex:none}
.bubble{background:var(--ink);color:#1a1226;padding:12px 14px;clip-path:var(--notch);font-size:16.5px;line-height:1.45;position:relative;flex:1;min-width:0}
.bubble b{color:#8a3d06}
.big-title{font-family:var(--f-disp);font-size:24px;font-weight:700;line-height:1.1;text-wrap:balance}
.lamp{width:72px;height:72px;margin:6px auto;background:var(--amber);border:6px solid #5a3a10;clip-path:var(--notch)}
.lamp.go{animation:lamp var(--dur,1s) steps(2) infinite}
@keyframes lamp{0%{filter:brightness(1.3);transform:scale(1.06)}50%{filter:brightness(.45);transform:scale(.94)}}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.abbtn{background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px}
.abbtn .L{font-family:var(--f-disp);font-size:26px;font-weight:700;color:var(--amber);line-height:1}
.abbtn.playing{border-color:var(--amber);background:#241a0a}
.abbtn.heard .L::after{content:" ✓";color:var(--neon);font-size:16px}
.abbtn small{font-size:14px;color:var(--dim);line-height:1.25}
.scope{width:100%;height:64px;background:#08060f;border:2px solid var(--edge)}
.ruler{display:flex;flex-direction:column;gap:4px}
.ruler div{display:flex;justify-content:space-between;padding:6px 10px;background:var(--panel);border-left:4px solid var(--edge);font-size:15px}
.ruler div.on{border-color:var(--amber);background:#241a0a;color:var(--amber)}
.ruler div.seen:not(.on){border-color:#1f5c50}
.ruler .num{font-size:19px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:10px;background:#0a0714;border:2px solid var(--edge)}
input[type=range]::-moz-range-track{height:10px;background:#0a0714;border:2px solid var(--edge)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:26px;margin-top:-10px;background:var(--amber);border:3px solid #2a1606;border-radius:0}
input[type=range]::-moz-range-thumb{width:18px;height:22px;background:var(--amber);border:3px solid #2a1606;border-radius:0}
.bpmread{font-family:var(--f-num);font-size:64px;line-height:.8;color:var(--amber);text-align:center}
.check{display:flex;flex-direction:column;gap:6px}
.check div{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.check div::before{content:"";flex:none;width:14px;height:14px;margin-top:3px;border:2px solid var(--dim)}
.check div.ok{color:var(--neon)}
.check div.ok::before{background:var(--neon);border-color:var(--neon)}
.fb{font-size:15.5px;padding:10px 12px;border-left:4px solid var(--magenta);background:#2a0f1e}
.fb.good{border-color:var(--neon);background:#0b2620}
.trio{display:grid;gap:10px}
.trio button{display:flex;gap:12px;align-items:center;text-align:left;background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);padding:12px}
.trio button canvas{flex:none}
.trio b{font-family:var(--f-disp);font-size:14px}
.trio p{font-size:15px;color:var(--dim)}

/* sequencer */
.seq{display:flex;flex-direction:column;gap:8px}
.beatrow,.cells{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.beatrow span{font-family:var(--f-num);font-size:15px;text-align:center;color:#5c5184;line-height:1}
.beatrow span.b{color:var(--amber)}
.trk-h{display:flex;align-items:center;gap:8px;font-family:var(--f-disp);font-size:11px;letter-spacing:.08em;margin-bottom:4px}
.trk-h .dot{width:10px;height:10px;flex:none}
.trk-h input{flex:1;min-width:0;height:22px}
.trk-h .vv{font-family:var(--f-num);font-size:16px;color:var(--dim);width:28px;text-align:right}
.cell{height:40px;min-width:0;background:#130f24;border:0;padding:0;box-shadow:inset 0 0 0 2px #2a2248;font-family:var(--f-disp);font-size:10px;font-weight:700;color:#130f24}
.cell.beat{background:#1d1736;box-shadow:inset 0 0 0 2px #3d3166}
.cell.on{background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.28),inset 0 3px 0 rgba(255,255,255,.35)}
.cell.ph{outline:2px solid var(--ink);outline-offset:-2px;filter:brightness(1.4)}
.cell.lockc{cursor:default}
.transport{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bpmbox{display:flex;align-items:center;gap:4px;background:#0a0714;border:2px solid var(--edge);padding:2px}
.bpmbox button{width:40px;height:40px;background:var(--panel2);border:0;font-family:var(--f-disp);font-size:16px}
.bpmbox .num{font-size:26px;min-width:52px;text-align:center;color:var(--amber)}
.barc{font-family:var(--f-num);font-size:22px;color:var(--dim);margin-left:auto}

/* tap widget */
.tapw{display:flex;flex-direction:column;align-items:center;gap:12px}
.tapdots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tapdots i{width:16px;height:16px;background:#130f24;border:2px solid var(--edge)}
.tapdots i.hit{background:var(--neon);border-color:var(--neon)}
.tapdots i.miss{background:var(--magenta);border-color:var(--magenta)}
.tapdots i.now{border-color:var(--amber)}
.pad{width:min(62vw,220px);aspect-ratio:1;max-width:100%;background:var(--panel2);border:4px solid var(--edge);clip-path:var(--notch);font-family:var(--f-disp);font-size:24px;font-weight:700;color:var(--dim);touch-action:none;user-select:none;-webkit-user-select:none}
.pad.flash{background:#3a2a10;border-color:var(--amber);color:var(--amber)}
.pad.pressed{transform:scale(.96);background:#0e3a30;color:var(--neon)}
.tapmsg{font-size:16px;text-align:center;min-height:2.8em}

/* quantize lane */
.lane{position:relative;height:64px;background:#08060f;border:2px solid var(--edge);overflow:hidden}
.lane .gl{position:absolute;top:0;bottom:0;width:1px;background:#2a2248}
.lane .gl.b{width:2px;background:#4d3f80}
.lane .gl.g{background:rgba(62,240,200,.6)}
.lane .nt{position:absolute;top:14px;width:10px;height:22px;margin-left:-5px;background:var(--neon);transition:left .5s steps(5)}
.lane .nt.k{top:42px;background:var(--amber);height:14px}
.qbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* battle */
#s-battle{padding-top:12px}
.bt-top{display:flex;flex-direction:column;gap:6px}
.bt-name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.bt-name h2{font-size:17px;color:var(--magenta)}
.hpbar{--c:var(--magenta);height:16px}
.arena{position:relative;height:230px;margin:10px -16px 0;overflow:hidden;background:#100c1e}
#s-battle.puzzle .arena{height:150px}
.arena canvas.bg{width:100%;height:100%}
.enemy{position:absolute;right:12%;top:26px;transform-origin:50% 100%}
.enemy.slime canvas{animation:squish .9s steps(3) infinite;transform-origin:50% 100%}
@keyframes squish{50%{transform:scale(1.08,.9)}}
.enemy.hurt{animation:hurt .4s steps(4)}
@keyframes hurt{25%{transform:translateX(-10px);filter:brightness(3)}50%{transform:translateX(8px)}75%{transform:translateX(-4px);filter:brightness(2)}}
.enemy.dead{animation:die .9s steps(6) forwards}
@keyframes die{to{opacity:0;transform:scale(1.4,.1)}}
.bhero{position:absolute;left:12%;bottom:16px}
.arena.shake{animation:shake .35s steps(4)}
@keyframes shake{25%{transform:translate(6px,-3px)}50%{transform:translate(-6px,3px)}75%{transform:translate(3px,2px)}}
.arena .flashred{position:absolute;inset:0;background:var(--magenta);opacity:0;pointer-events:none}
.arena .flashred.go{animation:fr .4s steps(3)}
@keyframes fr{30%{opacity:.35}}
.pop{position:absolute;left:68%;top:34px;font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.1;text-align:center;color:var(--ink);text-shadow:0 3px 0 #000;animation:pop 1.1s steps(8) forwards;pointer-events:none;white-space:nowrap;transform:translateX(-50%)}
.pop.crit{font-size:20px;color:var(--neon)}
.pop.miss{color:var(--dim)}
@keyframes pop{0%{opacity:0;margin-top:10px}15%{opacity:1}100%{opacity:0;margin-top:-50px}}
.spark{position:absolute;left:75%;top:80px;width:6px;height:6px;pointer-events:none;animation:spark .7s steps(6) forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
.hearts{display:flex;gap:4px;align-items:center;margin:10px 0 8px}
.hearts .eyebrow{margin-right:6px}
.dialog{min-height:92px;cursor:pointer}
.dialog p{font-size:17px;line-height:1.45}
.dialog .who{font-family:var(--f-disp);font-size:11px;color:var(--amber);letter-spacing:.1em;margin-bottom:4px}
.bt-act{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actgrid .btn:first-child{grid-column:1/-1}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

/* modals */
.modal-back{position:absolute;inset:0;z-index:50;background:rgba(5,3,10,.78);display:flex;align-items:center;justify-content:center;padding:16px;animation:enter .2s steps(4)}
.modal{width:100%;max-height:92%;overflow-y:auto;overflow-x:hidden;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.rw-t{font-size:26px;color:var(--amber);text-shadow:0 3px 0 #5a2410}
.rw-list{display:flex;flex-direction:column;gap:8px;width:100%}
.rw-i{display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-disp);font-size:14px;padding:10px;background:var(--panel2);animation:enter .3s steps(4) both}
.rw-i b{font-family:var(--f-num);font-size:28px;font-weight:400;color:var(--neon)}
.lvup{font-family:var(--f-disp);font-weight:700;font-size:20px;color:var(--neon);animation:blink .5s steps(2) 4}
.dramatic{background:radial-gradient(circle at 50% 42%,#3a2408,#05030a 70%)}
.unlock{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:10px 6px;width:100%}
.rays{position:absolute;left:50%;top:120px;width:520px;height:520px;margin:-260px 0 0 -260px;background:repeating-conic-gradient(rgba(255,181,71,.16) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;pointer-events:none;-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);mask:radial-gradient(circle,#000 20%,transparent 65%)}
@keyframes spin{to{transform:rotate(360deg)}}
.ul-icon{position:relative;animation:grow .8s steps(8) both}
@keyframes grow{from{transform:scale(0)}70%{transform:scale(1.2)}to{transform:scale(1)}}
.unlock h2{font-size:30px;color:var(--amber);text-shadow:0 4px 0 #5a2410;position:relative}
.unlock .weapon{font-family:var(--f-disp);font-size:12px;color:var(--neon);letter-spacing:.12em;position:relative}
.unlock p,.unlock .btn{position:relative}

/* studio */
.room{padding:0;overflow:hidden}
.room .scene{height:190px}
.gear{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.gear div{background:var(--panel);border:2px solid var(--edge);padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--f-disp);font-size:8px;text-align:center;line-height:1.1;letter-spacing:.04em}
.gear div.have{border-color:var(--amber);color:var(--amber)}
.gear div:not(.have){color:#6a5f9a}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jam{min-height:90px;border:3px solid var(--edge);clip-path:var(--notch);background:var(--panel2);font-family:var(--f-disp);font-size:14px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:none}
.jam.hit{background:var(--c);color:#130f24}
.spec{width:100%;height:48px;background:#08060f;border:2px solid var(--edge)}
.cbanner{border-color:var(--amber);background:#221a0c}
.scorebars{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
.scorebars div{display:grid;grid-template-columns:1fr 2fr 40px;gap:8px;align-items:center;font-size:15px}
.scorebars .num{font-size:22px;text-align:right}
.tips{text-align:left;display:flex;flex-direction:column;gap:6px;width:100%}
.tips p{font-size:15px;padding-left:14px;position:relative}
.tips p::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;background:var(--amber)}

/* quests, inventory */
.quest{display:flex;gap:12px;align-items:center}
.quest canvas{flex:none}
.quest .t{font-family:var(--f-disp);font-size:13px;font-weight:700}
.quest .d{font-size:14px;color:var(--dim)}
.quest .rw{font-size:12px;color:var(--amber);font-family:var(--f-disp)}
.quest.claimed{opacity:.55}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs button{min-height:44px;background:var(--panel);border:0;border-bottom:3px solid var(--edge);font-family:var(--f-disp);font-size:12px;letter-spacing:.1em;color:var(--dim)}
.tabs button.on{color:var(--amber);border-color:var(--amber)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:3px solid var(--edge);clip-path:var(--notch);padding:12px;min-width:0}
.tool.have{border-color:#6a4718}
.tool.locked{opacity:.6}
.tool .n{font-family:var(--f-disp);font-size:13px;font-weight:700}
.tool .w{font-size:13px;color:var(--neon)}
.tool .r{font-family:var(--f-disp);font-size:9.5px;color:var(--dim);letter-spacing:.06em}
.tool .bar{height:9px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{min-width:44px;min-height:44px;padding:6px 10px;background:var(--panel2);border:3px solid var(--edge);display:flex;align-items:center;gap:8px;font-size:14px}
.sw i{width:18px;height:18px;flex:none;border:2px solid rgba(0,0,0,.5)}
.sw.on{border-color:var(--amber)}
.sw.lock{opacity:.55}
.dressing{display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:16px;background:radial-gradient(circle at 50% 70%,#2a1f4a,var(--panel) 70%)}

/* coach */
.sheet{position:absolute;inset:0;z-index:60;background:rgba(5,3,10,.7);display:flex;align-items:flex-end}
.sheet-in{width:100%;height:88%;background:var(--panel);border-top:3px solid var(--amber);display:flex;flex-direction:column;animation:up .25s steps(5)}
@keyframes up{from{transform:translateY(40%)}}
.sheet-h{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:2px solid var(--edge)}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;font-size:15.5px;line-height:1.45;white-space:pre-wrap;clip-path:var(--notch)}
.msg.me{align-self:flex-end;background:var(--amber);color:#2a1606}
.msg.pip{align-self:flex-start;background:var(--ink);color:#1a1226}
.msg.note{align-self:center;background:none;color:var(--dim);font-size:13px;text-align:center;clip-path:none}
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;max-height:40%;overflow-y:auto;padding-bottom:16px}
.chips button{flex:none;background:var(--panel2);border:2px solid var(--edge);padding:8px 10px;font-size:14px;white-space:nowrap;min-height:40px}
.composer{display:flex;gap:8px;padding:10px 16px 16px;border-top:2px solid var(--edge)}
.composer input{flex:1;min-width:0;min-height:48px;background:#0a0714;border:2px solid var(--edge);color:var(--ink);font:inherit;font-size:16px;padding:0 12px}

#wipe{position:absolute;inset:0;z-index:40;pointer-events:none;background:var(--night);opacity:0}
#wipe.go{animation:wipe .3s steps(4)}
@keyframes wipe{0%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:16px;right:16px;top:14px;z-index:70;background:var(--panel2);border:3px solid var(--neon);clip-path:var(--notch);padding:10px 14px;font-family:var(--f-disp);font-size:12px;letter-spacing:.06em;color:var(--neon);animation:toast 2.6s steps(6) forwards;pointer-events:none}
@keyframes toast{0%{transform:translateY(-120%)}12%,85%{transform:none}100%{transform:translateY(-120%)}}
.victory-hero{display:flex;justify-content:center;align-items:flex-end;gap:14px;padding:18px 0 6px}
.learned{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.learned span{background:var(--panel2);padding:8px 10px;font-size:14.5px;border-left:3px solid var(--neon)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

function drawSprite(cv,rows,pal,sc){const w=Math.max(...rows.map(r=>r.length)),h=rows.length;cv.width=w*sc;cv.height=h*sc;cv.style.width=w*sc+'px';cv.style.height=h*sc+'px';const g=cv.getContext('2d');g.clearRect(0,0,cv.width,cv.height);rows.forEach((r,y)=>{for(let x=0;x<r.length;x++){const c=pal[r[x]];if(c){g.fillStyle=c;g.fillRect(x*sc,y*sc,sc,sc)}}});return cv}
function sprite(rows,pal,sc,cls){const c=document.createElement('canvas');c.className='px'+(cls?' '+cls:'');return drawSprite(c,rows,pal,sc)}

const A={ctx:null};
function initAudio(){
  if(A.ctx){if(A.ctx.state!=='running')A.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=A.ctx=new C();
  A.master=c.createGain();A.master.gain.value=.9;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
  A.an=c.createAnalyser();A.an.fftSize=1024;
  A.bus=c.createGain();A.bus.connect(A.master);
  A.sfxBus=c.createGain();A.sfxBus.gain.value=.55;A.sfxBus.connect(A.master);
  A.master.connect(comp);comp.connect(A.an);A.an.connect(c.destination);
  const len=c.sampleRate;A.noise=c.createBuffer(1,len,c.sampleRate);const d=A.noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
}
const now=()=>A.ctx?A.ctx.currentTime:0;
function tone(t,type,f,dur,v,fEnd,dest){const c=A.ctx;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(fEnd)o.frequency.exponentialRampToValueAtTime(fEnd,t+dur);g.gain.setValueAtTime(Math.max(v,.0001),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||A.bus);o.start(t);o.stop(t+dur+.03)}
function noiseHit(t,dur,v,type,freq,q,dest){const c=A.ctx;const s=c.createBufferSource();s.buffer=A.noise;const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||.7;const g=c.createGain();g.gain.setValueAtTime(Math.max(v,.0001),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||A.bus);s.start(t,Math.random()*.5);s.stop(t+dur+.03)}
const SEMI=[0,0,3,5,7,10],NOTES=['','A','C','D','E','G'];
const V={
  kick(t,v=.9){if(!A.ctx)return;const f=S.kit==='kit-forest';tone(t,'sine',f?125:165,f?.46:.36,v*1.1,f?38:44);noiseHit(t,.015,v*.25,'highpass',f?1800:3000)},
  snare(t,v=.75){if(!A.ctx)return;const f=S.kit==='kit-forest';noiseHit(t,f?.22:.17,v*.7,f?'bandpass':'highpass',f?1700:1300,f?.9:.7);tone(t,'triangle',f?165:200,.09,v*.5,110)},
  hat(t,v=.5){if(!A.ctx)return;const f=S.kit==='kit-forest';noiseHit(t,f?.06:.045,v*.42,'highpass',f?6200:8200)},
  bass(t,n,v=.7){if(!A.ctx||!n)return;const c=A.ctx,fr=110*Math.pow(2,SEMI[n]/12);const o=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter(),g=c.createGain();o.type='sawtooth';o2.type='sine';o.frequency.value=fr;o2.frequency.value=fr/2;lp.type='lowpass';lp.Q.value=5;lp.frequency.setValueAtTime(1600,t);lp.frequency.exponentialRampToValueAtTime(260,t+.25);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(v*.45,.0002),t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+.34);o.connect(lp);o2.connect(lp);lp.connect(g);g.connect(A.bus);o.start(t);o2.start(t);o.stop(t+.4);o2.stop(t+.4)},

function playStep(p,s,t,vol){vol=vol||{};const i=s%16;if(p.kick&&p.kick[i])V.kick(t,vol.kick??.9);if(p.snare&&p.snare[i])V.snare(t,vol.snare??.75);if(p.hat&&p.hat[i])V.hat(t,vol.hat??.5);if(p.bass&&p.bass[i])V.bass(t,p.bass[i],vol.bass??.7)}

class Looper{
  start(o){this.stop();initAudio();if(!A.ctx)return;this.o=o;this.on=true;this.step=0;this.next=now()+.08;this.q=[];
    this.timer=setInterval(()=>this.tick(),25);this.tick();
    const ui=()=>{while(this.q.length&&this.q[0][1]<=now()){const s=this.q.shift()[0];o.onStep&&o.onStep(s)}if(this.on||this.q.length)this.raf=requestAnimationFrame(ui)};this.raf=requestAnimationFrame(ui)}
  tick(){const o=this.o;while(this.on&&this.next<now()+.12){if(o.total&&this.step>=o.total){const end=this.next;this.on=false;clearInterval(this.timer);setTimeout(()=>{o.onEnd&&o.onEnd()},Math.max(0,(end-now())*1000));break}
    o.play(this.step,this.next);this.q.push([this.step,this.next]);const bpm=typeof o.bpm==='function'?o.bpm():o.bpm;this.next+=60/bpm/4;this.step++}}
  stop(){const was=this.on;this.on=false;clearInterval(this.timer);cancelAnimationFrame(this.raf);this.q=[];if(was&&this.o&&this.o.onStop)this.o.onStop()}}

function scopeDraw(g,t,cv){const W=cv.width,H=cv.height;px(g,0,0,W,H,'#08060f');for(let x=0;x<W;x+=8)px(g,x,0,1,H,'#140f24');px(g,0,H/2,W,1,'#1d1736');if(!A.an)return;const d=new Uint8Array(A.an.fftSize);A.an.getByteTimeDomainData(d);for(let x=0;x<W;x++){const v=d[Math.floor(x/W*d.length)]/128-1;const y=Math.floor(H/2-v*H*.9);px(g,x,clamp(y,0,H-1),1,1,'#ffb547')}}

function modal(inner,opt){opt=opt||{};const back=h('div','modal-back'+(opt.cls?' '+opt.cls:''));const m=h('div',opt.cls==='dramatic'?'modal':'modal win');
  if(typeof inner==='string')m.innerHTML=inner;else m.append(inner);back.append(m);app.append(back);back.close=()=>back.remove();

function reward(o){return new Promise(res=>{const before=lvProg();S.xp+=o.xp||0;S.coins+=o.coins||0;(o.cosmetics||[]).forEach(id=>{if(!S.owned.includes(id))S.owned.push(id)});save();const after=lvProg();
  const items=[];if(o.xp)items.push(`<b>+${o.xp}</b> XP`);if(o.coins)items.push(coinRow(o.coins));(o.lines||[]).forEach(l=>items.push(l));(o.cosmetics||[]).forEach(id=>items.push(`<span style="color:var(--violet)">NEW ${cos(id).slot==='kit'?'SOUND':'COSMETIC'}: ${cos(id).name.toUpperCase()}</span>`));
  const m=modal(`<p class="eyebrow">${o.eyebrow||'REWARD'}</p><h2 class="rw-t">${o.title}</h2>${o.sub?`<p class="muted">${o.sub}</p>`:''}<div class="rw-list">${items.map((x,i)=>`<div class="rw-i" style="animation-delay:${i*.15}s">${x}</div>`).join('')}</div>
  <div style="width:100%" class="stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">PRODUCER LV <span class="rw-lv">${before.n}</span></span><span class="num muted rw-xp" style="font-size:18px">${before.cur}/${before.need} XP</span></div><div class="bar"><i class="rw-bar" style="width:${before.cur/before.need*100}%"></i></div><p class="lvup" hidden></p></div>
  <button class="btn block rw-go">${o.btn||'CONTINUE'}</button>`);
  hydrateIcons(m);sfx.coin();
  setTimeout(()=>{const bar=$('.rw-bar',m);if(!bar)return;if(after.n>before.n){bar.style.width='100%';setTimeout(()=>{bar.style.transition='none';bar.style.width='0%';void bar.offsetWidth;bar.style.transition='';bar.style.width=after.cur/after.need*100+'%';$('.rw-lv',m).textContent=after.n;const up=$('.lvup',m);up.hidden=false;up.textContent='LEVEL UP! PRODUCER LV '+after.n;sfx.level();haptic([30,40,30])},650)}else bar.style.width=after.cur/after.need*100+'%';$('.rw-xp',m).textContent=after.cur+'/'+after.need+' XP'},450);
  $('.rw-go',m).onclick=()=>{sfx.tap();m.close();res()}})}

function unlockTool(id){if(!S.tools.includes(id))S.tools.push(id);save();const t=TOOLS.find(x=>x.id===id);

function bump(id,n,set){const q=QUESTS.find(x=>x.id===id);if(!q||S.quests.claimed.includes(id))return;if(q.needs&&!has(q.needs))return;const p=S.quests.prog;const before=p[id]||0;p[id]=clamp(set!=null?set:before+(n||1),0,q.goal);if(before<q.goal&&p[id]>=q.goal){toast('QUEST COMPLETE · '+q.title.toUpperCase());sfx.coin()}save()}

function typeText(el,text){if(typing)typing.finish();return new Promise(res=>{el.textContent='';let i=0;
  const fin=()=>{clearInterval(tm);el.textContent=text;typing=null;res()};
  const tm=setInterval(()=>{i+=2;el.textContent=text.slice(0,i);if(i%8===0&&A.ctx)tone(now(),'square',1100+Math.random()*300,.015,.03,null,A.sfxBus);if(i>=text.length)fin()},20);

/* ================= sequencer grid widget ================= */
const TR={kick:{n:'KICK',c:'#ffb547'},snare:{n:'SNARE',c:'#ff4f9a'},hat:{n:'HI-HAT',c:'#3ef0c8'},bass:{n:'BASS',c:'#a98bff'}};
function grid(host,o){host.innerHTML='';host.classList.add('seq');const cells={};
  const br=h('div','beatrow');for(let i=0;i<16;i++)br.append(h('span',i%4?'':'b',i%4?['','e','&amp;','a'][i%4]:String(i/4+1)));host.append(br);
  o.tracks.forEach(tk=>{const row=h('div','trk');const hd=h('div','trk-h',`<span class="dot" style="background:${TR[tk].c}"></span><span>${TR[tk].n}</span>`);
    if(o.faders){const f=h('input');f.type='range';f.min=0;f.max=100;f.value=Math.round(S.vols[tk]*100);f.id='vol-'+tk;f.setAttribute('aria-label',TR[tk].n+' volume');const vv=h('span','vv',f.value);
      f.oninput=()=>{S.vols[tk]=f.value/100;vv.textContent=f.value};f.onchange=()=>{addMastery('volume',2);if(!S.quests.moved.includes(tk)){S.quests.moved.push(tk);bump('balance',0,S.quests.moved.length)}save()};hd.append(f,vv)}
    row.append(hd);const cs=h('div','cells');cells[tk]=[];const ed=o.edit===true||!!(o.edit&&o.edit[tk]);
    for(let i=0;i<16;i++){const b=h('button','cell'+(i%4===0?' beat':''));b.style.setProperty('--c',TR[tk].c);b.setAttribute('aria-label',`${TR[tk].n} step ${i+1}`);if(!ed)b.classList.add('lockc');
      b.onclick=()=>{if(!ed)return;if(tk==='bass')o.pat.bass[i]=(o.pat.bass[i]+1)%6;else o.pat[tk][i]=o.pat[tk][i]?0:1;paint();if(o.pat[tk][i])audition(tk,o.pat[tk][i]);haptic(6);o.onChange&&o.onChange(tk,i)};
      cells[tk].push(b);cs.append(b)}
    row.append(cs);host.append(row)});
  let lastCol=-1;
  function paint(){o.tracks.forEach(tk=>cells[tk].forEach((b,i)=>{const v=o.pat[tk][i];b.classList.toggle('on',!!v);b.textContent=tk==='bass'&&v?NOTES[v]:''}))}
  paint();
  return{paint,step(i){if(lastCol>=0)o.tracks.forEach(tk=>cells[tk][lastCol].classList.remove('ph'));lastCol=i;if(i>=0)o.tracks.forEach(tk=>cells[tk][i].classList.add('ph'))},setPat(p){if(o.pat!==p){o.pat=p;paint()}}}}

/* ================= tap-along widget ================= */
function tapWidget(host,o,onResult){const taps=o.taps||8;
  host.innerHTML=`<div class="tapw"><div class="tapdots">${'<i></i>'.repeat(taps)}</div><button class="pad" aria-label="Tap pad">TAP</button><p class="tapmsg">${o.intro||'Press START. Four clicks count you in, then tap on every click.'}</p><button class="btn" data-a="start">START · ${o.bpm} BPM</button></div>`;
  const pad=$('.pad',host),msg=$('.tapmsg',host),dots=$$('.tapdots i',host),startB=$('[data-a=start]',host);let beats=[],active=false;const timers=[];
  const hit=e=>{if(e)e.preventDefault();if(!active||!A.ctx)return;pad.classList.add('pressed');setTimeout(()=>pad.classList.remove('pressed'),90);haptic(10);
    const lat=(A.ctx.outputLatency||A.ctx.baseLatency||0);const tt=now()-lat;let best=-1,bd=9;beats.forEach((b,i)=>{const d=Math.abs(tt-b.t);if(!b.hit&&d<bd){bd=d;best=i}});
    if(best>=0&&bd<(o.tol||.13)){beats[best].hit=true;dots[best].className='hit';msg.textContent=bd<.05?'PERFECT!':(tt<beats[best].t?'Good (a little early)':'Good (a little late)')}else if(best>=0){const d=tt-beats[best].t;msg.textContent=d<0?'Too early. Wait for the click.':'Too late. Tap with the click, not after it.'}};
  pad.addEventListener('pointerdown',hit);
  const key=e=>{if(!host.isConnected){document.removeEventListener('keydown',key);return}if(e.code==='Space'&&active)hit(e)};document.addEventListener('keydown',key);
  startB.onclick=()=>{initAudio();if(!A.ctx)return;stopMusic();startB.disabled=true;dots.forEach(d=>d.className='');const spb=60/o.bpm;const t0=now()+.35;beats=[];
    for(let k=0;k<4+taps;k++){const t=t0+k*spb;V.click(t,k%4===0);if(o.groove)V.hat(t,.25);if(k>=4)beats.push({t,hit:false});
      timers.push(setTimeout(()=>{if(!host.isConnected)return;pad.classList.add('flash');setTimeout(()=>pad.classList.remove('flash'),110);if(k<4){msg.textContent='Count-in… '+(k+1);if(k===3)setTimeout(()=>{active=true;msg.textContent='TAP!'},spb*500)}else{dots.forEach(d=>d.classList.remove('now'));if(!dots[k-4].className)dots[k-4].classList.add('now')}},(t-now())*1000))}
    const endT=t0+(4+taps)*spb;timers.push(setTimeout(()=>{if(!host.isConnected)return;active=false;dots.forEach((d,i)=>{if(!beats[i].hit)d.className='miss'});const n=beats.filter(b=>b.hit).length;const pass=n>=o.need;startB.disabled=false;startB.textContent='TRY AGAIN';
      msg.textContent=pass?`${n}/${taps} on the beat. Locked in!`:`${n}/${taps} on the beat. You need ${o.need}. Count “1, 2, 3, 4” out loud and tap on each number.`;onResult({pass,n})},(endT-now())*1000+250))};
  return{stop(){timers.forEach(clearTimeout);active=false}}}

function abWidget(host,items,onBoth){host.innerHTML='';const wrap=h('div','ab');const heard=new Set();const scope=lowres(96,24,'scope');addLive(scope,scopeDraw);

function scoreBeat(p,v){const n=k=>p[k].filter(Boolean).length;const used=['kick','snare','hat','bass'].filter(k=>n(k)>0);const tips=[];
  let rhythm=40;if(p.kick[0])rhythm+=20;else tips.push('Try a kick on step 1. It tells the listener where the bar starts.');if(p.snare[4]||p.snare[12])rhythm+=20;else tips.push('A snare on beat 2 or 4 (step 5 or 13) gives people something to nod to.');if(n('hat')>=4)rhythm+=20;else tips.push('A few more hi-hats would keep time between the big hits.');
  let structure=0;if(used.some(k=>p[k][0]))structure+=34;const halves=['kick','bass'].some(k=>p[k].slice(0,8).some(Boolean)&&p[k].slice(8).some(Boolean));if(halves)structure+=33;else tips.push('Spread the low end across both halves of the bar so it doesn’t feel lopsided.');const tot=used.reduce((a,k)=>a+n(k),0);if(tot>=10&&tot<=40)structure+=33;else tips.push(tot<10?'The groove is very sparse. That can work, but try a few more hits.':'Lots of hits. Leaving some gaps lets the groove breathe.');
  let balance=100;if(v.hat>v.kick){balance-=25;tips.push('Your hi-hats are louder than your kick. Hats usually sit quieter.')}if(used.some(k=>v[k]<.15)){balance-=20;tips.push('One track is almost silent. Bring it up or remove it.')}if(used.length&&used.every(k=>v[k]>=.95)){balance-=20;tips.push('Every fader is maxed out. Pulling some down makes room for the rest.')}balance=Math.max(40,balance);
  let creativity=40;const notes=new Set(p.bass.filter(Boolean));if(notes.size>=2)creativity+=20;else tips.push('Tap a bass cell again to change its note. Two or three different notes make a bassline.');if(used.some(k=>p[k].some((x,i)=>x&&i%2===1)))creativity+=20;else tips.push('Hits on the in-between steps (2, 4, 6…) add syncopation, that bouncy feeling.');const bb=pat({kick:[0,8],snare:[4,12],hat:EIGHTHS});if(['kick','snare','hat'].some(k=>p[k].some((x,i)=>!!x!==!!bb[k][i])))creativity+=20;
  const completion=used.length*25;const overall=Math.round((rhythm+structure+balance+creativity+completion)/5);return{rhythm,structure,balance,creativity,completion,overall,tips:tips.slice(0,3),used}}

    $$('[data-k]',m).forEach(b=>b.onclick=()=>{if(!S.owned.includes(b.dataset.k)){toast('LOCKED · '+cos(b.dataset.k).how.toUpperCase());return}S.kit=b.dataset.k;save();initAudio();if(A.ctx){V.kick(now()+.02,.9);V.snare(now()+.3,.8)}$$('[data-k]',m).forEach(x=>x.classList.toggle('on',x===b))});$('.kit-done',m).onclick=()=>{m.close();seq.stop();RENDER.studio(scr,arg)}};
  if(ch)$('[data-a=submit]',daw).onclick=()=>{seq.stop();submitBeat()}};

function submitBeat(){const r=scoreBeat(S.pattern,S.vols);const label=r.overall>=90?'LEGENDARY LOOP':r.overall>=75?'FRESH GROOVE':r.overall>=55?'SOLID START':'ROUGH DEMO';
  const rows=[['Rhythm',r.rhythm],['Structure',r.structure],['Balance',r.balance],['Creativity',r.creativity],['Completion',r.completion]];
  const m=modal(`<p class="eyebrow">FIRST BEAT · RESULTS</p><h2 class="rw-t">${label}</h2><p class="num" style="font-size:52px;line-height:.9;color:var(--neon)">${r.overall}</p>
   <div class="scorebars">${rows.map(([n,v])=>`<div><span>${n}</span><span class="bar"><i style="width:${v}%;--c:${v>=80?'var(--neon)':'var(--amber)'}"></i></span><span class="num">${v}</span></div>`).join('')}</div>
   ${r.tips.length?`<div class="tips"><p class="eyebrow" style="padding:0">PIP'S NOTES FOR NEXT TIME</p>${r.tips.map(t=>`<p>${t}</p>`).join('')}</div>`:'<p style="color:var(--neon)">PIP: I have nothing to add. That groove is ready for a real track.</p>'}
   <button class="btn block big sb-ok">CLAIM REWARD</button><button class="btn ghost block sb-again">KEEP TWEAKING</button>`);
  sfx.victory();$('.sb-again',m).onclick=()=>m.close();
  $('.sb-ok',m).onclick=async()=>{m.close();const first=!S.done.includes('challenge');S.best=Math.max(S.best||0,r.overall);if(first){S.done.push('challenge');addMastery('drums',25);addMission('drums');addMastery('volume',10);addMission('volume')}save();
    await reward({eyebrow:'CHALLENGE COMPLETE',title:'FIRST BEAT',xp:first?200:20,coins:first?60:5,cosmetics:first?['phones-leaf']:[],lines:[`SCORE ${r.overall} · ${label}`]});if(first)toast('THE RHYTHM BEAST AWAKENS…');go('region')}}

/* ---------- victory ---------- */
RENDER.victory=scr=>{scr.innerHTML=`<div class="stack" style="padding-top:24px;text-align:center"><p class="eyebrow" style="color:var(--leaf)">WORLD 1 · BEAT FOREST</p><h1 class="logo" style="font-size:40px">FOREST<span>CLEARED</span></h1><div class="victory-hero"></div>
  <div class="statgrid"><div class="stat"><b>${S.lessons}</b><span>lessons</span></div><div class="stat"><b>${S.defeated.length}</b><span>monsters</span></div><div class="stat"><b>${S.tools.length}</b><span>tools</span></div><div class="stat"><b>${S.best||0}</b><span>best beat</span></div></div>
  <div class="win stack" style="text-align:left"><p class="eyebrow">WHAT YOU CAN DO NOW</p><div class="learned"><span>Hear and set BPM</span><span>Count bars in 4/4</span><span>Read a 16-step grid</span><span>Kick, snare, hat roles</span><span>Program a backbeat</span><span>Quantize to a grid</span><span>Hear swing</span><span>Add syncopation</span></div>
  <p style="font-size:15px">Open Ableton's Drum Rack, FL Studio's Channel Rack or Logic's Step Sequencer and you'll find this same grid. You already know how to use it.</p></div>
  <div class="win raised stack" style="text-align:left"><p class="eyebrow" style="color:var(--magenta)">NEXT</p><h3>The Synth Caves await</h3><p class="muted" style="font-size:15px">Oscillators, filters and envelopes. The Synth Dragon guards the Synthesizer there. Coming in the full adventure.</p></div>
  <button class="btn big block" data-a="studio">OPEN MY STUDIO</button><button class="btn ghost block" data-a="home">BACK HOME</button></div>`;
  const v=$('.victory-hero',scr);v.append(heroEl(6,'bob'),pipEl(4,'float'));const cp=companionEl(4);if(cp)v.append(cp);
  $('[data-a=studio]',scr).onclick=()=>go('studio');$('[data-a=home]',scr).onclick=()=>go('home')};

/* ---------- quests ---------- */
RENDER.quests=scr=>{const d=new Date(),mid=new Date(d);mid.setHours(24,0,0,0);const ms=mid-d;const hh=Math.floor(ms/3.6e6),mm=Math.floor(ms%3.6e6/6e4);
  scr.innerHTML=topbar('DAILY QUESTS')+`<p class="muted">New quests in <span class="num" style="font-size:19px;color:var(--ink)">${hh}h ${mm}m</span>. Quests reward XP, coins, sounds and cosmetics.</p><div class="stack ql" style="margin-top:12px"></div>`;
  const ql=$('.ql',scr);QUESTS.forEach(q=>{const pr=S.quests.prog[q.id]||0,claimed=S.quests.claimed.includes(q.id),lock=q.needs&&!has(q.needs),done=pr>=q.goal;
    const c=h('div','win quest'+(claimed?' claimed':''));c.innerHTML=`<canvas class="px" data-ic="${q.icon}" data-sc="4"${lock?' data-dim="1"':''}></canvas><div class="grow stack" style="gap:4px"><span class="t">${q.title}</span><span class="d">${lock?'Unlocks with the Drum Machine':q.desc}</span><div class="bar" style="height:9px"><i style="width:${pr/q.goal*100}%;--c:var(--neon)"></i></div><span class="rw">+${q.xp} XP · +${q.coins} COINS${q.reward?' · '+cos(q.reward).name.toUpperCase():''}</span></div>${claimed?'<span class="chip neon">DONE</span>':done?'<button class="btn sm neon">CLAIM</button>':`<span class="num muted" style="font-size:20px">${pr}/${q.goal}</span>`}`;
    const b=$('button',c);if(b)b.onclick=async()=>{b.disabled=true;S.quests.claimed.push(q.id);save();await reward({eyebrow:'QUEST REWARD',title:q.title.toUpperCase(),xp:q.xp,coins:q.coins,cosmetics:q.reward?[q.reward]:[]});RENDER.quests(scr)};ql.append(c)});hydrateIcons(scr)};

/* ---------- inventory ---------- */
let bagTab='tools';
RENDER.bag=scr=>{scr.innerHTML=topbar('INVENTORY')+`<div class="tabs"><button data-t="tools" class="${bagTab==='tools'?'on':''}">TOOLS</button><button data-t="style" class="${bagTab==='style'?'on':''}">STYLE</button></div><div class="stack bagc" style="margin-top:12px"></div>`;hydrateIcons(scr);
  $$('[data-t]',scr).forEach(b=>b.onclick=()=>{bagTab=b.dataset.t;sfx.tap();RENDER.bag(scr)});const c=$('.bagc',scr);
  if(bagTab==='tools'){c.innerHTML=`<p class="muted">Every production tool is a weapon. You earn each one by learning it. ${S.tools.length} of ${TOOLS.length} unlocked.</p><div class="tools"></div>`;const tg=$('.tools',c);
    TOOLS.forEach(t=>{const hv=has(t.id);const ms=S.mastery[t.id]||0;const b=h('button','tool '+(hv?'have':'locked'));b.append(icon(t.id,t.col,4,!hv));b.insertAdjacentHTML('beforeend',`<span class="n">${t.name}</span><span class="w">${hv?t.weapon:'???'}</span><span class="r">LV ${t.lv} · ${t.world.toUpperCase()}</span>${hv?`<div class="bar"><i style="width:${ms}%"></i></div><span class="r">MASTERY ${ms}% · ${S.missions[t.id]||0} MISSIONS${ms>=100?' · MASTERED':''}</span>`:'<span class="r">LOCKED</span>'}`);
      b.onclick=()=>{sfx.tap();toolInfo(t)};tg.append(b)})}
  else{const slots=[['hoodie','HOODIE'],['phones','HEADPHONES'],['hair','HAIR'],['comp','COMPANION']];c.innerHTML=`<div class="win dressing"></div><p class="muted" style="font-size:14px">Cosmetics are just for style. They never change combat or scores. You have ${S.coins} coins.</p>${slots.map(([s,n])=>`<div class="stack" style="gap:8px"><p class="eyebrow">${n}</p><div class="swatches">${COS.filter(x=>x.slot===s).map(x=>{const own=S.owned.includes(x.id);return`<button class="sw ${S.eq[s]===x.id?'on':''} ${own?'':'lock'}" data-c="${x.id}"><i style="background:${x.col}"></i>${x.name}${own?'':x.price?` · <span style="color:var(--amber)">${x.price}c</span>`:' · LOCKED'}</button>`}).join('')}</div></div>`).join('')}`;
    const dr=$('.dressing',c);dr.append(heroEl(6,'bob'));const cp=companionEl(4);if(cp)dr.append(cp);
    $$('[data-c]',c).forEach(b=>b.onclick=()=>{const x=cos(b.dataset.c);if(!S.owned.includes(x.id)){if(x.price){if(b.dataset.arm){if(S.coins>=x.price){S.coins-=x.price;S.owned.push(x.id);S.eq[x.slot]=x.id;save();sfx.coin();RENDER.bag(scr)}else{toast('NOT ENOUGH COINS · QUESTS AND BATTLES EARN MORE');sfx.bad()}}else{b.dataset.arm=1;b.innerHTML=`<i style="background:${x.col}"></i>TAP TO BUY · ${x.price}c`}}else toast('LOCKED · '+x.how.toUpperCase());return}S.eq[x.slot]=x.id;save();sfx.tap();RENDER.bag(scr)})}};
function toolInfo(t){const hv=has(t.id);const m=modal(`<div class="ti-ic"></div><p class="eyebrow">${hv?'WEAPON FORM · '+t.weapon.toUpperCase():'LOCKED · LV '+t.lv+' · '+t.world.toUpperCase()}</p><h2>${t.name}</h2><p>${t.desc}</p><div class="win raised" style="text-align:left;width:100%"><p class="eyebrow" style="margin-bottom:6px">IN A REAL DAW</p><p style="font-size:15px">${t.daw}</p></div>${hv?`<p class="muted">Mastery ${S.mastery[t.id]||0}% · ${S.missions[t.id]||0} missions completed</p>`:''}<button class="btn block ti-x">${hv?'USE IN STUDIO':'CLOSE'}</button>`,{dismiss:true});
  $('.ti-ic',m).append(icon(t.id,t.col,8,!hv));$('.ti-x',m).onclick=()=>{m.close();if(hv)go('studio')}}

/* ---------- AI coach ---------- */
let samplePromise=null;
function getSample(){if(!samplePromise)samplePromise=(window.claude&&window.claude.use?Promise.resolve(window.claude.use('sample')):Promise.resolve(null)).catch(()=>null);return samplePromise}
const CANNED={
'Why does my bass sound muddy?':'Muddy bass usually means too many sounds are fighting in the low frequencies. Often it is the kick and the bass hitting at the same moment with the same weight.\n\nQuick fixes: let the kick and bass take turns (put bass notes between kicks), or turn one of them down a little.\n\nTry it: in your studio, move a bass note off step 1 so it lands just after the kick. In the EQ Desert you will learn to carve the lows with an EQ.',
'How do I make my kick punchier?':'Punch is mostly about contrast. A kick feels punchy when it has room around it.\n\nGive it space: keep other drums off the exact same step, and turn the hats and bass down a touch so the kick stands out.\n\nTry it: in your studio set the kick fader around 90 and the hats around 45. Later, the Compressor in Compression Volcano adds even more snap.',
'What does attack mean on a compressor?':'A compressor turns loud moments down. Attack is how fast it reacts.\n\nFast attack grabs the very start of a sound and flattens it. Slow attack lets the first hit through before clamping down, which makes drums sound punchier.\n\nYou will earn the Compressor in Compression Volcano. For now, remember: slow attack = more punch.',
'Why does my mix sound quiet?':'Usually one of two things: everything is turned down, or one sound is so loud it forces everything else down with it.\n\nBalance first. Find your loudest element (often the kick) and make everything else sit around it. Loudness comes at the very end, with a Limiter in the Mastering Sky.\n\nTry it: bring every studio fader to about 70, then nudge each one until nothing hides.',
'How do I make a synth sound darker?':'Dark means less high frequency. The main tool is a low-pass filter: it lets the lows through and cuts the highs.\n\nTurn the filter cutoff down and the synth gets warmer and darker. A softer waveform (sine or triangle instead of saw) helps too.\n\nYou will learn this hands-on in the Synth Caves.',
'What is BPM?':'BPM means beats per minute: how many beats happen in one minute. It sets the speed of a song.\n\n60 BPM is one beat per second, 120 BPM is two. Lo-fi hip-hop often sits around 70 to 90, house around 120 to 128, drum & bass around 170.\n\nTry it: in your studio, press play and tap + or − on the tempo. Same pattern, different mood.',
'What does quantize do?':'Quantize snaps notes onto a grid so they land exactly in time.\n\nWhen you play notes by hand, some are a little early or late. Quantize moves each one to the nearest grid line. Pick the grid that matches your rhythm: 1/8 for eighth notes, 1/16 for faster sixteenths.\n\nYou used it against the Broken Metronome. In a real DAW, select the notes and use the Quantize command.',
'Why are there 16 steps?':'One bar of 4/4 has 4 beats. A step sequencer splits each beat into 4 smaller steps, so 4 × 4 = 16 steps.\n\nSteps 1, 5, 9 and 13 are the beats. The steps in between are where hi-hats, extra kicks and syncopation live.\n\nTry it: put a hi-hat on every odd step, then add one on step 16 and hear the little push into the next bar.',
'How do I make my beat groove more?':'Groove comes from contrast and small surprises.\n\n- Add a hit on an in-between step (like step 11 or 16) for syncopation.\n- Keep the hi-hats quieter than the kick and snare.\n- Leave some gaps. Silence makes the hits feel bigger.\n\nTry it: in your studio, move one kick from step 9 to step 11 and listen to the bounce.',
'What is the difference between kick and snare?':'The kick is the low thump you feel in your chest. It usually lands on beats 1 and 3 and anchors the groove.\n\nThe snare is the bright crack. On beats 2 and 4 it becomes the backbeat, the part people clap to.\n\nTry it: put the kick on steps 1 and 9 and the snare on steps 5 and 13. That is the backbeat.'};
function openCoach(){const sh=h('div','sheet');const turns=[];let ctl=null;
  sh.innerHTML=`<div class="sheet-in"><div class="sheet-h"><span class="pipbox"></span><div class="grow"><h3>PIP</h3><p class="muted" style="font-size:14px">Producer mentor · explains at your level (LV ${level()})</p></div><button class="iconbtn" data-a="close" aria-label="Close">✕</button></div><div class="msgs"></div><div class="chips">${Object.keys(CANNED).map(q=>`<button>${q}</button>`).join('')}</div><form class="composer"><input id="coach-in" placeholder="Ask about beats, mixing, sound…" autocomplete="off" aria-label="Ask PIP a question"><button class="btn sm" type="submit">ASK</button></form></div>`;
  app.append(sh);$('.pipbox',sh).append(pipEl(3,'float'));const msgs=$('.msgs',sh);
  const add=(txt,who)=>{const m=h('div','msg '+who);m.textContent=txt;msgs.append(m);msgs.scrollTop=msgs.scrollHeight;return m};
  add('Hey producer! I’m PIP. Ask me anything about making music. I’ll keep it simple and tell you where in the adventure you’ll master it.','pip');
  getSample().then(s=>{if(s||!sh.isConnected)return;$('.composer',sh).hidden=true;$('.chips',sh).classList.add('wrap');add('Offline coach: tap a question below.','note')});
  const close=()=>{ctl&&ctl.abort();sh.remove()};$('[data-a=close]',sh).onclick=close;sh.addEventListener('click',e=>{if(e.target===sh)close()});
  const RULES=()=>`You are PIP, a small amber speaker-robot who mentors players in BEAT QUEST, a pixel-art RPG that teaches music production. Talk like a friendly, encouraging producer. The player is Producer Level ${level()} and has explored Beat Forest (rhythm, BPM, bars, kick/snare/hi-hat, quantize). Unlocked tools: ${S.tools.join(', ')}. Rules: plain language for a beginner; define any technical word the first time you use it; at most about 110 words; give one concrete example; end with one small thing to try (in the game's studio drum machine if it fits, otherwise in any DAW). Plain text only: no markdown headings, no asterisks, at most 3 short bullet lines. If the topic is beyond their level, give the simple version and name the world that teaches it: Synth Caves (synths, ADSR, filters, LFO), EQ Desert (EQ, frequencies, masking), Compression Volcano (compression, distortion), Reverb Swamp (reverb, delay), Mixing Castle (gain staging, panning, automation), Mastering Sky (limiting, LUFS, export).`;
  let busy=false;
  const ask=async q=>{q=q.trim();if(!q||busy)return;busy=true;add(q,'me');$('#coach-in',sh).value='';const bub=add('Thinking…','pip');const sample=await getSample();
    const fallback=()=>{const k=Object.keys(CANNED).find(x=>x.toLowerCase()===q.toLowerCase());bub.textContent=k?CANNED[k]:'Live answers aren’t available in this view, so I can only answer the suggested questions right now. Tap one of the chips below.'};
    if(!sample){fallback();busy=false;return}
    turns.push({role:'user',content:q});ctl=new AbortController();
    try{const {text}=await sample([{role:'user',content:RULES()},...turns.slice(-8)],{cache:false,modelTier:'quick',signal:ctl.signal,onText:({text})=>{bub.textContent=text;msgs.scrollTop=msgs.scrollHeight}});turns.push({role:'assistant',content:text})}
    catch(e){turns.pop();const code=e&&e.code;if(code==='cancelled'){}else if(e&&e.text)bub.textContent=e.text;else if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code))fallback();else if(code==='rate_limited')bub.textContent='I need a short break. Ask me again in a minute.';else if(code==='refused')bub.textContent='I can’t help with that one. Ask me something about making music.';else bub.textContent='My signal dropped. Ask again in a moment.'}
    finally{busy=false}};
  $$('.chips button',sh).forEach(b=>b.onclick=()=>ask(b.textContent));$('.composer',sh).onsubmit=e=>{e.preventDefault();ask($('#coach-in',sh).value)}}

/* ================= platform hooks: Android back button, app pause ================= */
window.bqBack=()=>{const sh=$('.sheet');if(sh){const c=$('[data-a=close]',sh);if(c)c.click();else sh.remove();return'ok'}
  const mods=$$('.modal-back');if(mods.length){const m=mods[mods.length-1];const b=$('.rw-go,.ul-later,.sb-again,.kit-done,.st-cl,.wi-ok',m);if(b)b.click();else m.remove();return'ok'}
  const up={lesson:'region',battle:'region',region:'map',studio:$('#s-studio [data-back]')?'region':'home',map:'home',quests:'home',bag:'home',victory:'home'}[cur];
  if(up){sfx.tap();go(up);return'ok'}return'exit'};
window.bqPause=()=>{seq.stop();stopMusic();if(A.ctx&&A.ctx.state==='running')A.ctx.suspend()};
window.bqResume=()=>{if(!A.ctx)return;const p=A.ctx.resume();if(p&&p.catch)p.catch(()=>{});if(['home','map','region','quests','bag'].includes(cur))startMusic()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)bqPause();else bqResume()});

/* ================= boot ================= */
$$('#nav button').forEach(b=>b.onclick=()=>{sfx.tap();go(b.dataset.go)});
hydrateIcons($('#nav'));
load();getSample();go('title');
</script>
